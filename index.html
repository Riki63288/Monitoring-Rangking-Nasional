    const dupInfo = detectDuplicates(parsed.rawRecords);
    State.uploadPreview = { file, parsed, dupInfo, resolution: dupInfo.duplicateCodes.length ? null : 'none' };
    hideLoadingOverlay();
    renderUploadPreview();
    showToast('File berhasil dibaca.', 'success');
  } catch (err) {
    console.error(err); hideLoadingOverlay();
    previewArea.innerHTML = `<div class="alert alert-error">Gagal membaca file: ${escapeHtml(err.message || 'format file tidak dikenali')}</div>`;
    showToast('Upload gagal.', 'error');
  }
}

function renderUploadPreview() {
  const up = State.uploadPreview;
  const previewArea = document.getElementById('upload-preview-area');
  if (!up) { previewArea.innerHTML = ''; return; }

  if (up.dupInfo.duplicateCodes.length > 0 && !up.resolution) {
    const rowsHtml = up.dupInfo.duplicateCodes.map(code => {
      const rows = up.dupInfo.duplicateGroups.get(code);
      return `<tr><td>${escapeHtml(code)}</td><td>${rows.map(r => `#${r.__excelRow} (${escapeHtml(r.namaSalesman)})`).join(', ')}</td></tr>`;
    }).join('');
    previewArea.innerHTML = `
      <div class="alert alert-warn">Ditemukan <strong>${up.dupInfo.duplicateCodes.length}</strong> Kode Salesman duplikat dalam file ini. Pilih tindakan sebelum melanjutkan preview.</div>
      <div class="dt-scroll"><table class="dt-table dt-table-sm"><thead><tr><th>Kode Salesman</th><th>Baris Excel Terdampak</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
      <div class="upload-form-row" style="margin-top:14px;">
        <label style="flex-direction:row;align-items:center;gap:6px;"><input type="radio" name="dup-resolution" value="cancel" checked /> Batalkan upload</label>
        <label style="flex-direction:row;align-items:center;gap:6px;"><input type="radio" name="dup-resolution" value="last" /> Gunakan baris terakhir</label>
        <label style="flex-direction:row;align-items:center;gap:6px;"><input type="radio" name="dup-resolution" value="first" /> Gunakan baris pertama</label>
      </div>
      <div class="upload-actions">
        <button class="btn btn-ghost" id="cancel-upload-btn">Batalkan</button>
        <button class="btn btn-primary" id="apply-dup-resolution-btn">Terapkan &amp; Lanjutkan</button>
      </div>`;
    document.getElementById('cancel-upload-btn').addEventListener('click', () => { State.uploadPreview = null; previewArea.innerHTML = ''; document.getElementById('file-input').value = ''; });
    document.getElementById('apply-dup-resolution-btn').addEventListener('click', () => {
      const choice = previewArea.querySelector('input[name="dup-resolution"]:checked').value;
      if (choice === 'cancel') { State.uploadPreview = null; previewArea.innerHTML = ''; document.getElementById('file-input').value = ''; showToast('Upload dibatalkan karena duplikasi.', 'info'); return; }
      up.resolution = choice; renderUploadPreview();
    });
    return;
  }

  const resolved = up.resolution === 'none' ? up.parsed.rawRecords : resolveDuplicates(up.parsed.rawRecords, up.resolution).records;
  const validation = validateDataset(resolved);
  const tatValidation = validateTatDataset(resolved);
  up.resolvedRecords = resolved; up.validation = validation; up.tatValidation = tatValidation;

  const regions = new Set(resolved.map(r => r.region)).size, depos = new Set(resolved.map(r => r.depo)).size, asses = new Set(resolved.map(r => r.namaAss)).size;
  const sampleRows = resolved.slice(0, 8);

  // B1: hitung status dari properti yang SUDAH dibentuk parser (statusSalesmanSumber/keteranganKosong),
  // bukan dari string nama aktif.
  const statusCounts = { MATCH: 0, PENGGANTI: 0, VACANT: 0 };
  let keteranganKosongCount = 0;
  resolved.forEach(r => { const s = r.statusSalesmanSumber || 'MATCH'; statusCounts[s] = (statusCounts[s] || 0) + 1; if (r.keteranganKosong) keteranganKosongCount++; });
  const cabangAktif = new Set();

  // B2: hasil join Master Cabang (atau pesan jika belum tersedia - jangan tampilkan angka match palsu).
  const masterAvail = !!(State.masterCabang && State.masterCabang.byKodeDepo && State.masterCabang.byKodeDepo.size);
  let kodeMatchCount = 0, kodeNotFoundCount = 0, regionDiffCount = 0;
  if (masterAvail) {
    resolved.forEach(r => {
      const entry = State.masterCabang.byKodeDepo.get(normalizeCabangCode(r.kodeDepo));
      if (entry) {
        kodeMatchCount++; cabangAktif.add(entry.cabang);
        if (r.region && String(r.region).trim().toUpperCase() !== String(entry.region).trim().toUpperCase()) regionDiffCount++;
      } else kodeNotFoundCount++;
    });
  }

  // B4: Pareto/Retail/Mix adalah field OPSIONAL - pisahkan dari daftar "fallback posisi kolom" wajib.
  const requiredNotFound = up.parsed.notFound.filter(key => key !== 'paretoRetailMix' && key !== 'keterangan' && key !== 'tatMtd');
  const paretoMissing = up.parsed.notFound.includes('paretoRetailMix');
  const keteranganMissing = up.parsed.notFound.includes('keterangan');

  // B3: tabel perubahan - utamakan Pengganti/Vacant/Keterangan kosong/Kode Depo tidak ditemukan/Regional berbeda.
  const changeRows = resolved.filter(r => {
    if (r.statusSalesmanSumber === 'PENGGANTI' || r.statusSalesmanSumber === 'VACANT') return true;
    if (r.keteranganKosong) return true;
    if (masterAvail) {
      const entry = State.masterCabang.byKodeDepo.get(normalizeCabangCode(r.kodeDepo));
      if (!entry) return true;
      if (r.region && String(r.region).trim().toUpperCase() !== String(entry.region).trim().toUpperCase()) return true;
    }
    return false;
  });

  previewArea.innerHTML = `
    <div class="upload-preview">
      ${up.resolution !== 'none' ? `<div class="alert alert-info">Resolusi duplikat diterapkan: <strong>${up.resolution === 'last' ? 'menggunakan baris terakhir' : 'menggunakan baris pertama'}</strong> untuk ${up.dupInfo.duplicateCodes.length} kode yang duplikat.</div>` : ''}
      <h3>Preview Data</h3>
      <div class="stat-grid">
        ${statInfo('Nama File', up.file.name)}${statInfo('Sheet', up.parsed.sheetName)}${statInfo('Baris Terbaca', resolved.length)}
        ${statInfo('Regional', regions)}${statInfo('Cabang Aktif', masterAvail ? cabangAktif.size : '-')}${statInfo('Depo', depos)}${statInfo('ASS', asses)}
        ${statInfo('Data Valid', validation.totalEligible)}${statInfo('Data Bermasalah', validation.totalNotEligible)}${statInfo('TAT MTD', tatValidation.valid ? fmtPercent(tatValidation.tatMtd) : 'Tidak Valid')}
      </div>
      <h3>Status Salesman</h3>
      <div class="stat-grid">
        ${statInfo('Match', statusCounts.MATCH)}${statInfo('Pengganti', statusCounts.PENGGANTI)}${statInfo('Vacant', statusCounts.VACANT)}${statInfo('Keterangan Kosong', keteranganKosongCount)}
      </div>
      ${keteranganMissing ? `<div class="alert alert-info">Kolom Keterangan tidak ditemukan pada file ini — seluruh baris diperlakukan sebagai Match.</div>` : ''}
      <h3>Hasil Join Master Cabang</h3>
      ${masterAvail ? `<div class="stat-grid">
        ${statInfo('Kode Depo Match Master', kodeMatchCount)}${statInfo('Kode Depo Tidak Ditemukan', kodeNotFoundCount)}${statInfo('Perbedaan Regional', regionDiffCount)}
      </div>` : `<div class="alert alert-warn">Master Cabang belum tersedia. Validasi Cabang dan kecocokan Kode Depo belum dilakukan.</div>`}
      <h3>Hasil Validasi</h3>
      <div class="validation-summary">
        <div class="v-item ${requiredNotFound.length === 0 ? 'ok' : 'warn'}">Kolom wajib ditemukan by nama: ${(APP_CONFIG.FIELD_MAP.length - up.parsed.notFound.length)} / ${APP_CONFIG.FIELD_MAP.length}
          ${requiredNotFound.length ? `<div class="v-detail">Fallback posisi kolom dipakai untuk: ${requiredNotFound.join(', ')}</div>` : ''}</div>
        ${paretoMissing ? `<div class="v-item info">Kolom opsional tidak ditemukan: Pareto / Retail / Mix.</div>` : ''}
        <div class="v-item ${up.parsed.skippedTemplateRows > 0 ? 'info' : ''}">Baris template/duplikat header dilewati: ${up.parsed.skippedTemplateRows}</div>
        <div class="v-item ${up.dupInfo.duplicateCodes.length ? 'warn' : 'ok'}">Duplikasi Kode Salesman terdeteksi: ${up.dupInfo.duplicateCodes.length}</div>
        <div class="v-item ${validation.totalNotEligible ? 'warn' : 'ok'}">Data tidak lengkap / nilai tidak valid / pembagi nol: ${validation.totalNotEligible}</div>
        <div class="v-item ${(!up.parsed.notFound.includes('totalCallEsuite') || up.parsed.rawRecords.some(r => Number.isFinite(r.totalCallEsuite))) ? 'ok' : 'warn'}">
          Struktur EC vs Call Total: <strong>TOTAL CALL ESUITE</strong>
          <div class="v-detail">Sumber: header TOTAL CALL ESUITE (fallback W/index 22) • Formula: AVG EC ÷ TOTAL CALL ESUITE × 100%</div>
        </div>
        <div class="v-item ${isValidWorkdayMtdValue(up.parsed.workdayMtd) ? 'ok' : 'warn'}">
          Hari Kerja (HK) MTD: <strong>${isValidWorkdayMtdValue(up.parsed.workdayMtd) ? `${fmtNumber(up.parsed.workdayMtd, 0)} HK` : 'Tidak valid'}</strong>
          <div class="v-detail">Sumber: sheet ${escapeHtml(up.parsed.sheetName)} cell ${WORKDAY_MTD_CELL} • ${isValidWorkdayMtdValue(up.parsed.workdayMtd) ? 'Nilai terbaca sebagai bilangan bulat 1–31.' : 'Nilai G2 kosong/bukan bilangan bulat 1–31. HK disimpan kosong dan ditampilkan "- HK" (tidak dikarang).'}</div>
        </div>
        <div class="v-item ${tatValidation.valid ? 'ok' : 'warn'}">
          TAT MTD: <strong>${tatValidation.valid ? fmtPercent(tatValidation.tatMtd) : 'Tidak valid'}</strong>
          <div class="v-detail">Sumber: ${up.parsed.notFound.includes('tatMtd') ? 'fallback kolom AG/index 32' : 'header TAT MTD'} • Variasi: ${fmtNumber(tatValidation.variationCount)} • ${escapeHtml(tatValidationMessage(tatValidation))}</div>
          ${tatValidation.conflictSamples.length > 1 ? `<div class="v-detail">Contoh konflik: ${tatValidation.conflictSamples.map(item => `${fmtPercent(item.value)} (baris ${item.rows.join(', ')})`).join(' | ')}</div>` : ''}
        </div>
      </div>
      <h3>Tabel Perubahan Salesman ${changeRows.length ? `(${fmtNumber(changeRows.length)} baris)` : ''}</h3>
      ${changeRows.length ? `<div class="dt-scroll"><table class="dt-table dt-table-sm">
        <thead><tr><th>Kode Salesman</th><th>Nama Awal</th><th>Nama Aktif</th><th>Status</th><th>Depo</th><th>Cabang</th><th>Regional</th><th>Keterangan</th></tr></thead>
        <tbody>${changeRows.slice(0, 200).map(r => {
          const entry = masterAvail ? State.masterCabang.byKodeDepo.get(normalizeCabangCode(r.kodeDepo)) : null;
          const statusLabel = STATUS_SALESMAN_LABELS[r.statusSalesmanSumber] || 'Match';
          return `<tr><td>${escapeHtml(r.kodeSalesman)}</td><td>${escapeHtml(r.namaSalesmanAwal || r.namaSalesman)}</td><td>${escapeHtml(r.namaSalesmanAktif || r.namaSalesman)}</td><td>${escapeHtml(statusLabel)}</td><td>${escapeHtml(r.depo)}</td><td>${escapeHtml(entry ? entry.cabang : '-')}</td><td>${escapeHtml(r.region)}</td><td>${escapeHtml(r.keteranganRaw || (r.keteranganKosong ? '(kosong)' : '-'))}</td></tr>`;
        }).join('')}</tbody>
      </table></div>${changeRows.length > 200 ? `<p class="muted">Menampilkan 200 dari ${fmtNumber(changeRows.length)} baris.</p>` : ''}` : `<div class="alert alert-info">Tidak ada Pengganti, Vacant, Keterangan kosong, atau ketidakcocokan Master Cabang yang perlu ditinjau.</div>`}
      <h3>Contoh Data (8 baris pertama)</h3>
      <div class="dt-scroll"><table class="dt-table dt-table-sm">
        <thead><tr><th>Kode</th><th>Nama Salesman</th><th>ASS</th><th>Depo</th><th>Region</th><th>%ACH SC</th><th>%ACH Geo</th><th>Total Omset</th><th>%TAT</th></tr></thead>
        <tbody>${sampleRows.map(r => `<tr><td>${escapeHtml(r.kodeSalesman)}</td><td>${escapeHtml(r.namaSalesman)}</td><td>${escapeHtml(r.namaAss)}</td><td>${escapeHtml(r.depo)}</td><td>${escapeHtml(r.region)}</td>
          <td class="ta-right">${fmtPercent(r.pctAchScVsJks)}</td><td class="ta-right">${fmtPercent(r.pctAchGeofencing)}</td><td class="ta-right">${fmtRupiah(r.mtdOmsFm)}</td><td class="ta-right">${fmtPercent(r.tatMtd)}</td></tr>`).join('')}</tbody>
      </table></div>
      ${closingTatBlockHtml(tatValidation)}
      <div class="upload-actions">
        <button class="btn btn-ghost" id="cancel-upload-btn">Batalkan</button>
        <button class="btn btn-primary" id="confirm-upload-btn" ${tatValidation.valid && isUploadPeriodStatusAllowed(tatValidation) ? '' : 'disabled'}>Simpan dan Gunakan Data</button>
      </div>
    </div>`;
  document.getElementById('cancel-upload-btn').addEventListener('click', () => { State.uploadPreview = null; previewArea.innerHTML = ''; document.getElementById('file-input').value = ''; });
  document.getElementById('confirm-upload-btn').addEventListener('click', confirmSaveSnapshot);
}
function statInfo(label, value) { return `<div class="stat-card static"><div class="stat-value" style="font-size:16px">${escapeHtml(String(value))}</div><div class="stat-label">${label}</div></div>`; }

/* TAT CLOSING WAJIB 100% (validasi SOURCE — angka TAT tidak pernah dipaksa menjadi 100).
   ADMIN UPLOAD VALIDATION untuk TAT tetap tampil penuh seperti sebelumnya; blok ini
   hanya menambahkan syarat tambahan khusus status Closing. */
function isUploadPeriodStatusAllowed(tatValidation) {
  if (uploadPeriodStatusValue() !== PERIOD_STATUS_CLOSING) return true;
  return !!(tatValidation && tatValidation.valid && isClosingTatValue(tatValidation.tatMtd));
}
function closingTatBlockHtml(tatValidation) {
  if (uploadPeriodStatusValue() !== PERIOD_STATUS_CLOSING) return '';
  if (!tatValidation || !tatValidation.valid) return '';
  if (isClosingTatValue(tatValidation.tatMtd)) {
    return `<div class="alert alert-info"><strong>Closing siap disimpan.</strong> TAT pada file sumber ${escapeHtml(fmtPercent(tatValidation.tatMtd, 0))} sesuai syarat Closing (100%).</div>`;
  }
  return `<div class="alert alert-error"><strong>Closing diblokir.</strong> TAT pada file sumber menunjukkan ${escapeHtml(fmtPercent(tatValidation.tatMtd, 2))}, sedangkan data Closing wajib 100%. Perbaiki file sumber — sistem tidak akan mengubah angka TAT menjadi 100.</div>`;
}

async function confirmSaveSnapshot() {
  if (!requireAdmin('menyimpan snapshot lokal')) return;
  const up = State.uploadPreview;
  if (!up || !up.tatValidation || !up.tatValidation.valid) { showToast('TAT MTD belum valid. Perbaiki file sumber sebelum menyimpan.', 'error'); return; }
  const cutoffDate = document.getElementById('cutoff-date-input').value;
  const note = document.getElementById('upload-note-input').value;
  // PERIODE: diturunkan dari cutoff date, bukan bulan browser.
  const periodKey = periodKeyFromCutoffDate(cutoffDate);
  if (!periodKey) { showToast('Tanggal / Cut-off Data belum valid sehingga periode tidak dapat ditentukan.', 'error'); return; }
  const periodStatus = uploadPeriodStatusValue();
  // CLOSING LOCK pada SAVE — memakai helper gabungan (official + local),
  // sehingga Closing lokal yang belum dipublish pun sudah mengunci MTD.
  if (periodStatus === PERIOD_STATUS_MTD && periodHasClosing(periodKey)) {
    const source = periodClosingLockSource(periodKey) === 'local'
      ? 'sudah tersimpan sebagai Closing di workspace lokal (belum dipublikasikan)'
      : 'sudah Closing';
    showToast(`${periodMonthLabel(periodKey)} ${source} dan tidak dapat kembali ke MTD. Simpan sebagai revisi Closing berikutnya.`, 'error');
    return;
  }
  if (periodStatus === PERIOD_STATUS_CLOSING && !isClosingTatValue(up.tatValidation.tatMtd)) {
    showToast(`TAT file sumber ${fmtPercent(up.tatValidation.tatMtd, 2)} — data Closing wajib TAT 100%. Angka TAT tidak akan diubah oleh sistem.`, 'error');
    return;
  }
  const existing = State.snapshotList.find(s => s.cutoffDate === cutoffDate);

  const proceed = async () => {
    const id = `${cutoffDate}__${Date.now()}`;
    // Revisi Data sequential per PERIOD (bulan), bukan per cutoff date.
    const revisionNumber = getNextLocalRevisionNumberForPeriod(periodKey);
    const snapshot = {
      id, cutoffDate, fileName: up.file.name, sheetName: up.parsed.sheetName, note, uploadedAt: Date.now(), isActive: true, revisionNumber,
      // METADATA PERIODE pada snapshot lokal. Ikut tersimpan di IndexedDB dan ikut ke payload publish.
      periodKey, periodStatus,
      dataSchemaVersion: APP_CONFIG.CURRENT_DATA_SCHEMA_VERSION,
      hitRateSourceKey: APP_CONFIG.CURRENT_HIT_RATE_SOURCE,
      hitRateSourceHeader: 'TOTAL CALL ESUITE',
      hitRateFormulaVersion: APP_CONFIG.CURRENT_HIT_RATE_FORMULA_VERSION,
      tatMtd: up.tatValidation.tatMtd,
      tatSourceKey: APP_CONFIG.CURRENT_TAT_SOURCE,
      tatFormulaVersion: APP_CONFIG.CURRENT_TAT_FORMULA_VERSION,
      // HK MTD dari Detail persalesman!G2. null bila G2 tidak valid (UI menampilkan "- HK").
      workdayMtd: normalizeWorkdayMtdValue(up.parsed.workdayMtd),
      workdaySourceCell: WORKDAY_MTD_CELL,
      rawRecords: up.resolvedRecords, totalRead: up.validation.totalRead, totalEligible: up.validation.totalEligible, totalNotEligible: up.validation.totalNotEligible
    };
    showLoadingOverlay('Menyimpan dan mengaktifkan data terbaru...');
    try {
      const hasTotalCallEsuiteField = !up.parsed.notFound.includes('totalCallEsuite') || up.parsed.rawRecords.some(record => Number.isFinite(record.totalCallEsuite));
      if (!hasTotalCallEsuiteField) throw new Error('Kolom TOTAL CALL ESUITE tidak ditemukan pada file yang dipilih.');

      await Storage.saveAndActivateSnapshot(snapshot);
      const activeAfterSave = await Storage.getActiveSnapshot();
      if (!activeAfterSave || activeAfterSave.id !== id) throw new Error('Snapshot baru gagal dijadikan snapshot aktif.');
      if (isLegacyHitRateSnapshot(activeAfterSave)) throw new Error('Snapshot baru masih terdeteksi memakai struktur EC vs Call Total lama.');
      if (isLegacyTatSnapshot(activeAfterSave)) throw new Error('Snapshot baru masih terdeteksi tanpa formula TAT MTD.');

      State.snapshotList = await Storage.listSnapshots();
      await loadSnapshotIntoState(activeAfterSave);
      // Periode aktif Admin mengikuti snapshot yang baru saja disimpan & digunakan.
      State.activePeriodKey = snapshotPeriodKey(activeAfterSave) || null;
      State.uploadPreview = null;
      renderSidebar();
      showToast('Data baru berhasil disimpan dan digunakan.', 'success');
      navigate('/dashboard');
      if (parseHash().path === '/dashboard') router();
    } catch (err) {
      console.error(err);
      showToast(err.message || 'Data gagal disimpan dan diaktifkan.', 'error');
    } finally {
      hideLoadingOverlay();
    }
  };

  // Jika tanggal yang sama sudah tersedia, file baru yang di-upload harus TETAP tersimpan
  // sebagai revisi baru dan langsung dipakai (data lama tetap tersimpan penuh, bisa diaktifkan
  // kembali lewat Riwayat Upload). Pilihan "Ganti Status Snapshot Aktif" sengaja tidak disediakan
  // di sini karena tidak menyimpan file baru yang sedang di-upload.
  if (existing) {
    const html = `<div class="detail-header"><h2>Tanggal Data Sudah Tersedia</h2></div>
      <p>Data untuk tanggal ${fmtDateId(cutoffDate)} sudah pernah diupload sebelumnya. File baru ini akan disimpan sebagai revisi baru dan langsung digunakan; data lama tetap tersimpan dan dapat diaktifkan kembali melalui Riwayat Upload.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="opt-cancel">Batalkan</button>
        <button class="btn btn-primary" id="opt-revision">Simpan sebagai Revisi Baru</button>
      </div>`;
    const overlay = openModal(html);
    overlay.querySelector('#opt-cancel').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#opt-revision').addEventListener('click', () => { overlay.remove(); proceed(); });
  } else proceed();
}

function downloadStructureGuide() {
  const lines = APP_CONFIG.FIELD_MAP.map(f => `${f.key} | alias: ${f.aliases.join(', ')} | fallback kolom index (0=A): ${f.fallbackCol} | tipe: ${f.type}`);
  const content = `PANDUAN STRUKTUR KOLOM - RANKING KPI\n\nSheet: ${APP_CONFIG.SHEET_NAME}\nHeader identitas & KPI di baris 4-5, data mulai baris 7.\n\n${lines.join('\n')}`;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'panduan-struktur-kolom.txt';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('Panduan struktur diunduh.', 'success');
}

    containerId: 'dt-riwayat', exportFilename: 'riwayat-upload.csv', searchableKeys: ['fileName', 'note'],
    defaultSortKey: 'uploadedAt', defaultSortDir: 'desc',

      { key: 'fileName', label: 'Nama File', sortable: true, render: r => escapeHtml(r.fileName) },
      { key: 'sheetName', label: 'Sheet', sortable: false, render: r => escapeHtml(r.sheetName || '-') },
      { key: 'note', label: 'Catatan', sortable: false, render: r => escapeHtml(r.note || '-') },
      { key: 'totalRead', label: 'Salesman', align: 'right', sortable: true, render: r => fmtNumber(r.totalRead) },
      { key: 'totalEligible', label: 'Data Valid', align: 'right', sortable: true, render: r => fmtNumber(r.totalEligible) },
      { key: 'totalNotEligible', label: 'Data Bermasalah', align: 'right', sortable: true, render: r => fmtNumber(r.totalNotEligible) },
      { key: 'revisionNumber', label: 'Revisi Data', align: 'right', sortable: true, render: r => r.revisionNumber || 1 },
      { key: 'dataSchemaVersion', label: 'Struktur EC vs Call', sortable: true, render: r => isLegacyHitRateSnapshot(r) ? '<span class="badge cat-critical">Formula Lama</span>' : '<span class="badge cat-perfect">Total Call Esuite</span>' },
      { key: 'tatFormulaVersion', label: 'Formula TAT', sortable: true, render: r => isLegacyTatSnapshot(r) ? '<span class="badge cat-needimprove">Legacy</span>' : `<span class="badge cat-perfect">${fmtPercent(r.tatMtd)}</span>` },
      // Periode + Jenis ditampilkan agar Admin dapat membedakan MTD dan Closing pada bulan yang sama.
      { key: 'periodKey', label: 'Periode', sortable: true, render: r => escapeHtml(periodMonthLabel(snapshotPeriodKeyForRevision(r))) },
      { key: 'periodStatus', label: 'Jenis', sortable: true, render: r => {

        return status === PERIOD_STATUS_CLOSING
          ? '<span class="badge cat-perfect">Closing</span>'

      } },
      { key: 'isActive', label: 'Status', sortable: true, render: r => r.isActive ? '<span class="badge cat-perfect">Sedang Digunakan</span>' : (isSnapshotActivationBlocked(r) ? '<span class="badge badge-muted">Arsip (Closing)</span>' : '<span class="badge badge-muted">Tersimpan</span>') },
      { key: 'aksi', label: 'Aksi', sortable: false, excludeFromJpg: true, render: r => {
        // HISTORY TIDAK PERNAH DIHAPUS — MTD lama tetap terlihat, dapat dilihat dan
        // di-export untuk AUDIT. Yang dikunci hanya menjadikannya snapshot aktif,
        // karena period tersebut sudah Closing (§9/§11).
        const blocked = isSnapshotActivationBlocked(r);
        const activateBtn = r.isActive ? ''
          : (blocked
            ? `<button class="btn btn-xs btn-primary act-activate" data-id="${r.id}" disabled title="${escapeHtml(snapshotActivationBlockReason(r))}">Gunakan Data Ini</button>`
            : `<button class="btn btn-xs btn-primary act-activate" data-id="${r.id}">Gunakan Data Ini</button>`);
        // Periode yang sudah Closing = audit trail: tombol Hapus TETAP TAMPIL namun
        // disabled, dengan title yang menjelaskan alasannya kepada Admin.
        const deleteBtn = isSnapshotDeleteBlocked(r)
          ? `<button class="btn btn-xs btn-danger act-delete" data-id="${r.id}" disabled title="Periode sudah Closing. Riwayat tidak dapat dihapus.">Hapus</button>`
          : `<button class="btn btn-xs btn-danger act-delete" data-id="${r.id}">Hapus</button>`;
        return `<div class="row-actions">
          <button class="btn btn-xs btn-outline act-view" data-id="${r.id}">Lihat Ranking</button>
          <button class="btn btn-xs btn-outline act-export" data-id="${r.id}">Export</button>
          ${activateBtn}
          ${deleteBtn}</div>`;
      } }
    ], data: State.snapshotList,
    jpgTitle: 'RIWAYAT UPLOAD', jpgFilename: 'Riwayat_Upload',
    jpgFilterSummary: () => (table.searchTerm ? [`Pencarian: ${table.searchTerm}`] : [])
  });
  table.render();

  document.getElementById('dt-riwayat').addEventListener('click', async (e) => {
    const id = e.target.dataset.id; if (!id) return;
    if (e.target.classList.contains('act-activate')) {
      // BLOK EKSPLISIT, bukan hanya tombol disabled: klik terprogram / DOM yang
      // dimanipulasi tetap tidak boleh menjadikan MTD lama sebagai snapshot aktif
      // pada periode yang sudah Closing.
      const candidate = (State.snapshotList || []).find(snapshot => snapshot && snapshot.id === id);
      if (candidate && isSnapshotActivationBlocked(candidate)) {
        showToast(snapshotActivationBlockReason(candidate), 'error');
        return;
      }
      showLoadingOverlay('Menggunakan data ini...');
      await Storage.setActiveSnapshot(id);
      const active = await Storage.getActiveSnapshot();
      if (!active || active.id !== id) throw new Error('Snapshot gagal diaktifkan.');
      State.snapshotList = await Storage.listSnapshots();
      await loadSnapshotIntoState(active);
      hideLoadingOverlay();
      renderSidebar();
      showToast(isLegacyHitRateSnapshot(active) ? 'Snapshot formula lama diaktifkan. Upload ulang data untuk EC vs Call Total berbasis TOTAL CALL ESUITE.' : 'Data berhasil digunakan.', isLegacyHitRateSnapshot(active) ? 'info' : 'success');
      navigate(isLegacyHitRateSnapshot(active) ? '/upload' : '/dashboard');
    } else if (e.target.classList.contains('act-view')) {
      const snap = await Storage.getSnapshot(id);
      const validation = validateDataset(snap.rawRecords);
      const hierarchy = buildHierarchy(validation, State.settings);
      const topSales = rankList(hierarchy.salesmanScored, x => x.rec.namaSalesman).slice(0, 10);
      openModal(`<div class="detail-header"><h2>Ranking Data ${fmtDateId(snap.cutoffDate)}</h2></div>
        <table class="detail-table"><thead><tr><th>Rank</th><th>Nama Salesman</th><th class="ta-right">Final Score</th></tr></thead>
        <tbody>${topSales.map(s => `<tr><td>${s.rank}</td><td>${escapeHtml(s.rec.namaSalesman)}</td><td class="ta-right">${fmtNumber(s.finalScore, 2)}</td></tr>`).join('')}</tbody></table>`, { wide: true });
    } else if (e.target.classList.contains('act-export')) {
      const snap = await Storage.getSnapshot(id);
      const validation = validateDataset(snap.rawRecords);
      const hierarchy = buildHierarchy(validation, State.settings);
      const ranked = rankList(hierarchy.salesmanScored, x => x.rec.namaSalesman);
      exportToCsv(`hasil-proses-${snap.cutoffDate}.csv`,
        ['Rank', 'Kode Salesman', 'Nama Salesman', 'ASS', 'Depo', 'Regional', 'Final Score', 'Kategori'],
        ranked.map(s => [s.rank, s.rec.kodeSalesman, s.rec.namaSalesman, s.rec.namaAss, s.rec.depo, s.rec.region, s.finalScore.toFixed(2), s.category.label]));
      showToast('Export hasil proses berhasil.', 'success');
    } else if (e.target.classList.contains('act-delete')) {
      // RE-CHECK di handler, bukan hanya atribut disabled: event yang dipanggil
      // manual atau DOM yang dimanipulasi tetap tidak boleh menghapus audit trail.
      const target = (State.snapshotList || []).find(snapshot => snapshot && snapshot.id === id);
      if (target && isSnapshotDeleteBlocked(target)) {
        showToast(snapshotDeleteBlockReason(target), 'error');
        return;
      }
      showConfirmDialog(`Hapus data tanggal ${fmtDateId(id.split('__')[0])}? Tindakan ini tidak dapat dibatalkan.`, async () => {
        // FRESH INDEXEDDB RE-CHECK tepat sebelum delete. State.snapshotList dapat stale
        // bila tab lain menyimpan Closing setelah dialog dibuka. Hasil fresh read juga
        // langsung menjadi cache State agar hanya ada satu source of truth di frontend.
        const freshSnapshots = await Storage.listSnapshots();
        State.snapshotList = freshSnapshots;
        const current = freshSnapshots.find(snapshot => snapshot && snapshot.id === id) || target;
        if (current && isSnapshotDeleteBlocked(current)) {
          showToast(snapshotDeleteBlockReason(current), 'error');
          return;
        }
        await Storage.deleteSnapshot(id);
        State.snapshotList = await Storage.listSnapshots();
        if (State.activeSnapshot && State.activeSnapshot.id === id) { State.activeSnapshot = null; State.validation = null; State.hierarchy = null; }
        renderSidebar(); showToast('Data dihapus.', 'success'); navigate('/upload', { tab: 'riwayat' });
      });
    }
  });
}

function wirePengaturanPage() {
  if (!requireAdmin('mengubah pengaturan KPI')) return;
  const originalWeights = { ...State.settings.weights };
  const originalAvgEc = State.settings.avgEcTarget, originalCap = State.settings.scoreCap;
  const updateTotal = () => {
    const weights = {};
    document.querySelectorAll('.weight-input').forEach(inp => { weights[inp.dataset.kpi] = parseFloat(inp.value) || 0; });
    const total = totalWeight(weights);
    document.getElementById('weight-total-value').textContent = total.toFixed(1);
    const statusEl = document.getElementById('weight-total-status'), saveBtn = document.getElementById('save-settings-btn');
    const valid = Math.abs(total - 100) < 0.001;
    statusEl.innerHTML = valid ? ' <span class="badge cat-perfect">Valid</span>' : ' <span class="badge cat-critical">Total harus tepat 100%</span>';
    saveBtn.disabled = !valid;

    const diffRows = APP_CONFIG.KPI_DEFS.filter(d => weights[d.id] !== originalWeights[d.id])
      .map(d => `<div>${d.label}: ${originalWeights[d.id]}% → <strong>${weights[d.id]}%</strong></div>`).join('');
    document.getElementById('weight-diff-preview').innerHTML = diffRows ? `<div class="weight-diff-preview"><strong>Preview Perubahan Bobot:</strong>${diffRows}<div>Total bobot baru: <strong>${total.toFixed(1)}%</strong></div></div>` : '';
    return weights;
  };
  document.querySelectorAll('.weight-input').forEach(inp => inp.addEventListener('input', updateTotal));
  updateTotal();

  document.getElementById('reset-weights-btn').addEventListener('click', () => {
    const defaults = getDefaultWeights();
    document.querySelectorAll('.weight-input').forEach(inp => { inp.value = defaults[inp.dataset.kpi]; });
    document.getElementById('avgec-target-input').value = APP_CONFIG.DEFAULT_AVG_EC_TARGET;
    document.getElementById('scorecap-input').value = APP_CONFIG.DEFAULT_SCORE_CAP;
    updateTotal();
  });
  document.getElementById('cancel-settings-btn').addEventListener('click', () => {
    document.querySelectorAll('.weight-input').forEach(inp => { inp.value = originalWeights[inp.dataset.kpi]; });
    document.getElementById('avgec-target-input').value = originalAvgEc;
    document.getElementById('scorecap-input').value = originalCap;
    updateTotal(); showToast('Perubahan dibatalkan.', 'info');
  });
  document.getElementById('save-settings-btn').addEventListener('click', async () => {
    const weights = updateTotal();
    const avgEcTarget = parseFloat(document.getElementById('avgec-target-input').value) || APP_CONFIG.DEFAULT_AVG_EC_TARGET;
    const scoreCap = parseFloat(document.getElementById('scorecap-input').value) || APP_CONFIG.DEFAULT_SCORE_CAP;
    if (Math.abs(totalWeight(weights) - 100) > 0.001) { showToast('Bobot tidak valid: total harus 100%.', 'error'); return; }
    showLoadingOverlay('Menyimpan pengaturan & menghitung ulang ranking...');
    State.settings = { ...State.settings, weights, avgEcTarget, scoreCap };
    try {
      await Storage.saveSettings(State.settings);
      recomputeFromSettings();
      hideLoadingOverlay();
      showToast('Pengaturan disimpan. Seluruh ranking telah dihitung ulang.', 'success');
    } catch (err) { hideLoadingOverlay(); console.error(err); showToast('Gagal menyimpan pengaturan.', 'error'); }
  });
}

// ===== GLOBAL FILTER: Phase Project & Regional (keduanya multi-select) =====
// Set kosong === "Semua" pada dimensi tersebut (perilaku identik dengan sebelum fitur ini ada).

function getPhaseOptions() {
  if (!State.activeSnapshot) return [];
  const set = new Set();
  (State.activeSnapshot.rawRecords || []).forEach(r => { const v = phaseValueOfRecord(r); if (v) set.add(v); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
}
function getRegionOptions() {
  if (!State.activeSnapshot) return [];
  const set = new Set();
  (State.activeSnapshot.rawRecords || []).forEach(r => { const v = regionValueOfRecord(r); if (v) set.add(v); });
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
}
function getPhaseFilteredRawRecords(snapshot) {
  return getCalculationRecords(snapshot);
}
// Label ringkas untuk topbar: "Semua", nama tunggal, atau "N Dipilih".
function multiFilterShortLabel(selectedSet, allLabel) {
  const values = Array.from(selectedSet || []);
  if (!values.length) return allLabel;
  if (values.length === 1) return values[0];
  return `${values.length} Dipilih`;
}
function globalPhaseFilterLabel() { return multiFilterShortLabel(State.activePhaseFilters, 'Semua Phase'); }
function globalRegionFilterLabel() { return multiFilterShortLabel(State.activeRegionFilters, 'Semua Regional'); }
// Daftar lengkap (urut stabil) untuk metadata CSV / subtitle JPG.
function globalPhaseFilterValues() { return getPhaseOptions().filter(v => State.activePhaseFilters.has(v)); }
function globalRegionFilterValues() { return getRegionOptions().filter(v => State.activeRegionFilters.has(v)); }
// Chip filter summary JPG (dan tempat lain) — hanya muncul bila dimensinya memang dibatasi.
function globalScopeSummaryChips() {
  const chips = [];
  if (State.activePhaseFilters.size) chips.push(`Phase: ${globalPhaseFilterValues().join(', ')}`);
  if (State.activeRegionFilters.size) chips.push(`Regional: ${globalRegionFilterValues().join(', ')}`);
  return chips;
}
// Alias historis agar seluruh jpgFilterSummary lama ikut membawa Phase + Regional.
function phaseSummaryChip() { return globalScopeSummaryChips(); }
function globalScopeCsvMetadataRows() {
  return [
    ['Phase', State.activePhaseFilters.size ? globalPhaseFilterValues().join('; ') : 'Semua'],
    ['Regional', State.activeRegionFilters.size ? globalRegionFilterValues().join('; ') : 'Semua']
  ];
}
// Label gabungan untuk header export Detail KPI (satu baris).
function globalScopeExportLabel() {
  return `${globalPhaseFilterLabel()} • ${globalRegionFilterLabel()}`;
}
// Saat snapshot berganti: pilihan yang masih ada dipertahankan, yang hilang dibuang.
// Bila seluruh pilihan hilang, Set menjadi kosong = "Semua" (tidak pernah menghasilkan halaman kosong).
function reconcileGlobalScopeFilters() {
  const phases = new Set(getPhaseOptions());
  const regions = new Set(getRegionOptions());
  State.activePhaseFilters = new Set(Array.from(State.activePhaseFilters).filter(v => phases.has(v)));
  State.activeRegionFilters = new Set(Array.from(State.activeRegionFilters).filter(v => regions.has(v)));
}
function recomputeAfterGlobalScopeChange() {
  State.vacantSelection.clear();
  invalidateGlobalScopeCaches();
  if (State.activeSnapshot) {
    State.validation = validateDataset(getCalculationRecords(State.activeSnapshot));
    State.hierarchy = getHierarchyCached(State.validation, State.settings);
    rebuildComparisonContext();
  }
}
// Titik masuk TUNGGAL perubahan Global Filter (dipakai popover Phase & Regional).
async function applyGlobalScopeFilters({ phases, regions }) {
  if (phases) State.activePhaseFilters = new Set(getPhaseOptions().filter(v => phases.includes(v)));
  if (regions) State.activeRegionFilters = new Set(getRegionOptions().filter(v => regions.includes(v)));
  recomputeAfterGlobalScopeChange();
  router();
}

// Snapshot Hit Rate lama dibedakan dari formula aktif TOTAL CALL ESUITE.
// Snapshot baru wajib membawa metadata formula. Snapshot lama sebelum era metadata tetap dapat digunakan
// hanya bila memiliki TOTAL CALL ESUITE dan tidak menyatakan sumber/formula lain secara eksplisit.
function snapshotHasTotalCallEsuite(snapshot) {
  const records = Array.isArray(snapshot && snapshot.rawRecords) ? snapshot.rawRecords : [];
  return records.some(record => record && Object.prototype.hasOwnProperty.call(record, 'totalCallEsuite'));
}
function isLegacyHitRateSnapshot(snapshot) {
  if (!snapshot) return false;
  const sourceKey = String(snapshot.hitRateSourceKey || '').trim();
  const formulaVersion = String(snapshot.hitRateFormulaVersion || '').trim();
  const hasExplicitFormulaMetadata = !!sourceKey || !!formulaVersion;
  const sourceIsCurrent = sourceKey === APP_CONFIG.CURRENT_HIT_RATE_SOURCE;
  const formulaIsCurrent = formulaVersion === APP_CONFIG.CURRENT_HIT_RATE_FORMULA_VERSION;
  if (sourceIsCurrent && formulaIsCurrent) return false;
  if (hasExplicitFormulaMetadata) return true;
  return !snapshotHasTotalCallEsuite(snapshot);
}
async function loadSnapshotIntoState(snapshot) {
  State.vacantSelection.clear();
  Object.values(State.rankingHeaderFilters).forEach(filters => Object.keys(filters).forEach(key => delete filters[key]));
  if (!snapshot) {
    State.activeSnapshot = null;
    State.activePhaseFilters = new Set();
    State.activeRegionFilters = new Set();
    State.isLegacyHitRateSnapshot = false;
    State.isLegacyTatSnapshot = false;
    State.validation = null;
    State.hierarchy = null;
    State.comparison = { previousSnapshot: null, previousHierarchy: null };
    State.rankingCache.clear();
    return;
  }
  State.activeSnapshot = snapshot;
  // Snapshot berganti: pilihan Global Filter yang masih ada dipertahankan, yang tidak ada dibuang.
  reconcileGlobalScopeFilters();
  invalidateGlobalScopeCaches();
  State.isLegacyHitRateSnapshot = isLegacyHitRateSnapshot(snapshot);
  State.isLegacyTatSnapshot = isLegacyTatSnapshot(snapshot);
  State.validation = validateDataset(getPhaseFilteredRawRecords(snapshot));
  State.rankingCache.clear();
  State.hierarchy = getHierarchyCached(State.validation, State.settings);
  rebuildComparisonContext();
}
function recomputeFromSettings() {
  if (!State.activeSnapshot) return;
  State.validation = validateDataset(getPhaseFilteredRawRecords(State.activeSnapshot));
  State.rankingCache.clear();
  State.hierarchy = getHierarchyCached(State.validation, State.settings);
  rebuildComparisonContext();
}
function showFatalError(msg) {
  document.getElementById('app-root').innerHTML = `<div class="fatal-error"><h2>⚠️ Terjadi Kesalahan</h2><p>${escapeHtml(msg)}</p></div>`;
}

async function initApp() {
  try {
    State.settings = defaultSettings();
    try {
      await window.SupabaseService.initialize();
      State.supabaseReady = true;
      await new Promise(resolve => setTimeout(resolve, 0));
      State.authSession = await window.SupabaseService.getSession();
    } catch (supabaseError) {
      State.supabaseReady = false;
      State.remoteStatusMessage = safeUserError(supabaseError, 'Supabase belum dapat diinisialisasi.');
    }
    cleanAuthParametersFromUrl();

    if (State.supabaseReady && State.authSession) {
      let verifiedAdmin = false;
      try { verifiedAdmin = await window.SupabaseService.checkCurrentUserIsAdmin(); }
      catch (adminError) { State.remoteStatusMessage = safeUserError(adminError, 'Status admin tidak dapat diverifikasi.'); }
      if (verifiedAdmin) {
        State.runtimeMode = 'admin';
        State.isAdmin = true;
      } else {
        try { await window.SupabaseService.signOut(); } catch (_) {}
        State.authSession = null;
        State.runtimeMode = 'viewer';
        State.isAdmin = false;
        showToast('Akses ditolak. Akun tidak terdaftar sebagai admin.', 'error');
      }
    }

    if (State.isAdmin) {
      let settings = null;
      try { settings = await Storage.getSettings(); } catch (e) { console.error(e); showToast('IndexedDB gagal dibuka, pengaturan memakai nilai default sementara.', 'error'); }
      if (!settings) {
        settings = defaultSettings();
        try { await Storage.saveSettings(settings); } catch (e) { console.error(e); }
      } else if (!Array.isArray(settings.statusSalesmanFilter) || !settings.statusSalesmanFilter.length) {
        settings.statusSalesmanFilter = [...STATUS_SALESMAN_DEFAULT];
      }
      State.settings = settings;
      await reloadVacantState();
      try {
        const savedMaster = await Storage.getMasterCabang();
        if (savedMaster && Array.isArray(savedMaster.rows)) setActiveMasterCabangInState(savedMaster);
      } catch (e) { console.error('Gagal memuat Master Cabang:', e); }
      try {
        State.snapshotList = await Storage.listSnapshots();
        const active = await Storage.getActiveSnapshot();
        // DEFAULT PERIODE ADMIN = period_key TERBESAR dari snapshot lokal, bukan
        // snapshot dengan uploadedAt terbaru. Backfill Juni yang diunggah hari ini
        // tidak boleh menjadikan Juni sebagai periode default saat aplikasi dibuka.
        // Snapshot aktif tetap dipakai bila memang sudah berada pada periode terbaru.
        // Daftar periode resmi diambil LEBIH DULU agar Closing lock official ikut
        // diperhitungkan saat memilih snapshot awal.
        try { await refreshOfficialPeriods(); }
        catch (periodError) { console.error('Daftar periode resmi tidak dapat diambil:', periodError); }

        const defaultPeriod = defaultAdminPeriodKey();
        // Snapshot aktif yang tersimpan bisa berupa MTD lama pada periode yang kini sudah
        // Closing (mis. ditandai aktif sebelum Closing disimpan). Membiarkannya membuat
        // period selector menampilkan "Closing" sementara data yang dirender MTD.
        const needsDefault = !active
          || isSnapshotActivationBlocked(active)
          || snapshotPeriodKeyForRevision(active) !== defaultPeriod;
        let initial = active;
        if (defaultPeriod && needsDefault) {
          const latest = latestLocalSnapshotForPeriod(defaultPeriod);
          if (latest) {
            const stored = (Array.isArray(latest.rawRecords) && latest.rawRecords.length)
              ? latest : await Storage.getSnapshot(latest.id);
            if (stored) initial = stored;
          }
        }
        if (initial) {
          await loadSnapshotIntoState(initial);
          State.activePeriodKey = snapshotPeriodKey(initial) || null;
        }
      } catch (e) { console.error(e); showToast('Gagal memuat snapshot lokal Admin.', 'error'); }
    } else {
      State.runtimeMode = 'viewer';
      State.isAdmin = false;
      await loadViewerNationalData({ allowCache: true });
    }

    renderSidebar();
    window.addEventListener('hashchange', router);
    if (!location.hash) location.hash = '#/dashboard';
    router();
  } catch (err) {
    console.error(err);
    showFatalError('Gagal memuat aplikasi. Pastikan browser mendukung IndexedDB dan coba muat ulang halaman.');
  }
}
document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
