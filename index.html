   PERIOD SELECTOR (topbar)
   ------------------------------------------------------------
   SATU ITEM PER BULAN — yang ditampilkan adalah official/current dataset bulan itu.
   "Agustus MTD" dan "Agustus Closing" TIDAK PERNAH muncul sebagai dua pilihan.
   SCOPE-nya terpisah dari GLOBAL FILTER (Phase/Regional/Status) dan dari PUBLISH SCOPE.
   ------------------------------------------------------------ */
function periodSelectorHtml() {
  // MODE ADMIN: sumbernya adalah WORKSPACE LOKAL Admin (IndexedDB), satu item per bulan,
  // memakai REVISI DATA LOKAL TERBARU bulan tersebut. Data published Viewer TIDAK PERNAH
  // dicampur ke sini, dan sebaliknya revisi lokal yang belum dipublish tidak pernah
  // bocor ke Viewer.
  if (State.runtimeMode === 'admin') {
    const localOptions = adminLocalPeriodOptions();
    if (!localOptions.length) return '';
    const activeKey = snapshotPeriodKey(State.activeSnapshot) || localOptions[0].periodKey;
    const disabled = State.periodBusy ? ' disabled' : '';
    return `<div class="topbar-period-filter">
      <label class="topbar-period-label" for="topbar-period-select">Periode:</label>

      </select>

  }
  const options = sortPeriodsNewestFirst(State.periods);
  const activeKey = State.activePeriodKey || (State.remotePublication && State.remotePublication.periodKey) || '';
  // Periode yang sedang dilihat wajib ada di daftar walau daftar resmi gagal diambil,

  if (activeKey && !options.some(option => option.periodKey === activeKey)) {

    });

  if (!options.length) return '';
  const disabled = State.periodBusy ? ' disabled' : '';
  return `<div class="topbar-period-filter">
    <label class="topbar-period-label" for="topbar-period-select">Periode:</label>
    <select class="topbar-period-select" id="topbar-period-select" title="Satu bulan = satu dataset resmi"${disabled}>
      ${options.map(option => `<option value="${escapeHtml(option.periodKey)}"${option.periodKey === activeKey ? ' selected' : ''}>${escapeHtml(periodOptionLabel(option.periodKey, option.periodStatus))}</option>`).join('')}
    </select>
  </div>`;
}

// ===== Performa Nasional (gabungan Top 5 dengan tab 5 Terbaik / 5 Performa Terendah) =====
const PERFORMA_TOP_N = 5; // Top/Bottom 5 (sebelumnya 3) — dipakai website & kedua JPG Dashboard
function performaValidEntities(arr) {
  return arr.filter(x => typeof x.finalScore === 'number' && !isNaN(x.finalScore) && isFinite(x.finalScore));
}
function performaEntities(mode) {
  const h = State.hierarchy;
  const sortFn = mode === 'best' ? (a, b) => b.finalScore - a.finalScore : (a, b) => a.finalScore - b.finalScore;
  return {
    region: [...performaValidEntities(h.byRegion)].sort(sortFn).slice(0, PERFORMA_TOP_N),
    cabang: [...performaValidEntities(h.byCabang || [])].sort(sortFn).slice(0, PERFORMA_TOP_N), // B2: hierarchy yang sama dengan Ranking Cabang
    depo: [...performaValidEntities(h.byDepo)].sort(sortFn).slice(0, PERFORMA_TOP_N),
    ass: [...performaValidEntities(h.byAss)].sort(sortFn).slice(0, PERFORMA_TOP_N),
    sales: [...performaValidEntities(h.salesmanScored)].sort(sortFn).slice(0, PERFORMA_TOP_N)
  };
}
// ===== Helper info tambahan (meta) di bawah nama ASS & Salesman pada Performa Nasional =====
// type: 'region' | 'depo' | 'ass' | 'sales'. Hanya mengembalikan plain text (escapeHtml dipakai saat render).
function getAssDepoNames(item) {
  const rawDepoList = Array.isArray(item.depoList) && item.depoList.length ? item.depoList : [item.meta && item.meta.depo];
  const depoNames = [...new Set(rawDepoList.map(name => String(name || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'id'));
  return depoNames;
}
function formatAssDepoMeta(item) {
  const depoNames = getAssDepoNames(item);
  if (depoNames.length === 0) return '';
  if (depoNames.length <= 2) return `Depo: ${depoNames.join(', ')}`;
  const visibleNames = depoNames.slice(0, 2);
  const remaining = depoNames.length - visibleNames.length;
  return `Depo: ${visibleNames.join(', ')} +${remaining} lainnya`;
}
function formatSalesmanMeta(item) {
  const depo = String(item.rec && item.rec.depo ? item.rec.depo : '').trim();
  const ass = String(item.rec && item.rec.namaAss ? item.rec.namaAss : '').trim();
  if (depo && ass) return `${depo} • ASS: ${ass}`;
  if (depo) return depo;
  if (ass) return `ASS: ${ass}`;
  return '';
}
function performaMetaText(type, item) {
  if (type === 'cabang') return item.meta && item.meta.region ? item.meta.region : '';
  if (type === 'ass') return formatAssDepoMeta(item);
  if (type === 'sales') return formatSalesmanMeta(item);
  return '';
}

// ===== Helper primary-cell (nama utama + meta kecil) dipakai di tabel Ranking Regional/Depo/ASS =====
function joinMeta(parts) { return parts.filter(p => p !== null && p !== undefined && String(p).trim() !== '').join(' • '); }
function formatCountMeta(count, label) { return (count === null || count === undefined || isNaN(count)) ? '' : `${fmtNumber(count)} ${label}`; }
function formatNikMeta(nik) { const v = String(nik || '').trim(); return v ? `NIK ${v}` : ''; }
function renderPrimaryCell(name, metaText, extraHtml) {
  return `<div class="primary-cell">
    <div class="primary-name" title="${escapeHtml(name || '-')}">${escapeHtml(name || '-')}</div>
    ${metaText ? `<div class="primary-meta">${escapeHtml(metaText)}</div>` : ''}
    ${extraHtml ? `<div class="primary-status-line">${extraHtml}</div>` : ''}

}
function performaMetaTitle(type, item) {
  if (type === 'cabang') return item.meta && item.meta.region ? item.meta.region : '';
  if (type === 'ass') { const depoNames = getAssDepoNames(item); return depoNames.length ? `Depo: ${depoNames.join(', ')}` : ''; }
  if (type === 'sales') return formatSalesmanMeta(item);
  return '';
}

function performaItemHtml(item, idx, mode, type, name, link) {
  const cls = mode === 'best' ? `performa-item best-${idx + 1}` : 'performa-item worst';
  const rankMarker = mode === 'best'

  const metaText = performaMetaText(type, item);
  const metaTitle = performaMetaTitle(type, item);
  return `<a class="${cls}" href="${link}">
      <span class="performa-item-rank">${rankMarker}</span>
      <span class="performa-item-content">
        <span class="performa-item-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>

function renderDashboardPage() {
  const h = State.hierarchy;
  const v = State.validation;

  return `
    <div class="page-header dashboard-page-header">
      <div>
        <h1>Dashboard Utama</h1>

      </div>
      <div class="dashboard-page-header-actions">

          const currentScore = h.national ? h.national.finalScore : null;
          return Number.isFinite(currentScore) ? `<span class="dashboard-comparison-chip"><span>Final Score Nasional</span><strong>${fmtNumber(currentScore, 2)}</strong></span>` : '';
        })()}
        <div class="dashboard-download-wrap" id="dashboard-download-wrap">
          <button class="btn btn-outline btn-sm dashboard-download-toggle" id="dashboard-download-toggle"
            aria-label="Pilih jenis Download JPG" aria-haspopup="menu" aria-expanded="false">🖼 Download JPG ▾</button>
          <div class="dashboard-download-menu" id="dashboard-download-menu" role="menu" hidden>
            <button class="dashboard-download-option" data-download-mode="dashboard" role="menuitem">🖼 Download Dashboard</button>
            <button class="dashboard-download-option" data-download-mode="dashboard-regional" role="menuitem">📊 Dashboard + Ranking Regional</button>
          </div>
        </div>
      </div>
    </div>
    ${renderSummaryStrip(h, v)}
    ${renderPerformaNasionalPanel()}
  `;

function wireDashboardPage() {
  // Animated counter hanya sekali per sesi saat dashboard pertama kali dibuka
  document.querySelectorAll('[data-counter]').forEach(el => {
    const target = parseFloat(el.dataset.counter) || 0;
    if (!State.dashboardAnimated) animateCounter(el, target); else el.textContent = fmtNumber(target);
  });
  State.dashboardAnimated = true;
  wirePerformaNasionalPanel();

  const toggle = document.getElementById('dashboard-download-toggle');
  const menu = document.getElementById('dashboard-download-menu');
  if (!toggle || !menu) return;

  const closeMenu = () => { menu.classList.remove('is-open'); menu.hidden = true; toggle.setAttribute('aria-expanded', 'false'); };
  const openMenu = () => { menu.hidden = false; menu.classList.add('is-open'); toggle.setAttribute('aria-expanded', 'true'); };

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (menu.classList.contains('is-open')) closeMenu(); else openMenu();
  }, { signal: State.pageSignal });
  document.addEventListener('click', (e) => {
    if (!menu.hidden && !e.target.closest('#dashboard-download-wrap')) closeMenu();
  }, { signal: State.pageSignal });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) closeMenu(); }, { signal: State.pageSignal });
  window.addEventListener('hashchange', closeMenu, { once: true, signal: State.pageSignal });

  const setBusy = (busy, label) => {
    toggle.disabled = busy;
    menu.querySelectorAll('.dashboard-download-option').forEach(o => o.disabled = busy);
    toggle.textContent = busy ? label : '🖼 Download JPG ▾';
  };

  menu.querySelectorAll('.dashboard-download-option').forEach(option => {
    option.addEventListener('click', async () => {
      const mode = option.dataset.downloadMode;
      closeMenu();
      if (mode === 'dashboard') {
        setBusy(true, 'Menyiapkan JPG...');
        showLoadingOverlay('Menyiapkan JPG Dashboard...');
        try {
          await generateDashboardJpg();
          showToast('JPG Dashboard berhasil diunduh.', 'success');
        } catch (err) {
          console.error(err);
          showToast('JPG gagal dibuat. Silakan coba kembali.', 'error');
        } finally {
          setBusy(false); hideLoadingOverlay();
        }
      } else if (mode === 'dashboard-regional') {
        setBusy(true, 'Menyiapkan...');
        showLoadingOverlay('Menyiapkan Dashboard dan Ranking Regional...');
        try {
          await generateDashboardRegionalJpg();
          showToast('Dashboard dan Ranking Regional berhasil diunduh.', 'success');
        } catch (err) {
          console.error(err);
          showToast('JPG gagal dibuat. Silakan coba kembali.', 'error');
        } finally {
          setBusy(false); hideLoadingOverlay();
        }
      }
    });
  });
}

function rankingAverageEc(row) {
  if (row && row.rec) {
    const value = Number(row.rec.avgEc);
    return Number.isFinite(value) ? value : null;
  }
  if (row && row.sums) {
    const divisor = Number(row.eligibleSalesman ?? row.totalSalesman);
    return safeDivide(Number(row.sums.avgEc), divisor);
  }
  return null;
}
function rankingKpiActual(row, kpiId) {
  const value = row && row.kpi && row.kpi[kpiId] ? Number(row.kpi[kpiId].actual) : NaN;
  return Number.isFinite(value) ? value : null;
}
function rankingRevenueNominalActual(row) {
  const value = row && row.revenueNominal ? row.revenueNominal.actual : (row && row.rec ? row.rec.mtdOmsFm : null);
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric : null;
}
function rankingRevenueNominalTarget(row) {
  const value = row && row.revenueNominal ? row.revenueNominal.target : (row && row.rec ? row.rec.tgtOmsFm : null);
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric : null;
}
function rankingEpbTarget(row) {

}
function rankingEpbActual(row) {

  return Number.isFinite(numeric) ? numeric : null;
}
function rankingRoaTarget(row) {
  const value = row && row.sums ? row.sums.cb : (row && row.rec ? row.rec.cb : null);
  const numeric = Number(value);
  return Number.isFinite(numeric) ? numeric : null;
}
function rankingRoaActual(row) {
  const value = row && row.sums ? row.sums.roa : (row && row.rec ? row.rec.roa : null);

  return Number.isFinite(numeric) ? numeric : null;
}
function rankingTatMtd(row) {
  const value = row && isValidTatMtdValue(row.tatMtd) ? row.tatMtd : (row && row.rec && isValidTatMtdValue(row.rec.tatMtd) ? row.rec.tatMtd : null);
  return isValidTatMtdValue(value) ? Number(value) : null;
}
/* ------------------------------------------------------------
   INFORMASI TAT GLOBAL ("TAT Hari Ini")
   Nilai ini adalah pace perusahaan pada snapshot yang sedang dilihat — INFORMASI GLOBAL saja.
   Tabel Ranking sengaja TIDAK lagi memiliki kolom %TAT per KPI; TAT tetap dipakai penuh
   sebagai faktor perhitungan score melalui kpiScoreBasis().
   ------------------------------------------------------------ */
function activeSnapshotWorkdayMtd(snapshot) {
  const snap = snapshot || State.activeSnapshot;
  if (!snap) return null;
  // Sumber resmi HK = Detail persalesman!G2 yang tersimpan pada snapshot sebagai workdayMtd.
  // Snapshot legacy tidak memilikinya -> null (UI menampilkan "- HK"), HK TIDAK PERNAH dikarang
  // dari cutoff date maupun jumlah hari kalender.
  return normalizeWorkdayMtdValue(snap.workdayMtd);
}
function formatTatTodayPercent(value) {
  const numeric = Number(value);
  if (!Number.isFinite(numeric)) return '-';
  return fmtPercent(numeric, Number.isInteger(numeric) ? 0 : 2);
}
/**
 * Label TAT mengikuti STATUS PERIODE snapshot yang sedang dilihat:
 *   MTD     -> "TAT Hari Ini: xx% / xx HK"
 *   CLOSING -> "TAT Closing: 100% / xx HK"
 * Angka TAT dan HK TETAP dari sumber existing (snapshot.tatMtd & workdayMtd/G2).
 * Tidak ada perhitungan baru dan tidak ada angka yang dikarang — hanya labelnya yang berbeda.
 */
function tatTodayLabelPrefix(snapshot) {
  return isClosingPeriodSnapshot(snapshot === undefined ? State.activeSnapshot : snapshot)
    ? 'TAT Closing' : 'TAT Hari Ini';
}
function tatTodayLabelText(snapshot) {
  const snap = snapshot || State.activeSnapshot;
  if (!snap) return '';
  const tat = isValidTatMtdValue(snap.tatMtd) ? Number(snap.tatMtd) : null;
  if (tat === null) return '';
  const workday = activeSnapshotWorkdayMtd(snap);
  return `${tatTodayLabelPrefix(snap)}: ${formatTatTodayPercent(tat)} / ${workday === null ? '-' : fmtNumber(workday, 0)} HK`;
}
function tatTodayInfoHtml() {
  const text = tatTodayLabelText();
  if (!text) return '';
  return `<div class="dt-ranking-tat-info" title="Pace perusahaan pada snapshot aktif. TAT dipakai sebagai faktor perhitungan score, bukan kolom KPI.">${escapeHtml(text)}</div>`;
}
function rankingCompactMoneyHtml(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) return '-';
  return `<span title="${escapeHtml(fmtRupiah(Number(value)))}">${escapeHtml(fmtRupiahCompact(Number(value)))}</span>`;
}
/**
 * %TAT PER ENTITAS (bukan TAT global perusahaan).
 *   %TAT KPI = %Achievement KPI ÷ TAT Hari Ini × 100%
 * Sumbernya adalah kpi[kpiId].scoreBasis yang sudah dihitung oleh kpiScoreBasis() — TIDAK dibuat
 * formula paralel kedua. Nilai yang ditampilkan adalah scoreBasis (SEBELUM score cap), sehingga
 * score cap tidak pernah mengubah angka pada kolom %TAT.
 * Bila TAT MTD snapshot tidak valid (snapshot legacy) kolom ini tampil '-'.
 */
function rankingTatAchievement(row, kpiId) {
  if (!row || !row.kpi || !row.kpi[kpiId]) return null;
  if (!isTatAdjustedKpi(kpiId)) return null;
  if (!isValidTatMtdValue(rankingTatMtd(row))) return null;
  const value = Number(row.kpi[kpiId].scoreBasis);
  return Number.isFinite(value) ? value : null;
}
/* CATATAN: sejak TAT diperlakukan sebagai FAKTOR PERHITUNGAN INTERNAL (bukan metrik
   user-facing), builder kolom ini TIDAK LAGI dipanggil oleh rankingColumns(). Fungsi dan
   rankingTatAchievement() sengaja DIPERTAHANKAN agar engine/score dan pemanggil internal
   lain tidak terganggu, serta agar kolom ini mudah diaktifkan kembali bila dibutuhkan. */
function rankingTatColumn(key, kpiId, groupKey, groupLabel, groupClass, width = RANKING_KPI_COLUMN_WIDTH) {
  return { key, label: '%TAT', groupKey, groupLabel, groupClass, align: 'center', sortable: false, width,
    render: row => fmtPercent(rankingTatAchievement(row, kpiId)),
    csvValue: row => rankingTatAchievement(row, kpiId),
    jpgValue: row => fmtPercent(rankingTatAchievement(row, kpiId)) };
}
/* ------------------------------------------------------------
   GEOMETRY HEADER RANKING
   Satu sumber kebenaran lebar kolom KPI (harus sama dengan --ranking-kpi-column-width di CSS).
   Dipakai oleh <colgroup>, style TH, dan floating header (yang meng-clone keduanya),
   sehingga seluruh metric column pada Viewer maupun Admin punya lebar identik.

const RANKING_KPI_COLUMN_WIDTH = 104;
/**

 */
const RANKING_MULTILINE_HEADER_LABELS = { 'EC VS CALL TOTAL': ['EC VS', 'CALL TOTAL'] };
function rankingHeaderLabelHtml(label) {
  const lines = RANKING_MULTILINE_HEADER_LABELS[String(label || '').trim()];
  if (!lines) return escapeHtml(label);
  // Tiap baris dibungkus span nowrap -> jumlah baris PERSIS sesuai definisi (tidak pernah pecah jadi 3 baris).
  return `<span class="dt-header-multiline">${lines.map(line => `<span>${escapeHtml(line)}</span>`).join('')}</span>`;
}
function rankingPercentColumn(key, label, groupKey, groupLabel, groupClass, kpiId, options = {}) {

    key, label, groupKey, groupLabel, groupClass, align: 'center',
    sortable: !!options.sortId, sortId: options.sortId || undefined,

    render: row => fmtPercent(rankingKpiActual(row, kpiId)),

const TREND_RANKING_LEVELS = new Set(['phase', 'regional', 'cabang', 'depo', 'ass', 'salesman']);

// Definisi filter header (rentang numerik) untuk seluruh subkolom KPI, dipakai bersama oleh
// Ranking Phase/Regional/Depo/ASS/Salesman. Key SAMA PERSIS dengan key kolom di rankingColumns()
// agar ikon filter otomatis muncul tepat di subheader kolom terkait (bukan di header grup).
// Untuk kolom yang nilainya path langsung (kpi.<id>.actual) tidak perlu valueFn; untuk kolom yang
// nilainya dihitung per level (AVG EC, Omzet, EPB2) dipakai valueFn yang sama dengan fungsi render kolomnya.
function kpiHeaderFilterDefs() {
  return [
    { key: 'kpi.scJks.actual', type: 'kpi-combined', kpiId: 'scJks', label: 'SC/JKS', placeholderMin: 'Minimum %', placeholderMax: 'Maksimum %' },
    { key: 'kpi.geofencing.actual', type: 'kpi-combined', kpiId: 'geofencing', label: 'Geofencing', placeholderMin: 'Minimum %', placeholderMax: 'Maksimum %' },
    // AVG EC di popover filter memakai nilai aktual mentah yang sama dengan grafik "AVG EC Aktual" di Detail KPI (kpiId 'avgEcAch').
    { key: 'support.avgEc', type: 'kpi-combined', kpiId: 'avgEcAch', label: 'AVG EC', placeholderMin: 'Minimum', placeholderMax: 'Maksimum', valueFn: rankingAverageEc },
    { key: 'kpi.roaCb.actual', type: 'kpi-combined', kpiId: 'roaCb', label: 'ROA', placeholderMin: 'Minimum %', placeholderMax: 'Maksimum %' },
    { key: 'kpi.hitRate.actual', type: 'kpi-combined', kpiId: 'hitRate', label: 'EC vs Call Total', placeholderMin: 'Minimum %', placeholderMax: 'Maksimum %' },
    // Target Omzet, Omzet, Target EPB2, EPB2 TIDAK memiliki grafik/pengaturan Strata tersendiri di Detail KPI
    // (Detail KPI hanya punya 7 grafik: SC/JKS, Geofencing, ROA, EC vs Call Total, Golden EC, Total Omset,
    // EPB Strata 2) — supaya tidak membuat definisi strata terpisah, keempat kolom nominal ini tetap
    // memakai Minimum-Maksimum saja.

  const previous = valid.length > 1 ? valid[valid.length - 2] : null;
  const best = valid.reduce((winner, point) => point.values[kpiKey] >= winner.values[kpiKey] ? point : winner, valid[0]);
  const delta = previous ? latest.values[kpiKey] - previous.values[kpiKey] : null;
  const direction = trendDeltaDirection(delta);

const SIMULATION_LEVELS = Object.freeze([

function simulationOfficialActiveWeights() {
  const normalize = source => {
    if (!source || typeof source !== 'object') return null;
    const weights = {};
    let total = 0;
    for (const kpi of SIMULATION_KPIS) {
      const weight = Number(source[kpi.id]);
      if (!Number.isFinite(weight) || weight < 0 || weight > 100) return null;
      weights[kpi.id] = weight;
      total += weight;
    }
    return Number.isFinite(total) && Math.abs(total - 100) <= 0.01 ? weights : null;
  };
  return normalize(State && State.settings && State.settings.weights) || normalize(getDefaultWeights()) || { ...getDefaultWeights() };
}
function simulationDefaultConfig() {
  const officialWeights = simulationOfficialActiveWeights();
  const selected = {}, weights = {};
  SIMULATION_KPIS.forEach(kpi => {
    selected[kpi.id] = Number(officialWeights[kpi.id]) > 0;
    weights[kpi.id] = Number(officialWeights[kpi.id]);
  });
  return { selected, weights };
}
function simulationCloneConfig(config) {
  const source = config || simulationDefaultConfig();
  return { selected: { ...source.selected }, weights: { ...source.weights } };
}
function simulationConfigValidation(config) {
  const selectedMap = config && config.selected ? config.selected : {};
  const weightMap = config && config.weights ? config.weights : {};
  const selectedIds = SIMULATION_KPIS.filter(kpi => selectedMap[kpi.id] === true).map(kpi => kpi.id);
  const checkedWeightsValid = selectedIds.every(id => {
    const value = Number(weightMap[id]);
    return Number.isFinite(value) && value > 0 && value <= 100;
  });
  const total = selectedIds.reduce((sum, id) => sum + Number(weightMap[id]), 0);
  const normalizedTotalDelta = Math.round((total - 100) * 1e12) / 1e12;
  const totalValid = Number.isFinite(total) && Math.abs(normalizedTotalDelta) <= 0.01;
  const valid = selectedIds.length > 0 && checkedWeightsValid && totalValid;
  let message = 'Konfigurasi valid dan siap diterapkan.';
  if (!selectedIds.length) message = 'Pilih minimal satu KPI.';
  else if (!checkedWeightsValid) message = 'KPI yang dipilih wajib memiliki bobot angka lebih dari 0 hingga 100.';
  else if (!totalValid) message = 'Total bobot KPI terpilih wajib 100%.';
  return { valid, selectedIds, total, message };
}
function simulationNormalizeStoredConfig(stored) {
  if (!stored || stored.version !== 1 || !stored.config || !stored.config.selected || !stored.config.weights) return null;
  const config = { selected: {}, weights: {} };
  for (const kpi of SIMULATION_KPIS) {
    if (!Object.prototype.hasOwnProperty.call(stored.config.selected, kpi.id) || !Object.prototype.hasOwnProperty.call(stored.config.weights, kpi.id)) return null;
    if (typeof stored.config.selected[kpi.id] !== 'boolean') return null;
    const rawWeight = stored.config.weights[kpi.id];
    const weight = Number(rawWeight);
    config.selected[kpi.id] = stored.config.selected[kpi.id];
    if (config.selected[kpi.id] && (typeof rawWeight !== 'number' || !Number.isFinite(weight) || weight <= 0 || weight > 100)) return null;
    config.weights[kpi.id] = typeof rawWeight === 'number' && Number.isFinite(weight) && weight >= 0 && weight <= 100 ? weight : NaN;
  }
  return simulationConfigValidation(config).valid ? config : null;
}
function ensureSimulationState() {
  if (State.simulation) return State.simulation;
  const stored = LocalPrefs.getRankingSimulation();
  const appliedConfig = simulationNormalizeStoredConfig(stored) || simulationDefaultConfig();
  const storedLevel = stored && SIMULATION_LEVELS.some(level => level.id === stored.level) ? stored.level : null;
  const level = storedLevel || (SIMULATION_LEVELS.some(item => item.id === State.lastRankingLevel) ? State.lastRankingLevel : 'regional');
  State.simulation = { draftConfig: simulationCloneConfig(appliedConfig), appliedConfig: simulationCloneConfig(appliedConfig), level };

}

function simulationRowsForLevel(level) {

function buildSimulationRanking(level, config) {
  const sourceRows = simulationRowsForLevel(level);
  const nameGetter = simulationNameGetter(level);
  const officialRanked = rankList(sourceRows.map(row => ({ ...row })), nameGetter);
  const identityCounts = new Map();
  officialRanked.forEach(row => {
    const key = simulationEntityKey(level, row);
    if (key) identityCounts.set(key, (identityCounts.get(key) || 0) + 1);
  });
  const officialRanks = new Map();
  officialRanked.forEach(row => {
    const key = simulationEntityKey(level, row);
    if (key && identityCounts.get(key) === 1) officialRanks.set(key, { rank: row.rank, score: row.finalScore });
  });
  const simulationRanked = rankList(sourceRows.map(row => {
    const simulationScore = simulationScoreForRow(row, config);
    return { ...row, officialFinalScore: row.finalScore, simulationScore, finalScore: simulationScore };
  }), nameGetter);
  return simulationRanked.map(row => {
    const official = officialRanks.get(simulationEntityKey(level, row));
    const officialRank = official ? official.rank : null;
    return {
      ...row,
      officialRank,
      officialFinalScore: official ? official.score : row.officialFinalScore,
      deltaRank: Number.isFinite(officialRank) ? officialRank - row.rank : null

  });
}

function downloadVacantBackup() {
  const payload = {
    format: 'ranking-kpi-vacant-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    entries: State.vacantEntries
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'vacant-salesman-backup.json';
  document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
}
async function restoreVacantBackupFile(file, overlay) {
  if (!requireAdmin('memulihkan data VACANT')) return;
  if (!file) return;
  showLoadingOverlay('Memulihkan data VACANT...');
  try {
    const parsed = JSON.parse(await file.text());
    if (!parsed || parsed.format !== 'ranking-kpi-vacant-backup' || !Array.isArray(parsed.entries)) throw new Error('Format backup tidak valid.');
    const validEntries = parsed.entries.filter(entry => entry && typeof entry.id === 'string' && entry.id.includes('|')).map(entry => ({
      id: entry.id,
      kodeSalesman: String(entry.kodeSalesman || ''), namaSalesman: String(entry.namaSalesman || ''),
      namaAss: String(entry.namaAss || ''), depo: String(entry.depo || ''), region: String(entry.region || ''),
      markedAt: Number(entry.markedAt || Date.now()), snapshotId: entry.snapshotId || null, cutoffDate: entry.cutoffDate || null
    }));
    if (!validEntries.length && parsed.entries.length) throw new Error('Tidak ada entri VACANT yang valid.');
    await Storage.putVacantSalesmen(validEntries);
    await reloadVacantState();
    recomputeAfterVacantChange();
    if (overlay) { const closeButton = overlay.querySelector('[data-act="close"]'); if (closeButton) closeButton.click(); else overlay.remove(); }
    showToast(`${validEntries.length} data VACANT berhasil dipulihkan.`, 'success');
    router();
  } catch (error) {
    console.error(error);
    showToast(error.message || 'File backup VACANT tidak valid.', 'error');
  } finally { hideLoadingOverlay(); }
}

/* ============================================================
   RANKING PHASE — selalu membandingkan seluruh Phase pada snapshot aktif
   dan tidak dibatasi oleh filter Phase global.
   ============================================================ */
function detailKpiCabangOfRecord(rec) {
  if (!State.masterCabang || !State.masterCabang.byKodeDepo) return null;
  const entry = State.masterCabang.byKodeDepo.get(normalizeCabangCode(rec.kodeDepo));
  return entry ? entry.cabang : null;
}
// K2: Helper reusable TUNGGAL untuk Detail KPI. Urutan SESUAI instruksi K: (1) raw Salesman snapshot aktif,
// (2) filter Phase, (3) filter Status Salesman, (4) [join Master Cabang terjadi di dalam buildHierarchy()],
// (5) filter Scope Cabang/Regional/Depo/ASS pada RAW record (SEBELUM agregasi), (6) validateDataset,
// (7) buildHierarchy. Dipakai bersama oleh Ringkasan/Distribusi/Top-Bottom/Tabel/CSV/JPG/popup bucket/drill-down
// Detail KPI — jangan menulis logika filter berbeda di banyak tempat.
function buildDetailKpiScopedHierarchy(scope, scopeValue) {
  if (!State.activeSnapshot) return null;
  // Scope Nasional (atau tanpa scopeValue) = identik State.hierarchy yang sudah dibangun dari Global Scope
  // (Phase + Regional + Status Salesman + Master Cabang sudah tercakup) - reuse, tidak membangun ulang.
  if (scope === 'nasional' || !scopeValue) return State.hierarchy;
  const cacheKey = `${hierarchyCacheFingerprint()}|dk|sc:${scope || ''}|sv:${scopeValue || ''}`;
  if (State.detailKpiHierarchyCache.has(cacheKey)) return State.detailKpiHierarchyCache.get(cacheKey);
  const __t0 = PERF_DEBUG ? performance.now() : 0;
  // Universe Detail KPI = Global Scope + Status Salesman (helper terpusat), baru difilter Scope halaman.
  let records = getCalculationRecords(State.activeSnapshot);
  if (scope === 'cabang' && scopeValue) records = records.filter(rec => detailKpiCabangOfRecord(rec) === scopeValue);
  else if (scope === 'regional' && scopeValue) records = records.filter(rec => rec.region === scopeValue);
  else if (scope === 'depo' && scopeValue) records = records.filter(rec => getDepoKey(rec) === scopeValue);
  else if (scope === 'ass' && scopeValue) records = records.filter(rec => getAssKey(rec) === scopeValue);
  const validation = validateDataset(records);
  const hierarchy = buildHierarchy(validation, State.settings);
  hierarchy.__phaseName = globalPhaseFilterLabel();
  hierarchy.__validation = validation;
  if (PERF_DEBUG) perfLog('buildDetailKpiScopedHierarchy (cache miss)', __t0, `scope=${scope} value=${scopeValue}`);
  return cachePutBounded(State.detailKpiHierarchyCache, cacheKey, hierarchy);
}
function buildHierarchyForSpecificPhase(phaseName) {
  if (!State.activeSnapshot) return null;
  const cacheKey = `${hierarchyCacheFingerprint()}|phase:${phaseName || ''}`;
  if (State.phaseHierarchyCache.has(cacheKey)) return State.phaseHierarchyCache.get(cacheKey);
  const __t0 = PERF_DEBUG ? performance.now() : 0;
  const activeStatuses = getActiveStatusSalesmanFilter();
  // Satu Phase tertentu, tetapi Global Regional + Status Salesman tetap berlaku.
  const records = applyGlobalScope(State.activeSnapshot.rawRecords || [], new Set(), State.activeRegionFilters).filter(record =>
    phaseValueOfRecord(record) === String(phaseName || '').trim() && activeStatuses.has(getEffectiveSalesmanStatus(record))
  );
  const validation = validateDataset(records);
  const hierarchy = buildHierarchy(validation, State.settings);
  hierarchy.__phaseName = phaseName;
  hierarchy.__validation = validation;
  if (PERF_DEBUG) perfLog('buildHierarchyForSpecificPhase (cache miss)', __t0, `phase=${phaseName}`);
  cachePutBounded(State.phaseHierarchyCache, cacheKey, hierarchy);
  return hierarchy;
}
// Baris Ranking Phase = Phase yang terpilih pada Global Filter (atau seluruh Phase bila "Semua").
function getScopedPhaseNames() {
  const all = getPhaseOptions();
  if (!State.activePhaseFilters || !State.activePhaseFilters.size) return all;
  return all.filter(name => State.activePhaseFilters.has(name));
}
function getPhaseRankingRows() {
  return getScopedPhaseNames().map(phaseName => {
    const hierarchy = buildHierarchyForSpecificPhase(phaseName);
    const national = hierarchy && hierarchy.national;
    if (!national) return null;
    return {
      ...national,
      key: phaseName,
      meta: { phase: phaseName },
      phaseName,
      regionCount: hierarchy.byRegion.length,
      depoCount: hierarchy.byDepo.length,
      assCount: hierarchy.byAss.length,
      totalSalesman: hierarchy.__validation.totalRead,
      eligibleSalesman: hierarchy.__validation.totalEligible,
      __phaseHierarchy: hierarchy,
      comparison: { available: false, isNew: false }
    };
  }).filter(Boolean);
}

   ke DOM Detail Viewer maupun ke Detail JPG Viewer. Field-nya TIDAK dihapus dari record dan tetap

function salesmanDetailProductivityFacts(rec, separator) {
  const parts = [];
  if (isRankingAdminView()) parts.push(`CB/TGT ROA: ${fmtNumber(rec.cb)}`, `ROA: ${fmtNumber(rec.roa)}`);
  // TAT MTD sengaja TIDAK ditampilkan — tetap dipakai penuh oleh kpiScoreBasis().
  parts.push(`Total Call Esuite: ${fmtNumber(rec.totalCallEsuite, 2)}`,
    `AVG EC: ${fmtNumber(rec.avgEc, 2)} (target ${fmtNumber(State.settings.avgEcTarget)})`);
  return parts.join(separator);
}
function salesmanDetailRevenueFacts(rec, separator) {
  const parts = [];
  if (isRankingAdminView()) parts.push(`Target Omset: ${fmtRupiah(rec.tgtOmsFm)}`, `Total Omset: ${fmtRupiah(rec.mtdOmsFm)}`);
  // TAT MTD sengaja TIDAK ditampilkan — tetap dipakai penuh oleh kpiScoreBasis().
  return parts.join(separator);
}
/* Gabungan fakta Revenue + Strata 2 dengan pemisah yang HANYA muncul bila kedua bagian terisi.
   Diperlukan karena setelah TAT MTD tidak lagi ditampilkan, bagian Revenue bisa kosong pada
   mode Viewer — tanpa ini akan tersisa baris/pemisah kosong. */
function salesmanDetailRevenueBlock(rec, separator) {
  const revenue = salesmanDetailRevenueFacts(rec, separator);

  const parts = [];
  if (isRankingAdminView()) parts.push(`Target Strata 2: ${fmtNumber(rec.tgtEpbStrata2)}`, `Actual Strata 2: ${fmtNumber(rec.achEpbPoinRoa)}`);
  parts.push(`Status: ${escapeHtml(rec.isAchieveSt2 || '-')}`);
  return parts.join(separator);
}

// Download Detail JPG — satu gambar berisi identitas, 3 kelompok KPI, dan ringkasan.
// Tidak menyertakan tombol tutup/overlay/status eligibility/info snapshot.
async function generateSalesmanDetailJpg(row) {
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas belum termuat.');
  const rec = row.rec, kpi = row.kpi, groups = row.groups;
  const bestKpi = Object.values(kpi).filter(k => k.actual !== null).sort((a, b) => b.actual - a.actual)[0];

      <tbody>
        <tr><td>Proses Kerja</td><td class="ta-right">${fmtNumber(groups.proseskerja.groupScore, 2)}</td></tr>
        <tr><td>Productivity</td><td class="ta-right">${fmtNumber(groups.productivity.groupScore, 2)}</td></tr>

      </tbody>
    </table>
    <table class="jpg-export-table" style="margin-bottom:16px;">
      <thead>${groupHeader()}</thead>
      <tbody>${kpiRow(kpi.scJks)}${kpiRow(kpi.geofencing)}${kpiRow(kpi.roaCb)}${kpiRow(kpi.hitRate)}${kpiRow(kpi.avgEcAch)}${kpiRow(kpi.revenue)}${kpiRow(kpi.strata2)}</tbody>
    </table>

      <thead><tr><th class="ta-left">Kelompok</th><th class="ta-left">Angka Dasar</th></tr></thead>
      <tbody>
        <tr><td class="ta-left">Proses Kerja</td><td class="ta-left">TGT SC JKS: ${fmtNumber(rec.tgtScJks)} &nbsp;|&nbsp; ACH SC VS JKS: ${fmtNumber(rec.achScVsJks)} &nbsp;|&nbsp; Geofencing: ${fmtNumber(rec.geofencing)}</td></tr>
        <tr><td class="ta-left">Productivity</td><td class="ta-left">${salesmanDetailProductivityFacts(rec, ' &nbsp;|&nbsp; ')}</td></tr>

    document.body.appendChild(a); a.click(); a.remove();
  } finally {
    container.remove();
  }

function autoConclusion(row) {
  const cat = row.category ? row.category.label : '-';
  const weakGroup = Object.values(row.groups).sort((a, b) => (a.groupScore ?? 999) - (b.groupScore ?? 999))[0];
  return `Kesimpulan: performa berada pada kategori <strong>${cat}</strong>. Area dengan skor kelompok terendah: <strong>${weakGroup.label}</strong> (${fmtNumber(weakGroup.groupScore, 2)}).`;
}

// mode: 'web' (sticky + wrapper scroll) atau 'jpg' (statis, class terisolasi, tanpa sticky)
function buildRegionalDepoPerformanceTableHtml(depoRows, options = {}) {
  const mode = options.mode || 'web';
  const tableClass = mode === 'jpg' ? 'regional-depo-jpg-table' : 'regional-depo-performance-table';

  const perfColumns = regionalDepoPerfColumns();
  const groupHeaderRow = regionalDepoPerfGroups(perfColumns).map(g => {
    const isStickyGroup = mode === 'web' && g.sticky;
    const classes = [g.cls, isStickyGroup ? 'rdp-sticky-group' : ''].filter(Boolean).join(' ');
    const stickyStyle = isStickyGroup ? `left:${g.stickyLeft || 0}px;width:${g.width}px;min-width:${g.width}px;max-width:${g.width}px;` : '';
    return `<th colspan="${g.span}" class="${classes}" ${stickyStyle ? `style="${stickyStyle}"` : ''}>${escapeHtml(g.label)}</th>`;
  }).join('');

  const columnHeaderRow = perfColumns.map(c => {
    if (mode !== 'web' || !c.sticky) return `<th>${escapeHtml(c.label)}</th>`;
    const cls = `rdp-sticky-col${c.stickyEnd ? ' rdp-sticky-end' : ''}`;
    return `<th class="${cls}" style="left:${c.stickyLeft}px;width:${c.width}px;min-width:${c.width}px;max-width:${c.width}px;">${escapeHtml(c.label)}</th>`;
  }).join('');

  const bodyRows = depoRows.map(row => {
    const cells = perfColumns.map(c => {
      let val = c.value(row);
      if (val === null || val === undefined || val === '' || val === 'NaN' || val === 'Infinity') val = '-';
      if (mode !== 'web' || !c.sticky) return `<td>${val}</td>`;
      const cls = `rdp-sticky-col${c.stickyEnd ? ' rdp-sticky-end' : ''}`;
      return `<td class="${cls}" style="left:${c.stickyLeft}px;width:${c.width}px;min-width:${c.width}px;max-width:${c.width}px;">${val}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  // Colgroup menjaga garis kolom header & body tetap sejajar, dipakai di web maupun JPG.
  const colgroupHtml = `<colgroup>${perfColumns.map(c => {
    const width = c.width || 105;
    return `<col style="width:${width}px;">`;
  }).join('')}</colgroup>`;

  const tableHtml = `<table class="${tableClass}">
    ${colgroupHtml}
    <thead>
      <tr class="regional-depo-group-header">${groupHeaderRow}</tr>
      <tr class="regional-depo-column-header">${columnHeaderRow}</tr>
    </thead>
    <tbody>${bodyRows || `<tr><td colspan="${perfColumns.length}" class="dt-empty">Belum ada data Depo untuk Regional ini.</td></tr>`}</tbody>
  </table>`;

  return mode === 'web' ? `<div class="regional-depo-performance-wrap">${tableHtml}</div>` : tableHtml;
}

   REUSABLE RANKING DRILL-DOWN MODAL

   Satu modal dipakai ulang; breadcrumb dan tombol kembali mempertahankan konteks.

function drilldownEntityName(level, row) {
  if (!row) return '-';
  if (level === 'phase') return row.phaseName || (row.meta && row.meta.phase) || row.key || '-';
  if (level === 'regional') return row.meta && row.meta.region || '-';
  if (level === 'cabang') return row.meta && row.meta.cabang || '-';
  if (level === 'depo') return row.meta && row.meta.depo || '-';
  if (level === 'ass') return row.meta && row.meta.namaAss || '-';
  if (level === 'salesman') return row.rec && row.rec.namaSalesman || '-';
  return '-';
}
function drilldownLevelLabel(level) {
  return ({ phase: 'Phase', regional: 'Regional', cabang: 'Cabang', depo: 'Depo', ass: 'ASS', salesman: 'Salesman' })[level] || level;
}
// hierarchy diperlukan untuk level 'regional' karena anak levelnya kondisional: Cabang jika Master Cabang
// tersedia pada hierarchy ini, langsung Depo jika tidak (lihat instruksi A4 — jangan buat data Cabang palsu).
function drilldownChildLevel(level, hierarchy) {
  if (level === 'regional') return (hierarchy && hierarchy.hasMasterCabang) ? 'cabang' : 'depo';
  return ({ phase: 'regional', cabang: 'depo', depo: 'ass', ass: 'salesman' })[level] || null;
}
function drilldownRows(parentLevel, parentRow, hierarchy) {
  if (!hierarchy || !parentRow) return [];
  if (parentLevel === 'phase') return hierarchy.byRegion || [];
  if (parentLevel === 'regional') {
    const region = parentRow.meta && parentRow.meta.region;
    if (hierarchy.hasMasterCabang) return (hierarchy.byCabang || []).filter(row => row.meta && row.meta.region === region);
    return (hierarchy.byDepo || []).filter(row => row.meta && row.meta.region === region);
  }
  if (parentLevel === 'cabang') {
    const cabang = parentRow.meta && parentRow.meta.cabang;
    return (hierarchy.byDepo || []).filter(row => row.meta && row.meta.cabang === cabang);
  }
  if (parentLevel === 'depo') {
    return (hierarchy.byAss || []).filter(row =>
      (row.eligibleMembers || []).some(member => getDepoKey(member) === parentRow.key)
    );
  }
  if (parentLevel === 'ass') {
    return (hierarchy.salesmanScored || []).filter(row => getAssKey(row.rec) === parentRow.key);
  }
  return [];
}

  if (level === 'cabang') return row => row.meta && row.meta.cabang;
  if (level === 'depo') return row => row.meta && row.meta.depo;

      { key: 'rec.region', label: 'Regional', render: row => `<span title="${escapeHtml(row.rec.region || '-')}">${escapeHtml(row.rec.region || '-')}</span>`, csvOnly: true, excludeFromJpg: true }
    ]

}
function openRankingDrilldownModal(startLevel, startRow, options = {}) {
  const hierarchy = options.hierarchy || State.hierarchy;
  if (!hierarchy || !startRow) { showToast('Data drill-down tidak tersedia.', 'info'); return; }
  // Data drill-down berasal dari `hierarchy` yang SUDAH dibangun dari Global Scope — nilai ini hanya label.
  const phaseName = options.phase || hierarchy.__phaseName || globalPhaseFilterLabel() || null;
  const stack = [{ level: startLevel, row: startRow }];
  const overlay = openModal('<div class="drilldown-shell" id="ranking-drilldown-shell"></div>', { wide: true, extraClass: 'modal-ranking-drilldown' });
  const shell = overlay.querySelector('#ranking-drilldown-shell');

  const renderStep = () => {
    const current = stack[stack.length - 1];
    const childLevel = drilldownChildLevel(current.level, hierarchy);
    if (!childLevel) return;
    const rawRows = drilldownRows(current.level, current.row, hierarchy).map(row => ({ ...row }));
    const ranked = rankList(rawRows, drilldownNameGetter(childLevel));
    ranked.forEach(row => { row.comparison = { available: false, isNew: false }; });
    const parentLabel = `${drilldownLevelLabel(current.level)} — ${drilldownEntityName(current.level, current.row)}`;
    const childLabel = drilldownLevelLabel(childLevel);
    const breadcrumbHtml = stack.map((item, index) => {
      const isCurrent = index === stack.length - 1;
      return `${index ? '<span class="drilldown-separator">›</span>' : ''}<button type="button" class="drilldown-crumb ${isCurrent ? 'current' : ''}" data-crumb-index="${index}" ${isCurrent ? 'disabled' : ''} title="${escapeHtml(drilldownEntityName(item.level, item.row))}">${escapeHtml(drilldownEntityName(item.level, item.row))}</button>`;
    }).join('');
    shell.innerHTML = `
      <div class="drilldown-head">
        <div>
          <h2 class="drilldown-title">Detail ${escapeHtml(parentLabel)}</h2>
          <div class="drilldown-subtitle">Menampilkan Ranking ${escapeHtml(childLabel)} di dalam konteks ini${phaseName ? ` • Phase: ${escapeHtml(phaseName)}` : ''}.</div>
        </div>
      </div>
      <div class="drilldown-nav">
        ${stack.length > 1 ? '<button type="button" class="btn btn-sm btn-ghost drilldown-back">← Kembali</button>' : ''}
        <div class="drilldown-breadcrumbs">${breadcrumbHtml}</div>
      </div>
      <div class="panel"><div id="dt-ranking-drilldown"></div></div>`;

    const backButton = shell.querySelector('.drilldown-back');
    if (backButton) backButton.addEventListener('click', () => { stack.pop(); renderStep(); });
    shell.querySelectorAll('.drilldown-crumb:not(.current)').forEach(button => button.addEventListener('click', () => {
      const index = Number(button.dataset.crumbIndex);
      if (!Number.isInteger(index) || index < 0) return;
      stack.splice(index + 1);
      renderStep();
    }));

    const table = new DataTable({
      containerId: 'dt-ranking-drilldown',
      exportFilename: `ranking-${childLevel}-${sanitizeFilenamePart(drilldownEntityName(current.level, current.row))}.csv`,
      searchableKeys: childLevel === 'salesman'
        ? ['rec.namaSalesman', 'rec.kodeSalesman', 'rec.namaAss', 'rec.depo', 'rec.region']
        : childLevel === 'regional' ? ['meta.region']
        : childLevel === 'depo' ? ['meta.depo', 'meta.kodeDepo', 'meta.region']
        : ['meta.namaAss', 'meta.nikAss', 'meta.depo', 'meta.region'],
      columns: drilldownColumns(childLevel), data: ranked,
      isRankingTable: true, rankingTotal: ranked.length, sortingEnabled: true, quickStatusEnabled: false,
      rowDetailFn: childLevel === 'salesman'
        ? row => openSalesmanDetailDrawer(row)
        : row => { stack.push({ level: childLevel, row }); renderStep(); },
      jpgTitle: `RANKING ${childLabel.toUpperCase()} — ${drilldownEntityName(current.level, current.row).toUpperCase()}`,
      jpgFilename: `Ranking_${childLabel}_${sanitizeFilenamePart(drilldownEntityName(current.level, current.row))}`,
      jpgKpiSummary: true,
      jpgFilterSummary: () => [
        ...statusSalesmanJpgChips(),
        ...(phaseName ? [`Phase: ${phaseName}`] : []),
        ...stack.map(item => `${drilldownLevelLabel(item.level)}: ${drilldownEntityName(item.level, item.row)}`),
        ...(table.searchTerm ? [`Pencarian: ${table.searchTerm}`] : [])
      ]
    });
    table.render();
  };

  renderStep();
}

async function generateRegionalDepoPerformanceJpg(regionRow, depoRows) {
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas belum termuat.');

  const container = document.createElement('div');
  container.className = 'regional-depo-jpg-container';
  container.style.width = '2300px';
  container.innerHTML = `
    <div class="dashboard-jpg-title">PENCAPAIAN DEPO — ${escapeHtml(regionRow.meta.region).toUpperCase()}</div>
    <div class="dashboard-jpg-subtitle">Ringkasan pencapaian operasional seluruh Depo.</div>
    <div class="dashboard-jpg-subtitle">${escapeHtml(statusSalesmanSummaryChip())}${statusSalesmanVacantWarningText() ? ' &nbsp;|&nbsp; ' + escapeHtml(statusSalesmanVacantWarningText()) : ''}</div>
    ${buildRegionalPerformanceSummaryHtml(regionRow, depoRows)}
    ${buildRegionalDepoPerformanceTableHtml(depoRows, { mode: 'jpg' })}
  `;
  document.body.appendChild(container);
  try {
    let canvas;
    try { canvas = await html2canvas(container, { scale: 1.5, backgroundColor: '#ffffff', useCORS: true, logging: false }); }
    catch (e) { canvas = await html2canvas(container, { scale: 1, backgroundColor: '#ffffff', useCORS: true, logging: false }); }
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    const a = document.createElement('a'); a.href = dataUrl; a.download = `Pencapaian_Depo_${sanitizeFilenamePart(regionRow.meta.region)}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
  } finally {
    container.remove();
  }
}

function exportRegionalDepoPerformanceCsv(regionRow, depoRows) {
  const perfColumns = regionalDepoPerfColumns();

  const rows = depoRows.map(depoRow => perfColumns.map(c => c.csvValue(depoRow)));
  exportToCsv(`Pencapaian_Depo_${sanitizeFilenamePart(regionRow.meta.region)}.csv`, headers, rows, [...statusSalesmanCsvMetadataRows(), ['Regional', regionRow.meta.region]]);

        <div class="drilldown-breadcrumbs">${stack.map((s, i) => `${i ? '<span class="drilldown-separator">›</span>' : ''}<button type="button" class="drilldown-crumb ${i === stack.length - 1 ? 'current' : ''}" data-crumb-index="${i}" ${i === stack.length - 1 ? 'disabled' : ''} title="${escapeHtml(s.label)}">${escapeHtml(s.label)}</button>`).join('')}</div>
      </div>` : '';

    // F: filter relevan per tahap - leaf selalu Regional->Cabang->ASS; entry Cabang/Depo/ASS filter sesuai F2-F4.
    let filterHtml = '';
    if (isLeaf) {
      const regionOptions = Array.from(new Set(rawList.map(e => e.region).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'id'));
      const cabangPool = filterRegional ? rawList.filter(e => e.region === filterRegional) : rawList;

      const assPool = filterCabang ? cabangPool.filter(e => detailKpiEntityMatchesCabangFilter(e, filterCabang)) : cabangPool;

      filterHtml = `<div class="kpi-bucket-filters">
        <select class="kpi-bucket-filter-select" id="kpi-bucket-filter-regional"><option value="">Semua Regional</option>${regionOptions.map(v => `<option value="${escapeHtml(v)}" ${v === filterRegional ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('')}</select>

    } else if (isEntryStep && (basisLevel === 'cabang' || basisLevel === 'depo' || basisLevel === 'ass')) {

      const regionOptions = Array.from(new Set(rawList.flatMap(e => detailKpiEntityRegionInfos(e)))).sort((a, b) => a.localeCompare(b, 'id'));
      const regionPool = filterRegional ? rawList.filter(e => detailKpiEntityRegionInfos(e).includes(filterRegional)) : rawList;
      let cabangSelectHtml = '';
      if (basisLevel === 'depo' || basisLevel === 'ass') {
        const cabangOptions = hasMasterCabang ? Array.from(new Set(regionPool.flatMap(e => detailKpiEntityCabangInfos(e).map(i => i.cabang)))).sort((a, b) => a.localeCompare(b, 'id')) : [];

      filterHtml = `<div class="kpi-bucket-filters">

    // H3/H4/H5: HANYA tahap entry (depth 0) untuk basisLevel selain Regional menampilkan kolom konteks leluhur.

    const contextGetter = { region: e => e.region || '-', cabang: e => entityCabangLabel(e) };
    const headCols = isLeaf

    const theadHtml = `<tr>${headCols.map(([key, label]) => `<th class="kpi-bucket-sortable" data-sort-key="${key}" role="button" tabindex="0">${escapeHtml(label)} <span class="dt-sort-icon ${sortState.key === key ? 'is-active' : ''}">${sortIcon(key)}</span></th>`).join('')}</tr>`;

    const rowHtml = entry => {
      if (isLeaf) {
        return `<tr class="kpi-bucket-row-clickable" tabindex="0" role="button" aria-label="Lihat detail ${escapeHtml(entry.name || 'Salesman')}" data-row-key="${escapeHtml(buildVacantSalesmanKey(entry.item.rec))}"><td class="ta-left">${escapeHtml(entry.region || '-')}</td><td class="ta-left">${escapeHtml(entityCabangLabel(entry))}</td><td class="ta-left">${escapeHtml(entityAssLabel(entry))}</td><td class="ta-left"><strong>${escapeHtml(entry.name || '-')}</strong></td><td><strong>${detailKpiDisplayValue(kpiId, entry.val)}</strong></td></tr>`;

      return `<tr class="kpi-bucket-row-clickable" tabindex="0" role="button" aria-label="Buka ${escapeHtml(entry.name || '-')}" data-entity-key="${escapeHtml(entry.item.key)}" data-entity-label="${escapeHtml(entry.name)}">${contextCells}<td class="ta-left"><strong>${escapeHtml(entry.name || '-')}</strong></td><td><strong>${detailKpiDisplayValue(kpiId, entry.val)}</strong></td></tr>`;

    shell.innerHTML = `
      <div class="kpi-bucket-head">
        <h2 class="kpi-bucket-title">${escapeHtml(valueLabel)} — ${escapeHtml(bucket.label)}</h2>
      </div>
      ${breadcrumbHtml}
      <div class="kpi-bucket-actions">
        <input type="search" id="kpi-bucket-search" class="kpi-bucket-search" placeholder="Cari ${isLeaf ? 'Salesman' : levelLabelText}..." value="${escapeHtml(searchTerm)}" />
        ${filterHtml}
        <button class="btn btn-outline btn-sm" id="kpi-bucket-csv">CSV</button>
        <button class="btn btn-outline btn-sm" id="kpi-bucket-jpg">JPG</button>
      </div>
      <div class="kpi-bucket-table-wrap">
        <table class="kpi-bucket-table"><thead>${theadHtml}</thead><tbody id="kpi-bucket-body">${pageRows.length ? pageRows.map(rowHtml).join('') : `<tr><td colspan="${headCols.length}" class="detail-kpi-table-empty">Tidak ada ${isLeaf ? 'Salesman' : levelLabelText.toLowerCase()} yang sesuai filter.</td></tr>`}</tbody></table>
      </div>
      <div class="dt-footer">
        <span class="dt-info">Menampilkan ${pageRows.length === 0 ? 0 : start + 1}-${start + pageRows.length} dari ${totalFiltered} data</span>
        <label class="dt-pagesize-label">Baris:
          <select class="kpi-bucket-pagesize">${[25, 50, 100].map(n => `<option value="${n}" ${pageSize === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
        </label>
        <div class="dt-pagination">
          <button class="btn btn-sm btn-ghost kpi-bucket-prev" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
          <span class="dt-page-indicator">Hal ${page} / ${totalPages}</span>
          <button class="btn btn-sm btn-ghost kpi-bucket-next" ${page >= totalPages ? 'disabled' : ''}>Next ›</button>
        </div>
      </div>`;

    // ===== Wiring (event delegation ringan per render - popup dibangun ulang tiap interaksi, S) =====
    const backBtn = shell.querySelector('.drilldown-back');
    if (backBtn) backBtn.addEventListener('click', () => { stack.pop(); resetStepState(); renderStep(); });
    shell.querySelectorAll('.drilldown-crumb:not(.current)').forEach(btn => btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.crumbIndex);
      stack.splice(idx + 1);
      resetStepState(); renderStep();
    }));
    const searchInput = shell.querySelector('#kpi-bucket-search');
    let searchDebounce = null;
    searchInput.addEventListener('input', e => {
      clearTimeout(searchDebounce);
      const val = e.target.value;
      searchDebounce = setTimeout(() => { searchTerm = val; page = 1; renderStep(); shell.querySelector('#kpi-bucket-search').focus(); }, 220);
    });
    const regSel = shell.querySelector('#kpi-bucket-filter-regional');
    if (regSel) regSel.addEventListener('change', e => { filterRegional = e.target.value; filterCabang = ''; filterAss = ''; page = 1; renderStep(); });
    const cabSel = shell.querySelector('#kpi-bucket-filter-cabang');
    if (cabSel) cabSel.addEventListener('change', e => { filterCabang = e.target.value; filterAss = ''; page = 1; renderStep(); });
    const assSel = shell.querySelector('#kpi-bucket-filter-ass');
    if (assSel) assSel.addEventListener('change', e => { filterAss = e.target.value; page = 1; renderStep(); });
    const filterResetBtn = shell.querySelector('#kpi-bucket-filter-reset');
    if (filterResetBtn) filterResetBtn.addEventListener('click', () => { filterRegional = ''; filterCabang = ''; filterAss = ''; page = 1; renderStep(); });
    shell.querySelectorAll('.kpi-bucket-sortable').forEach(th => {
      const activate = () => {
        const key = th.dataset.sortKey;
        const defaultDir = key === 'val' ? 'desc' : 'asc';
        if (sortState.key !== key) sortState = { key, dir: defaultDir };
        else if (sortState.dir === defaultDir) sortState = { key, dir: defaultDir === 'asc' ? 'desc' : 'asc' };
        else sortState = { key: null, dir: null };
        page = 1; renderStep();
      };
      th.addEventListener('click', activate);
      th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } });
    });
    shell.querySelector('.kpi-bucket-prev').addEventListener('click', () => { if (page > 1) { page--; renderStep(); } });
    shell.querySelector('.kpi-bucket-next').addEventListener('click', () => { if (page < totalPages) { page++; renderStep(); } });
    shell.querySelector('.kpi-bucket-pagesize').addEventListener('change', e => { pageSize = parseInt(e.target.value, 10) || 25; page = 1; renderStep(); });
    shell.querySelectorAll('.kpi-bucket-row-clickable').forEach(tr => {
      const activateRow = event => {
        if (event.target.closest('button,input,select,a,label')) return;
        if (isLeaf) {
          const key = tr.dataset.rowKey;
          const entry = pageRows.find(e => buildVacantSalesmanKey(e.item.rec) === key);
          if (entry) openSalesmanDetailDrawer(entry.item);
        } else {
          const key = tr.dataset.entityKey, label = tr.dataset.entityLabel;
          stack.push({ levelKey, key, label });
          resetStepState(); renderStep();
        }
      };
      tr.addEventListener('click', activateRow);
      tr.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        if (event.target.closest('button,input,select,a,label')) return;
        event.preventDefault();
        activateRow(event);

    // ===== Export CSV/JPG - seluruh hasil filter (search+filter+sort), BUKAN hanya halaman aktif (N/Q/R) =====
    const filenameParts = [detailKpiShortLabel(kpiId), bucket.label, ...stack.map(s => s.label), levelLabelText].map(sanitizeFilenamePart);
    const filenameBase = `Detail_KPI_${filenameParts.join('_')}`;
    shell.querySelector('#kpi-bucket-csv').addEventListener('click', () => {
      const metadata = [['Nama KPI', valueLabel], ['Bucket', bucket.label], ['Level Awal', detailKpiLevelLabel(basisLevel)]];
      if (isLeaf) {
        exportToCsv(`${filenameBase}.csv`, ['Regional', 'Cabang', 'ASS', 'Nama Salesman', 'Pencapaian'],
          filteredList.map(e => [e.region || '-', entityCabangLabel(e), entityAssLabel(e), e.name || '-', detailKpiDisplayValue(kpiId, e.val)]), metadata);
      } else {
        const headers = [...entryContextCols.map(c => c[1]), levelLabelText, 'Pencapaian'];
        exportToCsv(`${filenameBase}.csv`, headers, filteredList.map(e => [...entryContextCols.map(c => contextGetter[c[0]](e)), e.name || '-', detailKpiDisplayValue(kpiId, e.val)]), metadata);
      }
      showToast('CSV berhasil diunduh.', 'success');
    });
    shell.querySelector('#kpi-bucket-jpg').addEventListener('click', async () => {
      if (!filteredList.length) return showToast('Tidak ada data yang dapat diunduh.', 'info');
      showLoadingOverlay('Menyiapkan JPG...');
      try {
        const columns = isLeaf
          ? [
              { key: 'region', label: 'Regional', width: 130, render: e => e.region || '-', jpgValue: e => e.region || '-' },
              { key: 'cabang', label: 'Cabang', width: 150, render: e => entityCabangLabel(e), jpgValue: e => entityCabangLabel(e) },
              { key: 'ass', label: 'ASS', width: 160, render: e => entityAssLabel(e), jpgValue: e => entityAssLabel(e) },
              { key: 'name', label: 'Nama Salesman', width: 220, isPrimaryCell: true, render: e => e.name || '-', jpgValue: e => e.name || '-' },
              { key: 'val', label: 'Pencapaian', width: 130, render: e => detailKpiDisplayValue(kpiId, e.val), jpgValue: e => detailKpiDisplayValue(kpiId, e.val) }
            ]
          : [
              ...entryContextCols.map(c => ({ key: c[0], label: c[1], width: 150, render: e => contextGetter[c[0]](e), jpgValue: e => contextGetter[c[0]](e) })),
              { key: 'name', label: levelLabelText, width: 260, isPrimaryCell: true, render: e => e.name || '-', jpgValue: e => e.name || '-' },
              { key: 'val', label: 'Pencapaian', width: 150, render: e => detailKpiDisplayValue(kpiId, e.val), jpgValue: e => detailKpiDisplayValue(kpiId, e.val) }
            ];
        await generateJpgReport({
          rows: filteredList, columns, title: `${valueLabel.toUpperCase()} — ${bucket.label}`, subtitle: '',
          filterSummary: [], kpiSummary: false, filenameBase, rowsPerPage: 32, isRankingTable: false, rankingTotal: 0
        });
        showToast('JPG berhasil diunduh.', 'success');
      } catch (error) { console.error(error); showToast('JPG gagal dibuat.', 'error'); }
      finally { hideLoadingOverlay(); }
    });
  };

  renderStep();
}
function detailKpiSettingsPreview(kpiId, mode, strata, threshold) {

function openDetailKpiChartSettingsModal(kpiId) {
  const current = detailKpiChartSetting(kpiId);
  const cappedNormal = detailKpiIsCappedNormal(kpiId);
  const html = `<h2 style="margin:0;color:var(--navy)">Pengaturan Grafik — ${escapeHtml(detailKpiShortLabel(kpiId))}</h2>
    <div class="detail-kpi-settings-mode"><button class="btn btn-sm ${current.mode === 'strata' ? 'btn-primary' : 'btn-outline'}" data-mode="strata">Strata</button><button class="btn btn-sm ${current.mode === 'threshold' ? 'btn-primary' : 'btn-outline'}" data-mode="threshold">Batas</button></div>
    <div id="dk-settings-fields"></div><div class="detail-kpi-settings-preview" id="dk-settings-preview"></div>
    <div class="detail-kpi-settings-actions"><button class="btn btn-ghost btn-sm" id="dk-settings-reset">Reset Default</button><div class="detail-kpi-settings-actions-right"><button class="btn btn-primary btn-sm" id="dk-settings-save">Simpan</button></div></div>`;
  const overlay = openModal(html, { extraClass: 'modal-wide' });
  let mode = current.mode;
  let strata = detailKpiNormalizeStrata(kpiId, current.strata).map(String);
  let threshold = String(current.threshold);
  const fields = overlay.querySelector('#dk-settings-fields');
  const preview = overlay.querySelector('#dk-settings-preview');
  const parsedStrata = () => strata.map(detailKpiParseBoundary).filter(Number.isFinite);
  const updatePreview = () => {
    preview.textContent = `Preview: ${detailKpiSettingsPreview(kpiId, mode, parsedStrata(), detailKpiParseBoundary(threshold))}`;
  };
  // Mengurutkan kotak strata (kecil -> besar), dipanggil HANYA saat Enter, blur, atau Simpan — bukan saat mengetik,
  // agar kotak tidak berpindah posisi saat pengguna masih mengetik (lihat instruksi B2/B3). Kotak 100% yang terkunci
  // (untuk KPI maksimum normal 100%) selalu ditempatkan paling kanan setelah pengurutan. Jika masih ada kotak kosong
  // atau berisi nilai invalid, urutan dibiarkan apa adanya (tidak diurutkan) sampai seluruh kotak terisi angka valid.
  const sortStrataNow = () => {
    const items = strata.map(value => ({ value, locked: cappedNormal && Number(value) === 100 }));
    const lockedItems = items.filter(item => item.locked);
    const movable = items.filter(item => !item.locked);
    const allValid = movable.every(item => Number.isFinite(detailKpiParseBoundary(item.value)));
    if (!allValid) return;
    movable.sort((a, b) => detailKpiParseBoundary(a.value) - detailKpiParseBoundary(b.value));
    const nextStrata = [...movable.map(item => item.value), ...lockedItems.map(item => item.value)];
    if (nextStrata.join('|') === strata.join('|')) return; // sudah urut, hindari render ulang tak perlu
    strata = nextStrata;
    renderFields();
  };
  const renderFields = () => {
    overlay.querySelectorAll('[data-mode]').forEach(btn => { btn.className = `btn btn-sm ${btn.dataset.mode === mode ? 'btn-primary' : 'btn-outline'}`; });
    if (mode === 'strata') {
      const lockedIndex = cappedNormal ? strata.findIndex(value => Number(value) === 100) : -1;
      fields.innerHTML = `<p class="muted" style="margin:8px 0 0">Tambah, ubah, atau hapus batas strata. Sistem akan mengurutkan angka otomatis.${cappedNormal ? ' Batas normal 100% dikunci; nilai di atas 100% tetap tampil sebagai Anomali.' : ''}</p>
        <div class="detail-kpi-settings-grid">${strata.map((value, index) => {
          const locked = cappedNormal && index === lockedIndex;
          return `<div class="detail-kpi-settings-item"><input type="number" step="any" data-strata-index="${index}" value="${escapeHtml(value)}" aria-label="Batas strata ${index + 1}" ${locked ? 'readonly' : ''}/>${locked ? '<span class="detail-kpi-settings-lock">100% 🔒</span>' : `<button type="button" class="detail-kpi-settings-remove" data-remove-strata="${index}" title="Hapus batas" aria-label="Hapus batas ${index + 1}">−</button>`}</div>`;
        }).join('')}</div><button type="button" class="btn btn-outline btn-sm detail-kpi-settings-add" id="dk-add-strata">+ Tambah Batas</button>`;
      fields.querySelectorAll('[data-strata-index]').forEach(input => {
        input.addEventListener('input', () => { strata[Number(input.dataset.strataIndex)] = input.value; updatePreview(); });
        input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); sortStrataNow(); } });
        input.addEventListener('blur', () => { sortStrataNow(); });
      });
      fields.querySelectorAll('[data-remove-strata]').forEach(button => button.addEventListener('click', () => { strata.splice(Number(button.dataset.removeStrata), 1); renderFields(); }));
      fields.querySelector('#dk-add-strata').addEventListener('click', () => {
        strata.unshift(''); // kotak baru SELALU di posisi paling kiri, bukan sebelum kunci 100%
        renderFields();
        const newInput = fields.querySelector('[data-strata-index="0"]');
        if (newInput) { newInput.focus(); newInput.scrollIntoView({ block: 'nearest', inline: 'start' }); }
      });
    } else {
      fields.innerHTML = `<p class="muted" style="margin:8px 0 6px">Masukkan satu angka untuk membandingkan nilai di bawah dan yang mencapai batas.${cappedNormal ? ' Nilai di atas 100% tetap dipisahkan sebagai Anomali.' : ''}</p><input type="number" step="any" id="dk-threshold-value" value="${escapeHtml(threshold)}" style="width:160px;min-width:0;text-align:center" ${cappedNormal ? 'max="100"' : ''}/>`;
      const thresholdInput = fields.querySelector('#dk-threshold-value');
      thresholdInput.addEventListener('input', () => { threshold = thresholdInput.value; updatePreview(); });
    }
    updatePreview();
  };
  overlay.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => { mode = btn.dataset.mode; renderFields(); }));
  overlay.querySelector('#dk-settings-reset').addEventListener('click', () => {
    const defaults = DETAIL_KPI_DEFAULT_CHART_SETTINGS[kpiId];
    mode = defaults.mode; strata = [...defaults.strata].map(String); threshold = String(defaults.threshold); renderFields();
  });
  overlay.querySelector('#dk-settings-save').addEventListener('click', async () => {
    let savedStrata = detailKpiNormalizeStrata(kpiId, parsedStrata());
    const rawValues = strata.map(detailKpiParseBoundary);
    if (mode === 'strata') {
      if (rawValues.some(value => value === null)) return showToast('Kotak batas yang kosong harus diisi atau dihapus.', 'error');
      if (new Set(rawValues).size !== rawValues.length) return showToast('Batas strata tidak boleh memiliki angka yang sama.', 'error');
      if (!savedStrata.length) return showToast('Tambahkan minimal satu batas strata.', 'error');
      if (cappedNormal && rawValues.some(value => value > 100)) return showToast('Batas normal untuk KPI ini tidak boleh lebih dari 100%.', 'error');
    }
    const savedThreshold = detailKpiParseBoundary(threshold);
    if (mode === 'threshold') {
      if (!Number.isFinite(savedThreshold)) return showToast('Nilai batas wajib berupa angka.', 'error');
      if (cappedNormal && savedThreshold > 100) return showToast('Batas untuk KPI ini tidak boleh lebih dari 100%.', 'error');
    }
    const strataChanged = JSON.stringify(current.strata || []) !== JSON.stringify(savedStrata);
    State.settings.detailKpiCharts[kpiId] = { mode, strata: savedStrata, threshold: savedThreshold ?? current.threshold };
    try {
      await Storage.saveSettings(State.settings);
      const closeButton = overlay.querySelector('[data-act="close"]');
      if (closeButton) closeButton.click(); else overlay.remove();
      router();
      if (strataChanged && resetKpiStrataFiltersAcrossRankings(kpiId)) {
        showToast(`Strata ${detailKpiShortLabel(kpiId)} berhasil diubah. Filter Strata ${detailKpiShortLabel(kpiId)} pada seluruh ranking telah direset.`, 'success');
      } else {
        showToast('Pengaturan grafik berhasil disimpan.', 'success');
      }
    } catch (error) { console.error(error); showToast('Pengaturan grafik gagal disimpan.', 'error'); }
  });
  renderFields();
}

async function runDetailKpiExport(buildHtmlFn, filenameBase, triggerButton, loadingMessage) {
  if (__dkxExportInProgress) return; // cegah double click / proses ganda
  if (typeof html2canvas === 'undefined') { showToast('html2canvas tidak tersedia.', 'error'); return; }
  __dkxExportInProgress = true;
  if (triggerButton) triggerButton.disabled = true;
  showLoadingOverlay(loadingMessage || 'Mempersiapkan JPG...');
  const stage = document.createElement('div');
  stage.className = 'dkx-export-stage';
  document.body.appendChild(stage);
  try {
    stage.innerHTML = buildHtmlFn();
    await new Promise(resolve => setTimeout(resolve, 60)); // beri waktu layout & font stabil sebelum screenshot
    const canvas = await html2canvas(stage, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/jpeg', .95);
    link.download = `${sanitizeFilenamePart(filenameBase)}.jpg`;
    document.body.appendChild(link); link.click(); link.remove();
    showToast('JPG berhasil diunduh.', 'success');
  } catch (error) {
    console.error(error);
    showToast('JPG gagal dibuat.', 'error');
  } finally {
    stage.remove();
    hideLoadingOverlay();
    __dkxExportInProgress = false;
    if (triggerButton) triggerButton.disabled = false;
  }
}

/* ------------------------------------------------------------
   FIELD PERIODE PADA ADMIN UPLOAD
   ------------------------------------------------------------
   - Periode SELALU = bulan dari Tanggal/Cut-off Data (bukan bulan browser).
   - Jenis Data MTD/Closing dipilih Admin secara eksplisit.
   - Bila periode tersebut SUDAH pernah Closing, opsi MTD dikunci di UI. Kunci
     sebenarnya tetap di database (trigger + RPC) — UI hanya memberi tahu lebih awal.
   ------------------------------------------------------------ */
function uploadPeriodStatusValue() {
  const el = document.getElementById('period-status-input');
  return normalizePeriodStatusValue(el && el.value) || PERIOD_STATUS_MTD;
}
function syncUploadPeriodFields() {
  const cutoffEl = document.getElementById('cutoff-date-input');
  const monthEl = document.getElementById('period-month-input');
  const statusEl = document.getElementById('period-status-input');
  const hintEl = document.getElementById('period-status-hint');
  if (!cutoffEl || !monthEl || !statusEl) return;
  const periodKey = periodKeyFromCutoffDate(cutoffEl.value);
  monthEl.value = periodKey;
  const mtdOption = statusEl.querySelector('option[value="MTD"]');
  const locked = !!periodKey && periodIsAlreadyClosing(periodKey);
  if (mtdOption) mtdOption.disabled = locked;
  if (locked && normalizePeriodStatusValue(statusEl.value) === PERIOD_STATUS_MTD) statusEl.value = PERIOD_STATUS_CLOSING;
  if (!hintEl) return;
  if (!periodKey) {
    hintEl.className = 'upload-period-hint warn';
    hintEl.textContent = 'Tanggal / Cut-off Data belum valid, sehingga periode belum dapat ditentukan.';
    return;
  }
  const status = uploadPeriodStatusValue();
  if (locked) {
    const source = periodClosingLockSource(periodKey) === 'local'
      ? 'sudah tersimpan sebagai Closing di workspace lokal Admin (belum dipublikasikan)'
      : 'sudah dipublikasikan sebagai Closing';
    hintEl.className = 'upload-period-hint warn';
    hintEl.textContent = `${periodMonthLabel(periodKey)} ${source}. Perbaikan hanya dapat dilakukan sebagai revisi Closing berikutnya — periode tidak dapat kembali ke MTD.`;
  } else if (status === PERIOD_STATUS_CLOSING) {
    hintEl.className = 'upload-period-hint';
    hintEl.textContent = `Periode ${periodMonthLabel(periodKey)} akan disimpan sebagai Closing. TAT pada file sumber wajib 100% — angka TAT tidak akan diubah oleh sistem.`;
  } else {
    hintEl.className = 'upload-period-hint';
    hintEl.textContent = `Periode ${periodMonthLabel(periodKey)} akan disimpan sebagai MTD.`;
  }
}
function wireUploadPeriodFields() {
  const cutoffEl = document.getElementById('cutoff-date-input');
  const statusEl = document.getElementById('period-status-input');
  if (cutoffEl) cutoffEl.addEventListener('change', () => { syncUploadPeriodFields(); renderUploadPreview(); });
  if (statusEl) statusEl.addEventListener('change', () => { syncUploadPeriodFields(); renderUploadPreview(); });
  // Daftar periode resmi dibutuhkan untuk mengunci MTD setelah Closing.
  refreshOfficialPeriods().then(syncUploadPeriodFields).catch(() => syncUploadPeriodFields());
  syncUploadPeriodFields();
}

async function confirmMasterCabangUpload() {

  if (!preview || !preview.validation.canSave) return;
  showLoadingOverlay('Menyimpan Master Cabang...');
  try {
    const record = { rows: preview.validation.dedupedRows, fileName: preview.file.name, uploadedAt: Date.now(), sheetName: preview.parsed.sheetName };
    await Storage.saveMasterCabang(record); // hanya menggantikan master lama setelah tersimpan sukses; jika gagal, master lama tetap utuh
    setActiveMasterCabangInState(record);

    hideLoadingOverlay();
    navigate('/upload', { tab: 'master-cabang' });
    showToast(`Master Cabang berhasil disimpan (${fmtNumber(record.rows.length)} Kode Depo).`, 'success');
  } catch (error) {

  }
}

    if (parsed.rawRecords.length === 0) { hideLoadingOverlay(); previewArea.innerHTML = `<div class="alert alert-error">Tidak ditemukan baris data salesman pada file ini. Pastikan format sesuai template.</div>`; return; }
