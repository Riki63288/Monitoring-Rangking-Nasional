<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Ranking KPI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-service.js"></script>
<style>
/* =====================================================
   DESIGN TOKENS — mengikuti referensi Website Monitoring
   (latar krem terang, pill nav navy, badge hijau, kartu putih)
   ===================================================== */
:root{
  /* ===== Geometry header tabel Ranking (satu sumber kebenaran) =====
     Lebar kolom KPI seragam; nilai JS RANKING_KPI_COLUMN_WIDTH harus sama dengan angka ini. */
  --ranking-kpi-column-width:104px;
  --ranking-group-header-height:38px;
  --ranking-subheader-height:46px;
  --ranking-header-total-height:84px; /* group + subheader, disamakan dengan header standalone */
  --dt-header-gap:4px;      /* jarak label-unit <-> tombol filter */
  --dt-header-sort-gap:3px; /* jarak label <-> icon sort */
  --bg:#f6f4ef;
  --bg-soft:#efece3;
  --card:#ffffff;
  --card-border:#e8e4d9;
  --navy:#1f2937;
  --navy-soft:#374151;
  --ink:#1c1f26;
  --ink-soft:#6b7280;
  --ink-faint:#9aa0ab;
  --gold:#c9a227;
  --green:#1f9d55;
  --green-bg:#e3f6ea;
  --red:#d64545;
  --red-bg:#fbe7e6;
  --orange:#d98a20;
  --orange-bg:#fbeedb;
  --blue:#2f7fd1;
  --blue-bg:#e6f0fb;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(31,41,55,0.06),0 1px 2px rgba(31,41,55,0.05);
  --shadow-md:0 8px 24px rgba(31,41,55,0.10);
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,'Inter',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ===== Shell ===== */
#app-shell{display:flex;min-height:100vh;}
#sidebar{
  width:240px;flex-shrink:0;background:var(--navy);color:#e5e7eb;
  display:flex;flex-direction:column;transition:width .2s ease;
  position:sticky;top:0;height:100vh;overflow:visible;
}
#app-shell.sidebar-collapsed #sidebar{width:70px;}
#app-shell.sidebar-collapsed .sidebar-label,
#app-shell.sidebar-collapsed .sidebar-title,
#app-shell.sidebar-collapsed .sidebar-snapshot-info{display:none;}
.sidebar-header{position:relative;display:block;padding:10px 12px 8px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand{display:block;width:100%;min-width:0;line-height:0;border-radius:9px;cursor:pointer;}
.sidebar-brand-card{
  width:100%;height:66px;min-height:66px;display:flex;align-items:center;justify-content:center;
  padding:5px 7px;overflow:hidden;background:#ffffff;border:1px solid rgba(255,255,255,.16);border-radius:9px;
}
.sidebar-brand:hover .sidebar-brand-card{box-shadow:0 4px 12px rgba(0,0,0,.16);}
.sidebar-brand-logo-full{display:block;width:100%;max-width:192px;max-height:56px;height:auto;object-fit:contain;object-position:center;}
.sidebar-brand-logo-icon{display:none;width:40px;height:40px;object-fit:contain;}
#app-shell.sidebar-collapsed .sidebar-brand-logo-full{display:none;}
#app-shell.sidebar-collapsed .sidebar-brand-logo-icon{display:block;}
#app-shell.sidebar-collapsed .sidebar-brand-card{width:48px;height:48px;min-height:48px;margin:0 auto;padding:2px;}
#app-shell.sidebar-collapsed .sidebar-header{padding:9px 6px 8px;}
.sidebar-group-title{padding:14px 14px 6px;font-size:10px;font-weight:800;letter-spacing:.6px;color:#7d8494;text-transform:uppercase;}
#app-shell.sidebar-collapsed .sidebar-group-title{display:none;}
.sidebar-collapse-btn{
  position:absolute;top:29px;right:-13px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  padding:0;border:1px solid var(--card-border);border-radius:50%;background:#ffffff;color:var(--navy);
  box-shadow:0 3px 10px rgba(0,0,0,.16);font-size:18px;line-height:1;cursor:pointer;z-index:20;
}
.sidebar-collapse-btn:hover{background:var(--bg-soft);}
#app-shell.sidebar-collapsed .sidebar-collapse-btn{top:19px;right:-13px;}
.sidebar-nav{flex:1;padding:6px 8px 10px;overflow-y:auto;overflow-x:hidden;}
.sidebar-link{
  display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;border-radius:var(--radius-sm);
  color:#c8cdd6;text-decoration:none;font-size:13.5px;white-space:nowrap;position:relative;
}
.sidebar-link:hover{background:rgba(255,255,255,0.08);color:#fff;}
.sidebar-link.active{background:var(--gold);color:#241d02;font-weight:700;}
.sidebar-icon{width:18px;text-align:center;flex-shrink:0;font-size:15px;}
#app-shell.sidebar-collapsed .sidebar-link{justify-content:center;}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-snapshot-label{font-size:10px;color:#9aa3b2;text-transform:uppercase;letter-spacing:.5px;}
.sidebar-snapshot-date{font-size:13px;color:#f2d78c;font-weight:700;}
.sidebar-snapshot-info.muted{color:#9aa3b2;font-size:11.5px;}

#main-col{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  background:var(--card);border-bottom:1px solid var(--card-border);
  padding:12px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50;
}
.topbar-titles{flex:1;min-width:0;}
.topbar-title{font-size:16px;font-weight:800;color:var(--ink);}
.breadcrumb{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.breadcrumb a{color:var(--ink-soft);text-decoration:none;}
.breadcrumb a:hover{color:var(--navy);text-decoration:underline;}
.topbar-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);background:var(--bg-soft);padding:6px 12px;border-radius:20px;}
.topbar-phase-filter{display:flex;align-items:center;gap:10px;flex-shrink:0;}
/* PERIOD SELECTOR — compact, satu item per bulan. Scope-nya berbeda dari Global Filter. */
.topbar-period-filter{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.topbar-period-label{font-size:12px;font-weight:700;color:#475569;letter-spacing:.2px;white-space:nowrap;}
.topbar-period-select{height:30px;max-width:220px;padding:0 26px 0 9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%2364748b' d='M0 0h10L5 6z'/%3E%3C/svg%3E") no-repeat right 9px center;-webkit-appearance:none;appearance:none;font:inherit;font-size:12.5px;font-weight:600;color:#0f172a;cursor:pointer;text-overflow:ellipsis;}
.topbar-period-select:hover{border-color:#94a3b8;}
.topbar-period-select:focus-visible{outline:2px solid #0ea5e9;outline-offset:1px;}
.topbar-period-select:disabled{opacity:.6;cursor:progress;}
.topbar-phase-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.topbar-phase-label select{min-width:150px;height:32px;padding:4px 8px;font-size:12.5px;}
.topbar-phase-chip{display:flex;align-items:center;gap:6px;background:#fdf3d8;color:#946f00;border:1px solid #ecdca4;border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.topbar-phase-chip button{background:none;border:none;color:#946f00;cursor:pointer;font-size:12px;padding:0;line-height:1;}
.topbar-status-btn{white-space:nowrap;}
.topbar-global-filter-btn{white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
.topbar-global-multi-popover .topbar-global-multi-options{max-height:280px;overflow-y:auto;}
.topbar-global-multi-popover .status-opt-count{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-soft);}
.topbar-global-multi-popover .dt-filter-option{justify-content:space-between;}
.dk-global-filter-label{display:flex;align-items:center;gap:6px;}
.modal-publish-scope .publish-scope-section{border:1px solid var(--card-border);border-radius:10px;padding:10px 12px;margin:4px 0 14px;background:#fff;}
.modal-publish-scope .publish-scope-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.modal-publish-scope .publish-scope-head h3{margin:0;font-size:13px;color:var(--navy);}
.modal-publish-scope .publish-scope-all{margin:0;}
.modal-publish-scope .publish-scope-list{max-height:min(38vh,260px);overflow-y:auto;border-top:1px solid var(--card-border);padding-top:6px;}
.modal-publish-scope .publish-scope-list .dt-filter-option{justify-content:space-between;}
.modal-publish-scope .publish-scope-list .status-opt-count{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-soft);}
.modal-publish-scope .publish-preview-title{margin:0 0 6px;font-size:13px;color:var(--navy);}
.modal-publish-scope .publish-preview-empty{color:#b33327;font-weight:700;}
@media (max-width:700px){.modal-publish-scope .publish-scope-list{max-height:30vh;}}
.topbar-status-popover .status-opt-count{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-soft);}
.topbar-status-popover .dt-filter-option{justify-content:space-between;}
.topbar-vacant-warning{flex-basis:100%;order:99;background:#fdeceb;color:#b33327;border:1px solid #f3c8c4;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:800;margin-top:8px;}
@media (max-width:900px){.topbar-phase-filter{order:3;}.topbar-global-filter-btn{max-width:100%;}.topbar-period-filter{order:2;}.topbar-period-select{max-width:170px;}}
.topbar-status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}

.topbar-data-summary{
  display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:5px 10px;
  border:1px solid var(--card-border);border-radius:999px;background:#fff;color:var(--ink-soft);
  font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.topbar-data-summary:hover,.topbar-data-summary[aria-expanded="true"]{background:var(--bg-soft);color:var(--navy);}
.topbar-data-summary .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.topbar-data-popover{
  position:fixed;width:320px;max-width:calc(100vw - 24px);padding:13px 14px;background:#fff;
  border:1px solid var(--card-border);border-radius:11px;box-shadow:var(--shadow-md);z-index:2600;
  color:var(--ink);font-size:12px;
}
.topbar-data-popover-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:9px;}
.topbar-data-popover-grid{display:grid;grid-template-columns:94px minmax(0,1fr);gap:7px 10px;align-items:start;}
.topbar-data-popover-label{color:var(--ink-faint);font-weight:700;}
.topbar-data-popover-value{min-width:0;word-break:break-word;color:var(--ink);}
.topbar-data-popover-foot{margin-top:10px;padding-top:9px;border-top:1px solid var(--card-border);color:var(--ink-soft);font-size:11px;}
.dashboard-comparison-chip{
  display:inline-flex;align-items:center;gap:7px;margin-right:8px;padding:6px 10px;border:1px solid var(--card-border);
  border-radius:999px;background:#fff;font-size:11.5px;color:var(--ink-soft);vertical-align:middle;
}
.dashboard-comparison-chip strong{color:var(--navy);font-size:13px;}
.delta-indicator{display:block;margin-top:2px;font-size:10px;font-weight:800;line-height:1.1;white-space:nowrap;}
.delta-up{color:#16864b;}.delta-down{color:#c73d37;}.delta-flat{color:#8a909a;}.delta-new{color:#2f7fd1;}.delta-na{color:#9aa0ab;}
.rank-cell-wrap,.score-cell-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;}
.dt-quick-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.dt-quick-filter-btn{
  border:1px solid var(--card-border);background:#fff;color:var(--ink-soft);padding:5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;
}
.dt-quick-filter-btn:hover{border-color:var(--navy);color:var(--navy);}
.dt-quick-filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.dt-quick-filter-btn:disabled{opacity:.45;cursor:not-allowed;}
/* ===== Toolbar Countif / Analisis Nilai ===== */
.dt-ranking-toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap;margin-bottom:10px;}
.dt-ranking-toolbar-row .dt-quick-filters{margin-bottom:0;flex-shrink:1;}
.dt-countif-toolbar{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:nowrap;}
.countif-chip{border:1px solid var(--card-border);background:#fff;color:var(--ink-soft);padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s;}
.countif-chip:hover{border-color:var(--navy);color:var(--navy);}
.countif-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.countif-chip.is-disabled{opacity:.5;cursor:not-allowed;}
.countif-indicator-select{height:32px;padding:3px 6px;font-size:11.5px;border-radius:8px;border:1px solid var(--card-border);background:#fff;color:var(--ink);width:118px;font-family:inherit;}
.countif-threshold-input{height:32px;width:74px;padding:3px 6px;font-size:11.5px;border-radius:8px;border:1px solid var(--card-border);background:#fff;color:var(--ink);text-align:center;font-family:inherit;}
.countif-threshold-input.is-money{width:96px;}
/* ===== Sorting header KPI numerik & tombol Hapus Sort ===== */
.dt-header-sortable{cursor:pointer;display:inline-flex;align-items:center;gap:0;user-select:none;}
.dt-header-sortable:hover .dt-sort-icon,.dt-header-static .dt-sort-icon.is-active{margin-left:var(--dt-header-sort-gap);}
.dt-header-sortable:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px;}
/* Icon sort TIDAK memesan ruang saat tidak aktif, sehingga label & tombol filter benar-benar rapat.
   Lebar kolom sudah fixed (colgroup + table-layout:fixed), jadi memunculkan icon saat hover/aktif
   hanya menata ulang isi TH tersebut — tidak pernah menggeser layout tabel. */
.dt-sort-icon{opacity:0;font-size:9px;line-height:1;width:0;min-width:0;overflow:hidden;text-align:center;transition:opacity .15s;}
.dt-header-sortable:hover .dt-sort-icon{opacity:.55;width:8px;min-width:8px;}
.dt-sort-icon.is-active{opacity:1;width:8px;min-width:8px;color:var(--navy);font-weight:900;}
.dt-clear-sort-btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s;}
.dt-clear-sort-btn:hover{background:var(--bg-soft);}
@media (max-width:1100px){
  .dt-ranking-toolbar-row{flex-wrap:wrap;}
  .dt-countif-toolbar{width:100%;justify-content:flex-end;overflow-x:auto;padding-bottom:2px;}
}
.dt-header-static{display:inline-flex;align-items:center;justify-content:center;gap:0;min-width:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;}
.jpg-delta{display:block;margin-top:2px;font-size:10px;font-weight:800;line-height:1.1;}
.app-root{flex:1;padding:22px 26px 60px;overflow-x:hidden;}

/* ===== Pill Nav (opsional, dipakai untuk tab scope) ===== */
.pillnav{display:flex;gap:6px;flex-wrap:wrap;}
.pill{
  border:1px solid var(--card-border);background:var(--card);color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;
}
.pill:hover{border-color:var(--navy);}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ===== Page Header ===== */
.page-header h1{margin:0 0 4px;font-size:21px;font-weight:800;}
.page-sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}
.dashboard-page-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.dashboard-page-header-actions{flex-shrink:0;}
@media (max-width:640px){.dashboard-page-header{flex-direction:column;}}

/* ===== Dropdown Download JPG Dashboard ===== */
.dashboard-download-wrap{position:relative;display:inline-block;}
.dashboard-download-toggle{white-space:nowrap;}
.dashboard-download-menu{
  position:absolute;top:calc(100% + 6px);right:0;min-width:250px;
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);padding:6px;z-index:200;flex-direction:column;gap:2px;display:none;
}
.dashboard-download-menu.is-open{display:flex;}
.dashboard-download-menu[hidden]{display:none !important;}
.dashboard-download-option{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:9px 12px;border-radius:8px;font-size:13px;color:var(--ink);font-family:inherit;
}
.dashboard-download-option:hover{background:var(--bg-soft);}
.dashboard-download-option:disabled{opacity:.5;cursor:not-allowed;}

/* ===== Panels & Cards ===== */
.panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel-title{font-size:12px;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.big-score{font-size:28px;font-weight:800;color:var(--navy);}

.snapshot-meta-bar{display:flex;flex-wrap:wrap;gap:20px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:13px;box-shadow:var(--shadow);}
.meta-label{display:block;color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
.meta-value{font-weight:700;color:var(--ink);}
.meta-value.ok{color:var(--green);}
.meta-value.warn{color:var(--orange);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.stat-card.static{cursor:default;}
.stat-card.static:hover{transform:none;box-shadow:var(--shadow);}
.stat-icon{font-size:18px;}
.stat-value{font-size:22px;font-weight:800;}
.stat-label{font-size:11.5px;color:var(--ink-soft);}
.stat-card.ok .stat-value{color:var(--green);}
.stat-card.warn .stat-value{color:var(--orange);}

/* ===== Summary Strip (Dashboard) ===== */
.dashboard-summary-strip{
  display:flex;align-items:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:12px 18px;margin-bottom:16px;box-shadow:var(--shadow);gap:4px;
}
.summary-strip-item{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);padding:6px 16px;border-radius:var(--radius-sm);transition:background .15s ease;}
.summary-strip-item:hover{background:var(--bg-soft);}
.summary-strip-icon{font-size:17px;}
.summary-strip-value{font-size:19px;font-weight:800;color:var(--navy);}
.summary-strip-label{font-size:12px;color:var(--ink-soft);}
.summary-strip-divider{width:1px;height:26px;background:var(--card-border);flex-shrink:0;}
@media (max-width:760px){
  .dashboard-summary-strip{justify-content:flex-start;}
  .summary-strip-divider{display:none;}
  .summary-strip-item{padding:6px 10px;}
}

/* ===== Performa Nasional (gabungan Top 3 dgn tab) ===== */
.performa-nasional-panel{margin-bottom:16px;}
.performa-nasional-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.performa-tabs{display:flex;gap:2px;background:var(--bg-soft);padding:4px;border-radius:999px;}
.performa-tab-btn{border:none;background:transparent;padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
.performa-tab-btn.active{background:var(--navy);color:#fff;}
.performa-tab-btn.active.tab-worst{background:var(--red);color:#fff;}
.performa-columns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;min-width:0;align-items:start;overflow-x:visible;}
@media (max-width:1200px){.performa-columns{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:760px){.performa-columns{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.performa-columns{grid-template-columns:minmax(0,1fr);}}
.performa-col{min-width:0;}
.performa-col-title{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:800;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.performa-item{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:6px;
  padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);margin-bottom:5px;min-width:0;
}
.performa-item:hover{filter:brightness(0.97);}
.performa-item-rank{font-weight:800;text-align:center;font-size:12px;}
.performa-item-content{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;}
.performa-item-name{font-size:11.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--ink);}
.performa-item-meta{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;font-weight:500;line-height:1.25;color:var(--ink-soft);}
.performa-item-score{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--bg-soft);color:var(--navy);white-space:nowrap;flex-shrink:0;}
.performa-item.best-1{background:#fdf3d8;}
.performa-item.best-2{background:#f1f1ef;}
.performa-item.best-3{background:#f5e8dc;}
.performa-item.worst{background:#fbe7e6;}
.performa-item.worst .performa-item-score{background:#f6d3d1;color:var(--red);}
@media (max-width:480px){.performa-item-meta{font-size:9.5px;}}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:4px;}
.dash-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.dash-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.dash-grid-1{display:grid;grid-template-columns:1fr;gap:14px;}
@media (max-width:900px){.dash-grid-2,.dash-grid-3{grid-template-columns:1fr;}}

.best-entry{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);}
.best-entry-name{font-weight:700;}
.best-entry-score{color:var(--navy);font-weight:800;font-size:17px;}
.muted{color:var(--ink-soft);font-size:13px;}

.kpi-minirow{font-size:13px;margin-top:6px;}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;margin-right:6px;font-weight:700;}
.tag-good{background:var(--green-bg);color:var(--green);}
.tag-bad{background:var(--red-bg);color:var(--red);}

.cat-dist-list{display:flex;flex-direction:column;gap:8px;}
.cat-dist-row{display:flex;align-items:center;gap:10px;font-size:12px;}
.cat-dist-bar-wrap{flex:1;height:8px;background:var(--bg-soft);border-radius:6px;overflow:hidden;}
.cat-dist-bar{height:100%;border-radius:6px;}
.cat-dist-count{width:26px;text-align:right;font-weight:700;}

.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.top-list a{display:flex;justify-content:space-between;text-decoration:none;color:var(--ink);padding:7px 8px;border-radius:var(--radius-sm);}
.top-list a:hover{background:var(--bg-soft);}
.top-list li{display:flex;}
.top-list-name{flex:1;margin-left:6px;}
.top-list-score{font-weight:800;color:var(--navy);}
.medal{margin-right:2px;}

/* ===== Detail KPI — compact analytics workspace ===== */
.detail-kpi-filter-panel{padding:15px 16px;margin-bottom:14px;}
.detail-kpi-filter-panel .filter-row{margin-bottom:10px;gap:10px 12px;}
.detail-kpi-formula-strip{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;
  padding:9px 11px;border:1px solid #dbe5f1;border-radius:9px;
  background:#f7faff;color:var(--ink-soft);font-size:11.5px;
}
.detail-kpi-formula-strip strong{color:var(--navy);}
.detail-kpi-formula-strip .formula-cell{font-size:11px;}
.detail-kpi-stat-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px;
}
.detail-kpi-stat-card{
  min-height:86px;padding:13px 15px;background:var(--card);border:1px solid var(--card-border);
  border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
}
.detail-kpi-stat-label{font-size:10.5px;line-height:1.2;text-transform:uppercase;letter-spacing:.45px;color:var(--ink-soft);font-weight:800;}
.detail-kpi-stat-value{margin-top:4px;font-size:24px;line-height:1.1;font-weight:850;color:var(--navy);}
.detail-kpi-stat-meta{margin-top:4px;font-size:10.5px;line-height:1.25;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-kpi-main-grid{
  display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:14px;margin-bottom:14px;align-items:stretch;
}
.detail-kpi-main-card{
  height:410px;margin-bottom:0;padding:15px 16px;display:flex;flex-direction:column;min-width:0;overflow:hidden;
}
.detail-kpi-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex-shrink:0;}
.detail-kpi-card-title{font-size:13px;font-weight:850;color:var(--navy);line-height:1.25;}
.detail-kpi-card-subtitle{font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.25;}
.detail-kpi-count-chip{
  flex-shrink:0;padding:4px 9px;border-radius:999px;background:var(--bg-soft);color:var(--ink-soft);
  font-size:10.5px;font-weight:800;white-space:nowrap;
}
.detail-kpi-chart-wrap{position:relative;flex:1;min-height:0;}
.detail-kpi-chart-wrap canvas{width:100% !important;height:100% !important;}
.detail-kpi-table-tools{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-shrink:0;}
.detail-kpi-table-search{height:32px !important;min-width:0 !important;flex:1;padding:6px 9px !important;font-size:11.5px !important;}
.detail-kpi-table-tools .btn{height:32px;padding:6px 9px;font-size:10.5px;white-space:nowrap;}
.detail-kpi-table-scroll{
  flex:1;min-height:0;overflow:auto;border:1px solid var(--card-border);border-radius:9px;background:#fff;
}
.detail-kpi-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;}
.detail-kpi-table thead th{
  position:sticky;top:0;z-index:3;padding:9px 8px;background:var(--bg-soft);color:var(--navy);
  border-bottom:2px solid var(--card-border);text-align:center;text-transform:uppercase;letter-spacing:.3px;font-size:9.8px;font-weight:850;white-space:nowrap;
}
.detail-kpi-table td{padding:8px;border-bottom:1px solid var(--card-border);text-align:center;vertical-align:middle;}
.detail-kpi-table tbody tr:hover td{background:#fafaf7;}
.detail-kpi-table .detail-kpi-entity-cell{min-width:165px;text-align:left;}
.detail-kpi-table .primary-cell{align-items:flex-start;gap:2px;}
.detail-kpi-table .primary-name{text-align:left;font-size:11.5px;line-height:1.2;}
.detail-kpi-table .primary-meta{text-align:left;font-size:9.5px;line-height:1.2;max-width:210px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.detail-kpi-table .badge{font-size:9.5px;padding:3px 7px;}
.detail-kpi-table-empty{padding:24px !important;color:var(--ink-soft);text-align:center !important;}
.detail-kpi-rank-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch;}
.detail-kpi-rank-card{
  height:auto;min-height:0;margin-bottom:0;padding:12px;
  display:flex;flex-direction:column;overflow:visible;
}
.detail-kpi-rank-card.top{border-top:3px solid var(--gold);}
.detail-kpi-rank-card.bottom{border-top:3px solid #d64545;}
.detail-kpi-rank-card .detail-kpi-card-head{margin-bottom:8px;padding:0 2px;}
.detail-kpi-compact-list{
  width:100%;align-self:stretch;box-sizing:border-box;
  display:flex;flex-direction:column;gap:5px;
  height:auto;max-height:none;min-height:0;overflow:visible;padding:0;
}
.detail-kpi-compact-item{
  width:100%;box-sizing:border-box;
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;
  min-height:42px;padding:6px 9px;border:1px solid transparent;border-radius:9px;background:#fafaf8;
}
.detail-kpi-compact-item:hover{border-color:var(--card-border);background:#f7f6f2;}
.detail-kpi-compact-rank{font-size:11px;font-weight:850;text-align:center;color:var(--ink-soft);}
.detail-kpi-compact-content{min-width:0;display:flex;flex-direction:column;gap:1px;}
.detail-kpi-compact-name{font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-kpi-compact-meta{font-size:9.5px;color:var(--ink-soft);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.detail-kpi-compact-score{font-size:10.5px;font-weight:850;color:var(--navy);background:#eef3f9;border-radius:999px;padding:4px 8px;white-space:nowrap;}
.detail-kpi-rank-card.top .detail-kpi-compact-item:nth-child(1){background:#fdf3d8;}
.detail-kpi-rank-card.top .detail-kpi-compact-item:nth-child(2){background:#f1f1ef;}
.detail-kpi-rank-card.top .detail-kpi-compact-item:nth-child(3){background:#f5e8dc;}
.detail-kpi-rank-card.bottom .detail-kpi-compact-item:nth-child(-n+3){background:#f8d7d5;}
.detail-kpi-rank-card.bottom .detail-kpi-compact-score{background:#f6d3d1;color:var(--red);}
.detail-kpi-empty-list{padding:24px;text-align:center;color:var(--ink-soft);font-size:12px;}
@media (max-width:1180px){
  .detail-kpi-main-grid{grid-template-columns:1fr;}
  .detail-kpi-main-card{height:390px;}
}
@media (max-width:900px){
  .detail-kpi-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .detail-kpi-rank-grid{grid-template-columns:1fr;}
  .detail-kpi-rank-card{height:auto;}
}
@media (max-width:560px){
  .detail-kpi-stat-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .detail-kpi-stat-card{min-height:78px;padding:11px;}
  .detail-kpi-stat-value{font-size:20px;}
  .detail-kpi-main-card{height:380px;padding:12px;}
  .detail-kpi-table-tools{flex-wrap:wrap;}
  .detail-kpi-table-search{flex-basis:100%;}
}

/* ===== Badges ===== */
.badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
.badge-muted{background:var(--bg-soft);color:var(--ink-soft);}
.cat-outstanding{background:#fdf3d8;color:#946f00;}
.cat-excellent{background:var(--green-bg);color:var(--green);}
.cat-verygood{background:var(--blue-bg);color:var(--blue);}
.cat-good{background:#e6f7ee;color:#1f9d55;}
.cat-needimprove{background:var(--orange-bg);color:var(--orange);}
.cat-critical{background:var(--red-bg);color:var(--red);}
.cat-perfect{background:var(--green-bg);color:var(--green);}
.cat-great{background:var(--blue-bg);color:var(--blue);}
.cat-bad{background:var(--red-bg);color:var(--red);}

/* ===== Tabs & Filter ===== */
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--card-border);}
.tab-btn{background:none;border:none;color:var(--ink-soft);padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--gold);}
.filter-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;align-items:center;}
.filter-row label{font-size:11.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;font-weight:600;}
select,input[type=text],input[type=date],input[type=number],input[type=search]{
  background:#fff;border:1px solid var(--card-border);color:var(--ink);padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;min-width:160px;
}
select:focus,input:focus{outline:2px solid var(--gold);outline-offset:1px;}

/* ===== Buttons ===== */
.btn{border:none;cursor:pointer;border-radius:var(--radius-sm);font-size:13px;font-weight:700;padding:9px 16px;transition:filter .15s ease,transform .1s ease;}
.btn:hover{filter:brightness(0.97);}
.btn:active{transform:scale(0.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--card-border);color:var(--ink);}
.btn-ghost{background:var(--bg-soft);color:var(--ink);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-xs{padding:4px 8px;font-size:11px;}

/* ===== KPI Info Panel ===== */
.kpi-panel{margin-bottom:16px;}
.kpi-panel-toggle{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);color:var(--navy);padding:12px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:800;font-size:13px;}
.kpi-panel-body{background:var(--card);border:1px solid var(--card-border);border-top:none;padding:16px;border-radius:0 0 var(--radius-sm) var(--radius-sm);}
.kpi-info-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.kpi-info-group-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13px;}
.kpi-info-item{margin-bottom:10px;font-size:12px;}
.kpi-info-item-head{display:flex;justify-content:space-between;}
.kpi-info-weight{color:var(--navy);font-weight:800;}
.kpi-info-formula{color:var(--blue);font-family:monospace;font-size:11px;margin:2px 0;}
.kpi-info-desc{color:var(--ink-soft);}
.kpi-info-cap{margin-top:12px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--card-border);padding-top:10px;}

/* ===== DataTable ===== */
.dt-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.dt-toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.dt-ranking-tat-info{flex:0 0 100%;box-sizing:border-box;text-align:right;font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#0f766e;margin:-4px 0 0;padding:0 2px;}
.dt-pagesize-label{font-size:12px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;}
.dt-search-input{min-width:230px;}
.dt-toolbar select,.dt-toolbar input[type=search],.dt-toolbar .btn{height:36px;box-sizing:border-box;}
.dt-scroll{overflow-x:auto;border:1px solid var(--card-border);border-radius:var(--radius-sm);}
.dt-scroll-sticky{max-height:calc(100vh - 270px);min-height:340px;overflow:auto;}
/* Khusus tabel utama 6 halaman Ranking (Phase/Regional/Cabang/Depo/ASS/Salesman) - TIDAK berlaku pada modal
   drill-down atau tabel lain yang juga memakai .dt-scroll-sticky. Target ~10 baris data pada desktop normal,
   tidak memaksakan tinggi tetap (min-height:0) agar data <10 baris tidak menyisakan ruang kosong besar. */
.dt-ranking-main-scroll{max-height:850px;min-height:0;overflow:auto;}
@media (max-width:768px){.dt-ranking-main-scroll{max-height:75vh;}}
/* Floating sticky header - KHUSUS tabel utama 6 halaman Ranking (mainRankingScroll). Salinan visual header
   2-tingkat yang fixed di bawah topbar saat header asli sudah tergulung ke luar viewport. Tidak memengaruhi
   layout normal (default hidden, tidak menambah ruang), tidak ikut export JPG/CSV (dibangun lewat JS terpisah
   dari engine JPG), berada di bawah topbar (z-index:50) dan modal/popover (z-index:1000/2500). */
.dt-floating-ranking-header{position:fixed;display:none;overflow:hidden;background:#fff;border:1px solid var(--card-border);border-top:none;box-shadow:0 6px 18px rgba(31,41,55,.16);z-index:49;}
.dt-floating-ranking-header.is-visible{display:block;}
.dt-floating-ranking-scroll{width:100%;overflow:hidden;}
.dt-floating-ranking-table{margin:0;border-collapse:collapse;}
.dt-floating-ranking-table thead th{cursor:default;}
.dt-floating-ranking-table thead th.dt-header-sortable,.dt-floating-ranking-table thead th .dt-header-sortable{cursor:pointer;}
.dt-table{width:100%;border-collapse:collapse;font-size:13px;}
.dt-table thead th{position:sticky;top:0;background:var(--bg-soft);color:var(--navy);text-align:center;vertical-align:middle;padding:11px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid var(--card-border);white-space:nowrap;z-index:3;}
.dt-table thead th.ta-right,.dt-table thead th.ta-center{text-align:center !important;}

/* ===== Header dua tingkat untuk seluruh tabel Ranking ===== */
.dt-table.has-grouped-header{border-collapse:separate;border-spacing:0;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th{
  position:sticky;top:0;z-index:7;height:var(--ranking-group-header-height);padding:9px 8px;
  color:#fff;border-right:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.34);
  text-align:center;vertical-align:middle;font-size:10.5px;font-weight:850;text-transform:uppercase;letter-spacing:.35px;
}
.dt-table.has-grouped-header thead tr.dt-subheader-row th{
  position:sticky;top:var(--ranking-group-header-height);z-index:6;height:var(--ranking-subheader-height);padding:7px 5px;
  background:#f6f4ef;color:var(--navy);border-right:1px solid var(--card-border);border-bottom:2px solid var(--card-border);
  text-align:center;vertical-align:middle;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.25px;white-space:nowrap;
}
.dt-ranking-group.dt-grp-process{background:#665A8F !important;}
.dt-ranking-group.dt-grp-productivity{background:#25845a !important;}
.dt-ranking-group.dt-grp-revenue{background:#b78413 !important;}
.dt-ranking-standalone.dt-grp-identity,
.dt-ranking-standalone.dt-grp-result{background:#1f2937 !important;color:#fff !important;}
.dt-table.has-grouped-header thead th.dt-sticky-column{z-index:30 !important;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th.dt-ranking-standalone.dt-sticky-column{
  top:0;z-index:32 !important;height:var(--ranking-header-total-height);min-height:var(--ranking-header-total-height);background:#1f2937 !important;color:#fff !important;
}
.dt-table.has-grouped-header thead tr.dt-subheader-row th.dt-sticky-column{z-index:29 !important;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th.dt-sticky-column:nth-child(2),
.dt-table.has-grouped-header thead tr.dt-subheader-row th.dt-sticky-column:nth-child(2),
.dt-table.has-grouped-header tbody td.dt-sticky-column:nth-child(2){box-shadow:4px 0 6px -6px rgba(31,41,55,.45);}
.dt-table.has-grouped-header{table-layout:fixed;}
.detail-kpi-chart-wrap canvas{cursor:pointer;}
.dt-table.has-grouped-header .dt-ranking-standalone .dt-header-filter-toggle{color:rgba(255,255,255,.76);}
.dt-table.has-grouped-header .dt-ranking-standalone .dt-header-filter-toggle:hover{background:rgba(255,255,255,.14);color:#fff;}
.dt-table.has-grouped-header .dt-ranking-standalone .dt-header-filter-toggle.is-active{background:#e6f0fb;color:#1f2937;}
.dt-table td{padding:9px 12px;border-bottom:1px solid var(--card-border);white-space:nowrap;}
.dt-table.has-grouped-header td{padding:9px 10px;text-align:center;vertical-align:middle;}
.dt-table tbody tr:hover{background:var(--bg-soft);}
.dt-row-clickable{cursor:pointer;}
.dt-row-clickable:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
.dt-row-hint{font-size:11px;color:var(--ink-soft);margin:-4px 0 8px;font-weight:600;}
.ta-right{text-align:right;}
.ta-center{text-align:center;}
.dt-empty{text-align:center;color:var(--ink-soft);padding:24px !important;}
.dt-loading{text-align:center;color:var(--ink-soft);padding:24px !important;}
.dt-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;gap:8px;}
.dt-pagination{display:flex;gap:8px;align-items:center;}
.row-link{color:var(--navy);text-decoration:none;font-weight:700;}
.primary-cell{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:center;}
.primary-name{font-weight:800;color:var(--navy);font-size:13px;line-height:1.2;white-space:normal;word-break:break-word;text-align:center;}
.primary-meta{font-size:10.5px;color:var(--ink-soft);line-height:1.25;white-space:normal;word-break:break-word;text-align:center;}
.primary-status-line{margin-top:2px;font-size:10px;line-height:1.3;text-align:center;}
.primary-status-sub{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;color:var(--ink-soft);font-weight:600;}
/* B: sel identitas compact KHUSUS Ranking Salesman - maksimal dua baris, tidak dipakai ranking lain. */
.ranking-salesman-identity{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;line-height:1.15;padding:2px 0;}
.ranking-salesman-name{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;color:var(--navy);font-size:12.5px;}
.ranking-salesman-meta{display:flex;justify-content:center;align-items:center;gap:5px;white-space:nowrap;font-size:10px;color:var(--ink-soft);font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ranking-salesman-meta.is-vacant{color:var(--red);font-weight:800;}
.row-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.skeleton{background:linear-gradient(90deg,var(--bg-soft) 25%,#f8f7f3 37%,var(--bg-soft) 63%);background-size:400% 100%;animation:skeleton-loading 1.4s ease infinite;border-radius:6px;height:14px;}

/* ===== Header satu baris: area sort + tombol filter (Ranking Salesman) ===== */
/* Label + (sort) + filter diperlakukan sebagai SATU unit inline yang di-center di dalam TH.
   Sengaja TIDAK memakai width:100% + space-between agar icon tidak terlempar ke tepi kolom. */
.dt-header-content{display:inline-flex;align-items:center;justify-content:center;gap:var(--dt-header-gap);width:auto;max-width:100%;white-space:nowrap;vertical-align:middle;}
.dt-header-label{text-align:center;}
.dt-header-filter-toggle{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:20px;min-width:20px;height:20px;padding:0;margin:0;border:none;border-radius:5px;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:11px;}
.dt-header-filter-toggle:hover{background:rgba(31,41,55,0.08);color:var(--navy);}
.dt-header-filter-toggle.is-active{color:#1f2937;background:#e6f0fb;box-shadow:inset 0 0 0 1px #8fb8e3;}
.dt-header-filter-toggle svg{width:12.5px;height:12.5px;display:block;pointer-events:none;}
/* Label multi-baris KHUSUS (saat ini hanya EC VS CALL TOTAL). Label lain tetap satu baris. */
.dt-header-multiline{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.12;text-align:center;font-size:9.5px;letter-spacing:.15px;}
.dt-header-multiline > span{white-space:nowrap;display:block;}

/* ===== Popover Filter (append ke body, tidak terpotong overflow tabel) ===== */
.dt-filter-popover{position:fixed;width:260px;max-height:360px;display:flex;flex-direction:column;background:#ffffff;border:1px solid var(--card-border);border-radius:10px;box-shadow:var(--shadow-md);padding:10px;z-index:2500;color:var(--ink);text-align:left;}
.dt-filter-popover-title{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:8px;text-align:left;}
.dt-filter-search{width:100%;height:34px;min-width:0;padding:6px 9px;border:1px solid var(--card-border);border-radius:7px;font-size:12px;}
.dt-filter-options{flex:1;overflow-y:auto;max-height:220px;margin-top:8px;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border);padding:5px 0;}
.dt-filter-option{display:flex;align-items:center;gap:7px;padding:6px 4px;font-size:12px;cursor:pointer;}
.dt-filter-option:hover{background:var(--bg-soft);}
.dt-filter-option input{min-width:auto;}
.dt-filter-actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px;}
.dt-filter-tabs{display:flex;gap:4px;padding:3px;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;margin-bottom:8px;}
.dt-filter-tab{flex:1;border:none;background:transparent;color:var(--ink-soft);padding:6px 8px;border-radius:6px;font:inherit;font-size:11px;font-weight:800;cursor:pointer;}
.dt-filter-tab.active{background:var(--navy);color:#fff;}
.dt-filter-range-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;}
.dt-filter-range-row input{width:100%;min-width:0;max-width:100%;box-sizing:border-box;padding:7px 8px;font-size:11px;}
@media (max-width:340px){.dt-filter-range-row{grid-template-columns:1fr;}}
.dt-filter-apply,.dt-filter-reset{flex:1;}
.dt-column-toggle-wrap{position:relative;display:inline-block;}
.dt-column-toggle-menu{
  position:absolute;top:calc(100% + 6px);left:0;width:260px;max-height:340px;display:none;flex-direction:column;
  background:#ffffff;border:1px solid var(--card-border);border-radius:10px;box-shadow:var(--shadow-md);padding:10px;z-index:400;color:var(--ink);text-align:left;
}
.dt-column-toggle-menu.is-open{display:flex;}
.dt-column-toggle-menu[hidden]{display:none !important;}

/* ---- Sticky Rank & Nama Utama (reusable via config kolom sticky/stickyLeft/width) ---- */
.dt-table td.dt-sticky-column,.dt-table th.dt-sticky-column{position:sticky;background:#ffffff;z-index:2;white-space:normal;word-break:break-word;line-height:1.3;}
.dt-table thead th.dt-sticky-column{z-index:6;background:var(--bg-soft);}
.dt-table tbody tr:hover td.dt-sticky-column{background:var(--bg-soft);}


/* ===== Perbaikan sticky seluruh tabel ranking =====
   Hanya Rank + Nama Entitas yang sticky. Seluruh kolom identitas lain bergerak normal.
   Isolation + z-index mencegah header grup KPI menimpa kolom sticky saat horizontal scroll. */
.dt-scroll{position:relative;isolation:isolate;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th.dt-ranking-group{z-index:12 !important;}
.dt-table.has-grouped-header thead tr.dt-subheader-row th{z-index:11 !important;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th.dt-ranking-standalone:not(.dt-sticky-column){z-index:13 !important;}
.dt-table.has-grouped-header thead tr.dt-group-header-row th.dt-ranking-standalone.dt-sticky-column{
  z-index:80 !important;background:#1f2937 !important;background-clip:padding-box;
}
.dt-table.has-grouped-header tbody td.dt-sticky-column{
  z-index:20 !important;background-clip:padding-box;overflow:hidden;
}
.dt-table.has-grouped-header thead th.dt-sticky-column{overflow:hidden;background-clip:padding-box;}
.dt-table.has-grouped-header tbody td:not(.dt-sticky-column){overflow:hidden;text-overflow:ellipsis;}
.dt-table.has-grouped-header thead th:not(.dt-sticky-column){overflow:hidden;text-overflow:ellipsis;}
.dt-table.has-grouped-header tbody td[title]{cursor:help;}

/* ===== Modal drill-down Phase → Regional → Depo → ASS → Salesman ===== */
.modal-box.modal-ranking-drilldown{
  width:calc(100vw - 42px);max-width:1760px;padding:20px 20px 18px;
}
.drilldown-shell{min-width:0;}
.drilldown-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-right:34px;margin-bottom:10px;}
.drilldown-title{margin:0;color:var(--navy);font-size:19px;font-weight:850;}
.drilldown-subtitle{margin-top:4px;color:var(--ink-soft);font-size:11.5px;}
.drilldown-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
.drilldown-back{height:31px;}
.drilldown-breadcrumbs{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0;}
.drilldown-crumb{border:none;background:transparent;padding:4px 5px;color:var(--navy);font:inherit;font-size:11.5px;font-weight:750;cursor:pointer;border-radius:5px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.drilldown-crumb:hover{background:var(--bg-soft);}
.drilldown-crumb.current{color:var(--ink);cursor:default;background:#f6f4ef;}
.drilldown-separator{color:var(--ink-faint);font-size:11px;}
.modal-ranking-drilldown .dt-scroll{max-height:58vh;overflow:auto;}
.modal-ranking-drilldown .dt-toolbar{margin-top:2px;}
.modal-ranking-drilldown .panel{padding:0;border:none;box-shadow:none;background:transparent;}
@media (max-width:700px){
  .modal-box.modal-ranking-drilldown{width:calc(100vw - 16px);padding:14px 12px;}
  .drilldown-head{padding-right:28px;}
  .drilldown-title{font-size:16px;}
}

/* ---- Highlight Top 3 baris tabel ranking ---- */
.dt-table tbody tr.rank-row-1 td{background:#fdf3d8;}
.dt-table tbody tr.rank-row-2 td{background:#f1f1ef;}
.dt-table tbody tr.rank-row-3 td{background:#f5e8dc;}
.dt-table tbody tr.rank-row-1 td:first-child{box-shadow:inset 3px 0 0 var(--gold);}
.dt-table tbody tr.rank-row-2 td:first-child{box-shadow:inset 3px 0 0 #9aa0ab;}
.dt-table tbody tr.rank-row-3 td:first-child{box-shadow:inset 3px 0 0 #b8865a;}
.dt-table tbody tr.rank-row-1:hover td{background:#fbead0;}
.dt-table tbody tr.rank-row-2:hover td{background:#eaeae7;}
.dt-table tbody tr.rank-row-3:hover td{background:#f0ddcc;}
/* ---- Highlight Critical & Bottom 3 pada tabel ranking ---- */
.dt-table tbody tr.rank-row-critical td{background:#fff2f1 !important;}
.dt-table tbody tr.rank-row-critical td.dt-sticky-column{background:#fff2f1 !important;}
.dt-table tbody tr.rank-row-critical td:first-child{box-shadow:inset 3px 0 0 rgba(214,69,69,.45) !important;}
.dt-table tbody tr.rank-row-critical:hover td,
.dt-table tbody tr.rank-row-critical:hover td.dt-sticky-column{background:#fbe4e2 !important;}
.dt-table tbody tr.rank-row-bottom3 td{background:#f8d7d5 !important;}
.dt-table tbody tr.rank-row-bottom3 td.dt-sticky-column{background:#f8d7d5 !important;}
.dt-table tbody tr.rank-row-bottom3 td:first-child{box-shadow:inset 4px 0 0 #d64545 !important;}
.dt-table tbody tr.rank-row-bottom3:hover td,
.dt-table tbody tr.rank-row-bottom3:hover td.dt-sticky-column{background:#f3c5c2 !important;}
.dt-table tbody tr.rank-row-1 td.dt-sticky-column{background:#fdf3d8;}
.dt-table tbody tr.rank-row-2 td.dt-sticky-column{background:#f1f1ef;}
.dt-table tbody tr.rank-row-3 td.dt-sticky-column{background:#f5e8dc;}
.dt-table tbody tr.rank-row-1:hover td.dt-sticky-column{background:#fbead0;}
.dt-table tbody tr.rank-row-2:hover td.dt-sticky-column{background:#eaeae7;}
.dt-table tbody tr.rank-row-3:hover td.dt-sticky-column{background:#f0ddcc;}
@keyframes skeleton-loading{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ===== Empty / Fatal / Loading ===== */
.empty-state,.fatal-error,.loading-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state-icon{font-size:44px;margin-bottom:12px;}
.empty-state h2{color:var(--ink);}
.fatal-error h2{color:var(--red);}
.loading-overlay{position:fixed;inset:0;background:rgba(246,244,239,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3000;gap:12px;}
.loading-spinner{width:40px;height:40px;border:4px solid var(--card-border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-overlay-text{font-size:13px;color:var(--ink-soft);font-weight:700;}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(28,31,38,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:1000;overflow-y:auto;animation:fade-in .18s ease;}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
.modal-box{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;max-width:560px;width:100%;position:relative;box-shadow:var(--shadow-md);animation:modal-pop .18s ease;}
@keyframes modal-pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.modal-box.modal-wide{max-width:820px;}
.modal-box.modal-regional-performance{width:calc(100vw - 50px);max-width:1700px;padding:22px;}
@media (max-width:640px){.modal-box.modal-regional-performance{width:calc(100vw - 20px);padding:14px;}}
.modal-box.modal-kpi-bucket{width:min(1080px,calc(100vw - 40px));max-width:1080px;padding:20px;}
.kpi-bucket-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.kpi-bucket-title{font-size:18px;font-weight:850;color:var(--navy);margin:0;}
.kpi-bucket-subtitle{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.kpi-bucket-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.kpi-bucket-search{height:34px !important;min-width:230px !important;font-size:12px !important;}
.kpi-bucket-table-wrap{max-height:58vh;overflow:auto;border:1px solid var(--card-border);border-radius:10px;background:#fff;}
.kpi-bucket-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
.kpi-bucket-table thead th{position:sticky;top:0;z-index:2;background:#f6f4ef;color:var(--navy);padding:10px 9px;border-bottom:2px solid var(--card-border);text-transform:uppercase;font-size:10px;letter-spacing:.25px;text-align:center;white-space:nowrap;}
.kpi-bucket-table td{padding:9px;border-bottom:1px solid var(--card-border);text-align:center;vertical-align:middle;}
.kpi-bucket-table td.kpi-bucket-name{text-align:left;min-width:230px;}
.kpi-bucket-table tbody tr:hover td{background:#fafaf7;}
.kpi-bucket-table tbody tr.kpi-bucket-row-clickable{cursor:pointer;}
.kpi-bucket-table tbody tr.kpi-bucket-row-clickable:hover td{background:#eef3fb;}
.kpi-bucket-table tbody tr.kpi-bucket-row-clickable:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
.kpi-bucket-table thead th{position:sticky;top:0;background:var(--bg-soft);z-index:2;padding:8px 10px;text-align:center;font-size:11px;font-weight:800;color:var(--ink-soft);border-bottom:1px solid var(--card-border);white-space:nowrap;}
.kpi-bucket-table thead th.kpi-bucket-sortable{cursor:pointer;user-select:none;}
.kpi-bucket-table thead th.kpi-bucket-sortable:hover{color:var(--navy);}
.kpi-bucket-table thead th.kpi-bucket-sortable .dt-sort-icon{opacity:.55;}
.kpi-bucket-table thead th.kpi-bucket-sortable .dt-sort-icon.is-active{opacity:1;color:var(--navy);}
.kpi-bucket-table tbody td{padding:8px 10px;border-bottom:1px solid var(--card-border);text-align:center;}
.kpi-bucket-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.kpi-bucket-filter-select{height:34px;font-size:11.5px;border-radius:8px;border:1px solid var(--card-border);background:#fff;color:var(--ink);padding:3px 8px;font-family:inherit;}
.kpi-bucket-drill .kpi-bucket-actions{flex-wrap:wrap;}
@media (max-width:640px){.modal-box.modal-kpi-bucket{width:calc(100vw - 20px);padding:14px;}.kpi-bucket-search{min-width:100% !important;}}

/* ===== Modal Pencapaian Depo (klik baris Ranking Regional) ===== */
.regional-performance-modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
.regional-performance-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}

.regional-performance-summary{display:flex;align-items:stretch;flex-wrap:wrap;gap:0;margin:14px 0 18px;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:var(--radius-sm);overflow:hidden;}
.regional-performance-summary-item{flex:1;min-width:135px;text-align:center;padding:11px 14px;border-right:1px solid var(--card-border);}
.regional-performance-summary-item:last-child{border-right:none;}
.regional-performance-summary-value{display:block;font-size:17px;font-weight:800;color:var(--navy);}
.regional-performance-summary-label{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;}

.regional-depo-performance-wrap{width:100%;overflow-x:auto;margin-top:18px;border:1px solid var(--card-border);border-radius:var(--radius-sm);max-height:62vh;overflow-y:auto;}
.regional-depo-performance-table{width:100%;min-width:2100px;border-collapse:separate;border-spacing:0;font-size:12px;}
.regional-depo-performance-table td{text-align:center;padding:9px 11px;border-right:1px solid var(--card-border);border-bottom:1px solid var(--card-border);white-space:nowrap;background:#ffffff;}
.regional-depo-performance-table tbody tr:nth-child(even) td{background:#fafaf8;}

/* Header dua tingkat (kelompok KPI + kolom detail) — dipakai bersama oleh tampilan web & JPG */
.regional-depo-group-header th{text-align:center;padding:10px 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-right:1px solid rgba(255,255,255,.35);white-space:nowrap;}
.regional-depo-column-header th{text-align:center;padding:10px 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
/* Susunan z-index (dari atas ke bawah): grup Identitas=12, kolom Identitas=11, grup lain=6, kolom lain=5, body sticky=3, body biasa=auto */
.regional-depo-performance-table .regional-depo-group-header th{position:sticky;top:0;z-index:6;}
.regional-depo-performance-table .regional-depo-column-header th{position:sticky;top:38px;z-index:5;background:var(--bg-soft);color:var(--navy);border-bottom:2px solid var(--card-border);}
.regional-depo-performance-table .rdp-sticky-group{z-index:14 !important;background:#4b5563 !important;}
.regional-depo-performance-table thead .rdp-sticky-col{z-index:13 !important;}
.regional-depo-performance-table tbody .rdp-sticky-col{z-index:4 !important;}
.rdp-grp-identity{background:#4b5563;color:#ffffff;}
.rdp-grp-process{background:#665A8F;color:#ffffff;}
.rdp-grp-productivity{background:#25845a;color:#ffffff;}
.rdp-grp-revenue{background:#b78413;color:#ffffff;}
.rdp-grp-result{background:#1f2937;color:#ffffff;}

/* Sticky HORIZONTAL header kelompok "Identitas Depo" (menutupi Nama/Kode Depo/Total Salesman saat digeser) */
.regional-depo-performance-table .regional-depo-group-header th.rdp-sticky-group{
  position:sticky;left:0;top:0;z-index:12;width:430px;min-width:430px;max-width:430px;
  background:#4b5563;color:#ffffff;
  box-shadow:2px 0 0 var(--card-border),8px 0 12px rgba(31,41,55,0.10);
}

/* Sticky 3 kolom Identitas Depo saat scroll horizontal (web saja, tidak dibutuhkan di JPG) */
.regional-depo-performance-table td.rdp-sticky-col,
.regional-depo-performance-table th.rdp-sticky-col{position:sticky;background:#ffffff;z-index:3;white-space:normal;word-break:break-word;line-height:1.3;}
.regional-depo-performance-table thead th.rdp-sticky-col{z-index:11;background:var(--bg-soft);}
.regional-depo-performance-table tbody tr:nth-child(even) td.rdp-sticky-col{background:#fafaf8;}
.regional-depo-performance-table .rdp-sticky-end{box-shadow:2px 0 0 var(--card-border),8px 0 12px rgba(31,41,55,0.08);}

/* ===== Laporan JPG Pencapaian Depo (class terisolasi, tanpa sticky) ===== */
.regional-depo-jpg-container{position:fixed;left:-100000px;top:0;background:#ffffff;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Inter',Roboto,Arial,sans-serif;padding:44px;box-sizing:border-box;color:#1c1f26;}
.regional-depo-jpg-table{width:100%;border-collapse:collapse;font-size:14px;}
.regional-depo-jpg-table th,.regional-depo-jpg-table td{border:1px solid #d9d9d5;padding:9px 10px;text-align:center;background:#ffffff;}
.regional-depo-jpg-table tbody tr:nth-child(even) td{background:#fafaf8;}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--ink-soft);font-size:22px;cursor:pointer;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
.modal-confirm p{margin-top:0;white-space:pre-line;}

/* ===== Trend Performance (read-only official period history) ===== */
.ranking-trend-btn{width:32px;height:30px;padding:0;border:1px solid var(--card-border);border-radius:8px;background:#fff;cursor:pointer;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s ease,background .15s ease,transform .15s ease;}
.ranking-trend-btn:hover{background:var(--bg-soft);border-color:var(--gold);transform:translateY(-1px);}
.ranking-trend-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.modal-box.modal-trend-performance{max-width:760px;padding:22px;}
.trend-head{padding-right:34px;margin-bottom:14px;}
.trend-head h2{margin:0;color:var(--navy);font-size:18px;}
.trend-head-sub{margin-top:4px;color:var(--ink-soft);font-size:12px;}
.trend-source{display:inline-flex;margin-top:7px;padding:4px 8px;border-radius:999px;background:#eef3fb;color:var(--navy);font-size:10.5px;font-weight:800;}
.trend-control{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.trend-control label{font-size:12px;font-weight:800;color:var(--ink-soft);}
.trend-control select{min-width:210px;height:36px;}
.trend-chart-wrap{height:280px;border:1px solid var(--card-border);border-radius:10px;background:#fff;padding:12px;margin-bottom:12px;}
.trend-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.trend-summary-card{border:1px solid var(--card-border);border-radius:9px;background:var(--bg-soft);padding:10px;min-height:66px;}
.trend-summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.35px;color:var(--ink-soft);font-weight:800;}
.trend-summary-value{margin-top:5px;color:var(--navy);font-size:14px;font-weight:900;overflow-wrap:anywhere;}
.trend-empty,.trend-error{padding:34px 14px;text-align:center;border:1px dashed var(--card-border);border-radius:10px;color:var(--ink-soft);font-size:13px;}
.trend-error{color:var(--red);background:#fff7f7;}
.trend-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:42px 12px;color:var(--ink-soft);font-size:13px;}
.trend-loading .loading-spinner{width:26px;height:26px;border-width:3px;}
@media (max-width:640px){.modal-box.modal-trend-performance{padding:16px}.trend-control{align-items:flex-start;flex-direction:column}.trend-control select{width:100%;min-width:0}.trend-chart-wrap{height:240px;padding:8px}.trend-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ===== Simulasi Ranking (client-side, tidak mengubah ranking resmi) ===== */
.simulation-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 15px;margin-bottom:14px;border:1px solid #d8c36e;border-radius:11px;background:#fff9df;color:#5f4a00;}
.simulation-banner strong{font-size:13px;letter-spacing:.2px;}.simulation-banner span{font-size:11.5px;font-weight:700;}
.simulation-layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:14px;align-items:start;}
.simulation-config-panel{position:sticky;top:74px;}.simulation-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.simulation-panel-head h2{margin:0;color:var(--navy);font-size:15px;}.simulation-panel-head p{margin:3px 0 0;color:var(--ink-soft);font-size:11px;}
.simulation-context{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px;}
.simulation-context-item{min-width:0;padding:8px 9px;border:1px solid var(--card-border);border-radius:8px;background:var(--bg-soft);}
.simulation-context-label{display:block;color:var(--ink-faint);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
.simulation-context-value{display:block;margin-top:3px;color:var(--ink);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.simulation-level-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border);margin-bottom:11px;}
.simulation-level-row label{font-size:11px;font-weight:800;color:var(--ink-soft);}.simulation-level-row select{height:34px;min-width:150px;font-size:12px;}
.simulation-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.simulation-kpi-item{display:grid;grid-template-columns:18px minmax(0,1fr) 68px;align-items:center;gap:6px;padding:8px;border:1px solid var(--card-border);border-radius:9px;background:#fff;}
.simulation-kpi-item.is-excluded{background:var(--bg-soft);opacity:.72;}.simulation-kpi-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;}
.simulation-kpi-name{min-width:0;font-size:10.5px;font-weight:800;color:var(--navy);line-height:1.2;}.simulation-weight-wrap{display:flex;align-items:center;gap:3px;}
.simulation-weight-input{width:51px!important;height:30px!important;padding:4px 5px!important;text-align:right;font-size:11px!important;}.simulation-weight-wrap span{font-size:10px;color:var(--ink-soft);font-weight:800;}
.simulation-total{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding:9px 10px;border-radius:9px;background:var(--green-bg);color:var(--green);font-size:12px;font-weight:900;}
.simulation-total.invalid{background:var(--red-bg);color:var(--red);}.simulation-validation-message{min-height:17px;margin-top:5px;color:var(--ink-soft);font-size:10.5px;font-weight:700;}.simulation-validation-message.invalid{color:var(--red);}
.simulation-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:10px;}.simulation-results-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.simulation-results-head h2{margin:0;color:var(--navy);font-size:15px;}.simulation-results-meta{margin-top:3px;color:var(--ink-soft);font-size:11px;}.simulation-applied-chip{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef3fb;color:var(--navy);font-size:10px;font-weight:800;}
.simulation-table-wrap{width:100%;overflow:auto;border:1px solid var(--card-border);border-radius:10px;max-height:68vh;}.simulation-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;white-space:nowrap;}
.simulation-table th{position:sticky;top:0;z-index:2;padding:9px 8px;background:var(--navy);color:#fff;text-align:center;font-size:9.5px;text-transform:uppercase;letter-spacing:.2px;}
.simulation-table td{padding:8px;border-bottom:1px solid var(--card-border);text-align:center;background:#fff;}.simulation-table tbody tr:nth-child(even) td{background:#fafaf8;}.simulation-table tbody tr:hover td{background:#fff9e8;}
.simulation-table .simulation-name-cell{text-align:left;min-width:170px;white-space:normal;font-weight:800;color:var(--navy);}.simulation-rank-up{color:var(--green);font-weight:900;}.simulation-rank-down{color:var(--red);font-weight:900;}.simulation-rank-flat{color:var(--ink-faint);font-weight:900;}.simulation-score{font-weight:900;color:var(--navy);}
.simulation-empty{padding:44px 15px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed var(--card-border);border-radius:10px;background:var(--bg-soft);}
@media (max-width:1050px){.simulation-layout{grid-template-columns:1fr}.simulation-config-panel{position:static}.simulation-kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (max-width:720px){.simulation-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.simulation-context{grid-template-columns:1fr}.simulation-level-row{align-items:flex-start;flex-direction:column}.simulation-level-row select{width:100%}}
@media (max-width:460px){.simulation-kpi-grid{grid-template-columns:1fr}.simulation-actions .btn{flex:1}}

/* ===== Drawer (side panel detail salesman) ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(28,31,38,0.4);z-index:1000;animation:fade-in .18s ease;}
.drawer-box{
  position:fixed;top:0;right:0;height:100vh;width:480px;max-width:92vw;background:var(--card);
  box-shadow:-8px 0 30px rgba(0,0,0,0.15);z-index:1001;overflow-y:auto;padding:24px;
  animation:drawer-slide .22s ease;
}
@keyframes drawer-slide{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.drawer-close{position:absolute;top:16px;right:16px;background:var(--bg-soft);border:none;color:var(--ink-soft);font-size:18px;cursor:pointer;width:30px;height:30px;border-radius:8px;}

.detail-header h2{margin:0 0 4px;font-size:18px;}
.detail-code{color:var(--ink-soft);font-weight:400;font-size:13px;}
.detail-sub{color:var(--ink-soft);font-size:12px;margin-bottom:8px;}
.detail-finalscore{font-size:14px;margin-bottom:14px;}
.detail-group{margin-bottom:16px;}
.detail-group h3{font-size:13px;color:var(--navy);margin-bottom:6px;}
.group-score{color:var(--ink-soft);font-weight:400;font-size:12px;}
.detail-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;}
.detail-table th{text-align:center;vertical-align:middle;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--card-border);font-weight:700;}
.detail-table td{padding:6px 8px;border-bottom:1px solid var(--card-border);}
.detail-support-info{font-size:12px;color:var(--ink-soft);}
.detail-summary{font-size:13px;border-top:1px solid var(--card-border);padding-top:12px;display:flex;flex-direction:column;gap:6px;}
.detail-conclusion{color:var(--ink-soft);}

/* ===== Upload ===== */
.dropzone{border:2px dashed var(--card-border);border-radius:var(--radius);padding:40px 20px;text-align:center;margin-bottom:16px;transition:border-color .15s ease,background .15s ease;background:var(--bg-soft);}
.upload-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
.summary-box{background:var(--bg-soft);border:1px solid var(--card-border);border-radius:10px;padding:12px 10px;text-align:center;}
.summary-box-value{font-size:20px;font-weight:900;color:var(--navy);}
.summary-box-label{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.2px;}
.dropzone.drag-over{border-color:var(--gold);background:#fbf3da;}
.dropzone-icon{font-size:32px;margin-bottom:8px;}
.dropzone-hint{font-size:12px;color:var(--ink-soft);}
.upload-form-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
.upload-period-hint{margin:-4px 0 12px;font-size:12.5px;font-weight:600;color:#0f766e;}
.upload-period-hint.warn{color:#b45309;}
.upload-form-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.upload-preview h3{font-size:14px;color:var(--navy);margin:18px 0 10px;}
.validation-summary{display:flex;flex-direction:column;gap:8px;}
.v-item{padding:8px 12px;border-radius:var(--radius-sm);background:var(--bg-soft);font-size:12px;}
.v-item.ok{border-left:3px solid var(--green);}
.v-item.warn{border-left:3px solid var(--orange);}
.v-item.info{border-left:3px solid var(--blue);}
.v-detail{color:var(--ink-soft);margin-top:4px;}
.upload-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.alert{padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}
.alert-error{background:var(--red-bg);border:1px solid #f2c6c3;color:var(--red);}
.alert-warn{background:var(--orange-bg);border:1px solid #f0d9ae;color:var(--orange);}
.alert-info{background:var(--blue-bg);border:1px solid #c7defa;color:var(--blue);}
.dt-table-sm td,.dt-table-sm th{padding:6px 8px;font-size:11px;}
.upload-progress-wrap{background:var(--bg-soft);border-radius:20px;height:8px;overflow:hidden;margin:10px 0;}
.upload-progress-bar{height:100%;background:var(--gold);width:0%;transition:width .2s ease;}

/* ===== Settings ===== */
.settings-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;}
.settings-table th{text-align:center;vertical-align:middle;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--card-border);font-size:10.5px;text-transform:uppercase;}
.settings-table td{padding:8px 10px;border-bottom:1px solid var(--card-border);}
.formula-cell{font-family:monospace;font-size:11px;color:var(--blue);}
.weight-input{width:80px;}
.weight-total-row{font-size:14px;font-weight:800;margin-bottom:16px;}
.settings-extra-row{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
.settings-extra-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:600;}
.settings-actions{display:flex;gap:10px;}
.settings-note{font-size:12px;color:var(--ink-soft);margin-top:12px;}
.weight-diff-preview{background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px;font-size:12px;margin-bottom:14px;}

/* ===== Toast ===== */
#toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);font-size:13px;opacity:0;transform:translateY(10px);transition:all .3s ease;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast-success{background:#16693c;}
.toast-error{background:#a23a34;}
.toast-info{background:#1d5fa8;}

/* ===== Responsive ===== */
@media (max-width:900px){
  #sidebar{position:fixed;z-index:500;height:100%;}
  .app-root{padding:16px;}
  .dash-grid-2,.dash-grid-3{grid-template-columns:1fr;}
  .drawer-box{width:100%;}
}

/* =====================================================
   DETAIL KPI V2 — Ringkasan KPI + Peringkat & Detail
   ===================================================== */

<script>
/* ============================================================
   APPLICATION CONFIGURATION
   ============================================================ */
const PERF_DEBUG = false; // P: mode debug performa ringan, default OFF, tidak ada UI untuk pengguna
function perfLog(label, startTime, extra) {
  if (!PERF_DEBUG) return;
  const ms = (performance.now() - startTime).toFixed(1);
  const extraText = extra ? ` | ${extra}` : '';
  console.log(`[PERF] ${label}: ${ms} ms${extraText}`);
}
const APP_CONFIG = {
  SHEET_NAME: 'Detail persalesman',
  SHEET_NAME_FALLBACK_KEYWORDS: ['detail', 'persalesman', 'salesman'],
  HEADER_MARKER_TEXT: 'KODE SALESMAN',
  DB_NAME: 'RankingKPI_DB',
  DB_VERSION: 4,
  STORE_SNAPSHOTS: 'snapshots',
  STORE_VACANT: 'vacantSalesmen',
  STORE_MASTER_CABANG: 'masterCabang',
  STORE_VIEWER_CACHE: 'viewerCache',
  CURRENT_DATA_SCHEMA_VERSION: 4,
  // EC vs Call Total memakai TOTAL CALL ESUITE sebagai denominator resmi.
  // TOTAL CALL/DAY tetap diparse sebagai support field, tetapi TIDAK dipakai untuk KPI/scoring/eligibility.
  CURRENT_HIT_RATE_SOURCE: 'totalCallEsuite',
  CURRENT_HIT_RATE_FORMULA_VERSION: 'avgEc_div_totalCallEsuite_v1',
  CURRENT_TAT_SOURCE: 'tatMtd',
  CURRENT_TAT_FORMULA_VERSION: 'achievement_div_tat_v1',
  STORE_SETTINGS: 'settings',
  DEFAULT_AVG_EC_TARGET: 25,
  DEFAULT_SCORE_CAP: 120,

  // Pemetaan field: dua lapisan (nama header dinormalisasi -> fallback posisi kolom 0-based, A=0)
  FIELD_MAP: [
    { key: 'region', aliases: ['REGION'], fallbackCol: 2, type: 'text', group: 'identity' },
    { key: 'phaseProject', aliases: ['PHASE PROJECT'], fallbackCol: 3, type: 'text', group: 'identity' },
    { key: 'kodeDepo', aliases: ['KODE DEPO'], fallbackCol: 4, type: 'text', group: 'identity' },
    { key: 'depo', aliases: ['DEPO'], fallbackCol: 5, type: 'text', group: 'identity' },
    { key: 'nikAss', aliases: ['NIK ASS'], fallbackCol: 6, type: 'text', group: 'identity' },
    { key: 'namaAss', aliases: ['NAMA ASS'], fallbackCol: 7, type: 'text', group: 'identity' },
    { key: 'paretoRetailMix', aliases: ['PARETO / RETAIL / MIX', 'PARETO/RETAIL/MIX'], type: 'text', group: 'identity' },
    { key: 'kodeSalesman', aliases: ['KODE SALESMAN'], fallbackCol: 9, type: 'text', group: 'identity' },
    { key: 'namaSalesman', aliases: ['NAMA SALESMAN'], fallbackCol: 10, type: 'text', group: 'identity' },
    // Kolom baru: status Salesman aktif (MATCH / nama pengganti / VACANT). Kolom ini bisa ada di posisi mana pun
    // pada file terbaru, sehingga TIDAK memakai fallback posisi (fallbackCol) sama sekali — jika nama header tidak
    // ditemukan, dianggap tidak tersedia (bukan salah baca kolom lain).
    { key: 'keterangan', aliases: ['KETERANGAN', 'STATUS SALESMAN', 'STATUS'], type: 'text', group: 'identity' },

    { key: 'cb', aliases: ['CB'], fallbackCol: 11, type: 'number', group: 'kpi' },
    { key: 'cbEsuite', aliases: ['CB ESUITE'], fallbackCol: 12, type: 'number', group: 'support' },
    { key: 'roa', aliases: ['ROA'], fallbackCol: 13, type: 'number', group: 'kpi' },

function debounce(fn, delay) {
  let t = null;
  const debounced = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  debounced.cancel = () => { clearTimeout(t); t = null; };
  return debounced;
}
function num(v) { return (v === null || v === undefined || isNaN(v)) ? 0 : v; }
function getPath(obj, path) { return path.split('.').reduce((o, k) => (o === null || o === undefined ? undefined : o[k]), obj); }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Fingerprint Global Filter: nilai di-SORT agar deterministik (Set iteration order tidak dipakai apa adanya).
function globalScopeFingerprint() {
  const phasePart = Array.from(State.activePhaseFilters || []).map(String).sort().join('|');
  const regionPart = Array.from(State.activeRegionFilters || []).map(String).sort().join('|');
  return `ph:${phasePart}~rg:${regionPart}`;
}
function settingsFingerprint(settings) {
  const snapshot = State.activeSnapshot;
  const tatPart = snapshot ? `${snapshot.tatMtd ?? ''}|${snapshot.tatFormulaVersion || ''}` : '';
  return JSON.stringify(settings.weights) + '|' + settings.scoreCap + '|' + settings.avgEcTarget + '|tat:' + tatPart + '|' + globalScopeFingerprint();
}
// O: fingerprint KHUSUS untuk cache hierarchy (Detail KPI scoped & Ranking Phase). Mencakup seluruh input yang
// benar-benar memengaruhi hasil agregasi: settings KPI, Status Salesman aktif, Phase, Master Cabang, VACANT,
// snapshot id/revision. TIDAK mencakup state UI (search, pagination, tab aktif, dropdown JPG) - perubahan itu
// harus tetap memakai cache yang sama (cache hit), bukan membangun ulang hierarchy.
function hierarchyCacheFingerprint() {
  const snap = State.activeSnapshot;
  const snapPart = snap ? `${snap.id}|${snap.revisionNumber || 1}` : 'none';
  const statusPart = Array.from(getActiveStatusSalesmanFilter()).sort().join(',');
  return `${snapPart}|${globalScopeFingerprint()}|${statusPart}|${settingsFingerprint(State.settings)}|m${State.masterCabangVersion}|v${State.vacantVersion}`;
}
// Simpan ke Map cache dengan batas ukuran (FIFO - entry terlama dihapus lebih dulu, lihat J3/K1).
function cachePutBounded(cacheMap, key, value, maxSize = 20) {
  cacheMap.set(key, value);
  if (cacheMap.size > maxSize) {
    const oldestKey = cacheMap.keys().next().value;
    cacheMap.delete(oldestKey);
  }
  return value;
}

  if (!raw) return { namaSalesmanAwal: namaAwal, namaSalesmanAktif: namaAwal, statusSalesmanSumber: 'MATCH', keteranganRaw: raw, keteranganKosong: true };
  const upper = raw.toUpperCase();
  if (upper === 'MATCH') return { namaSalesmanAwal: namaAwal, namaSalesmanAktif: namaAwal, statusSalesmanSumber: 'MATCH', keteranganRaw: raw, keteranganKosong: false };
  if (upper === 'VACANT') return { namaSalesmanAwal: namaAwal, namaSalesmanAktif: `VACANT — ${namaAwal}`, statusSalesmanSumber: 'VACANT', keteranganRaw: raw, keteranganKosong: false };
