/* ------------------------------------------------------------
   GLOBAL SCOPE — SATU SUMBER KEBENARAN
   Urutan universe perhitungan:
     RAW SNAPSHOT -> GLOBAL PHASE -> GLOBAL REGIONAL -> STATUS SALESMAN
       -> VALIDATION -> AGGREGATION -> FINAL SCORE -> RANKING -> QUICK/HEADER FILTER
   Dalam satu dimensi memakai OR (nilai IN daftar terpilih); antar dimensi memakai AND.
   Set kosong berarti "Semua" pada dimensi tersebut.
   CATATAN PENTING: helper ini TIDAK PERNAH memutasi snapshot.rawRecords — hanya menghasilkan
   derived records. Publish tetap memakai canonical snapshot penuh (lihat buildPublishedPayload).
   ------------------------------------------------------------ */
function phaseValueOfRecord(record) { return String((record && record.phaseProject) || '').trim(); }
function regionValueOfRecord(record) { return String((record && record.region) || '').trim(); }
function recordMatchesGlobalScope(record, phaseSet, regionSet) {
  if (phaseSet && phaseSet.size && !phaseSet.has(phaseValueOfRecord(record))) return false;
  if (regionSet && regionSet.size && !regionSet.has(regionValueOfRecord(record))) return false;
  return true;
}
function applyGlobalScope(records, phaseSet, regionSet) {
  const phases = phaseSet || State.activePhaseFilters;
  const regions = regionSet || State.activeRegionFilters;
  const list = Array.isArray(records) ? records : [];
  if ((!phases || !phases.size) && (!regions || !regions.size)) return list;
  return list.filter(record => recordMatchesGlobalScope(record, phases, regions));
}
// Raw records snapshot setelah Global Phase + Global Regional (BELUM difilter Status Salesman).
function getGlobalScopedRawRecords(snapshot = State.activeSnapshot) {
  if (!snapshot) return [];
  return applyGlobalScope(Array.isArray(snapshot.rawRecords) ? snapshot.rawRecords : []);
}
// Alias historis — seluruh pemanggil lama otomatis ikut Global Scope (Phase + Regional).
function getRawRecordsForActivePhase(snapshot = State.activeSnapshot) { return getGlobalScopedRawRecords(snapshot); }
// Universe final untuk kalkulasi: Global Scope + Status Salesman.
function getCalculationRecords(snapshot = State.activeSnapshot) {
  const activeStatuses = getActiveStatusSalesmanFilter();
  return getGlobalScopedRawRecords(snapshot).filter(rec => activeStatuses.has(getEffectiveSalesmanStatus(rec)));
}
// Cache yang bergantung pada Global Scope wajib dibuang saat filter berubah.
function invalidateGlobalScopeCaches() {
  State.rankingCache.clear();
  State.detailKpiHierarchyCache.clear();
  State.phaseHierarchyCache.clear();
}
function recomputeAfterVacantChange() {

  State.validation = validateDataset(getCalculationRecords(State.activeSnapshot));

}

}
function fmtRupiah(v) {

}
// Format ringkas khusus visual JPG. Nilai web dan CSV tetap nominal penuh.
function fmtRupiahCompact(v) {
  if (v === null || v === undefined || isNaN(v) || !isFinite(v)) return '-';
  const n = Number(v);

  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/%/g, '').replace(',', '.').trim();
  const num = parseFloat(s);
  return Number.isFinite(num) ? num : null;
}
// Parser input omzet: menerima "500000000", "500 Jt", "Rp500 Jt", "1,5 M", "Rp1,5 M", dst.
function parseMoneyInput(raw) {
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/^rp\.?\s*/i, '').trim();
  if (!s) return null;
  const m = s.match(/^([\d.,\s]+)\s*([A-Za-z]+)?$/);
  let numPart, suffix;
  if (m) { numPart = (m[1] || '').trim(); suffix = (m[2] || '').toLowerCase(); }
  else { numPart = s; suffix = ''; }
  numPart = numPart.replace(/\s+/g, '');
  if (!numPart) return null;
  if (numPart.includes(',')) numPart = numPart.replace(/\./g, '').replace(',', '.');
  else numPart = numPart.replace(/\./g, '');
  const base = parseFloat(numPart);
  if (!Number.isFinite(base)) return null;
  let mult = 1;
  if (suffix.startsWith('t')) mult = 1e12; // Triliun
  else if (suffix.startsWith('m')) mult = 1e9; // Miliar / M
  else if (suffix.startsWith('j')) mult = 1e6; // Juta / Jt
  return base * mult;
}

  if (abs >= 1e9) return `Rp${formatNumberTrim(n / 1e9)} M`;

      const transaction = db.transaction(APP_CONFIG.STORE_SNAPSHOTS, 'readwrite');
      const store = transaction.objectStore(APP_CONFIG.STORE_SNAPSHOTS);

/* ============================================================
   EXCEL PARSER  &  HEADER MAPPING
   ============================================================ */
class ParseError extends Error { constructor(message) { super(message); this.name = 'ParseError'; } }

// Normalisasi header: hapus line break, spasi berlebih, uppercase, trim.
function normalizeHeaderText(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/\n/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
}

function findTargetSheet(workbook) {
  const names = workbook.SheetNames;
  if (names.includes(APP_CONFIG.SHEET_NAME)) return APP_CONFIG.SHEET_NAME;
  const lower = names.map(n => n.toLowerCase());
  for (const kw of APP_CONFIG.SHEET_NAME_FALLBACK_KEYWORDS) {
    const idx = lower.findIndex(n => n.includes(kw));
    if (idx !== -1) return names[idx];
  }
  return names[0];
}

// Mencari baris header sesungguhnya (bukan baris template duplikat) dengan mencari 'KODE SALESMAN'
function findHeaderRowIndex(rows) {
  const marker = APP_CONFIG.HEADER_MARKER_TEXT;
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    const row = rows[r]; if (!row) continue;
    for (let c = 0; c < row.length; c++) { if (normalizeHeaderText(row[c]) === marker) return r; }
  }
  return -1;
}

// Pemetaan field -> index kolom: cari nama header di baris sekitar header (mendukung header bertingkat),
// fallback ke posisi kolom tetap jika nama tidak ditemukan.
function buildColumnIndexMap(rows, headerRowIdx) {
  const searchRows = [];
  for (let r = Math.max(0, headerRowIdx - 1); r <= headerRowIdx + 1 && r < rows.length; r++) searchRows.push(rows[r] || []);
  const colIndexMap = {}, matchedByName = {}, notFound = [];
  APP_CONFIG.FIELD_MAP.forEach(field => {
    let foundCol = -1;
    for (const row of searchRows) {
      for (let c = 0; c < row.length; c++) { if (field.aliases.includes(normalizeHeaderText(row[c]))) { foundCol = c; break; } }
      if (foundCol !== -1) break;
    }
    if (foundCol === -1) { colIndexMap[field.key] = field.fallbackCol; notFound.push(field.key); }
    else { colIndexMap[field.key] = foundCol; matchedByName[field.key] = foundCol; }
  });
  return { colIndexMap, matchedByName, notFound };
}

function isTemplateOrEmptyRow(row, colIndexMap) {
  const kodeSalesmanRaw = row[colIndexMap.kodeSalesman];
  const regionRaw = row[colIndexMap.region];
  const namaSalesmanRaw = row[colIndexMap.namaSalesman];
  if ((kodeSalesmanRaw === undefined || kodeSalesmanRaw === null || kodeSalesmanRaw === '') &&
      (namaSalesmanRaw === undefined || namaSalesmanRaw === null || namaSalesmanRaw === '')) return 'empty';
  const regionNorm = normalizeHeaderText(regionRaw), kodeNorm = normalizeHeaderText(kodeSalesmanRaw);
  if (regionNorm === 'REGION' || kodeNorm === 'KODE SALESMAN') return 'template';
  return null;
}

function toNumberOrNull(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  const cleaned = String(v).replace(/[%\s]/g, '').replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? null : n;
}

  if (rec.geofencing === null || isNaN(rec.geofencing)) reasons.push({ field: 'geofencing', message: 'GEOFANCING bukan angka valid', value: rec.geofencing });

   CSV EXPORT
   ============================================================ */
function exportToCsv(filename, headers, rows, metadata) {
  const escapeCsv = (v) => { if (v === null || v === undefined) return ''; const s = String(v); return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [];
  if (Array.isArray(metadata) && metadata.length) {
    metadata.forEach(pair => lines.push([escapeCsv(pair[0]), escapeCsv(pair[1])].join(',')));
    lines.push(''); // baris kosong pemisah sebelum header tabel
  }
  lines.push(headers.map(escapeCsv).join(','));
  rows.forEach(r => lines.push(r.map(escapeCsv).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// Animated counter ringan (hanya dipakai sekali saat dashboard pertama kali dibuka)
function animateCounter(el, targetValue, opts = {}) {
  const duration = opts.duration || 700;
  const decimals = opts.decimals || 0;
  const start = performance.now();
  const from = 0;
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = from + (targetValue - from) * eased;
    el.textContent = decimals > 0 ? fmtNumber(val, decimals) : fmtNumber(Math.round(val));
    if (t < 1) requestAnimationFrame(step); else el.textContent = decimals > 0 ? fmtNumber(targetValue, decimals) : fmtNumber(targetValue);
  }
  requestAnimationFrame(step);
}

        const indicatorSelect = refs.quickFilters.querySelector('.countif-indicator-select');
        if (indicatorSelect && indicatorSelect.value !== this.countifIndicatorId) indicatorSelect.value = this.countifIndicatorId;
        const thresholdInput = refs.quickFilters.querySelector('.countif-threshold-input');
        if (thresholdInput) {
          // C1/C3: satu sumber kebenaran tipe indikator - indicator.type, bukan label teks.
          const isMoney = indicator.type === 'money';
          thresholdInput.classList.toggle('is-money', isMoney);
          const newInputMode = isMoney ? 'text' : 'decimal';
          if (thresholdInput.inputMode !== newInputMode) thresholdInput.inputMode = newInputMode;
          const newPlaceholder = isMoney ? 'cth 1,5 M' : 'Nilai';
          if (thresholdInput.placeholder !== newPlaceholder) thresholdInput.placeholder = newPlaceholder;
          // K/C4: jangan timpa input yang sedang diketik pengguna (hindari caret lompat / ketikan hilang).
          if (document.activeElement !== thresholdInput && thresholdInput.value !== this.countifThresholdRaw) {
            thresholdInput.value = this.countifThresholdRaw;
          }
        }
      }
    }
  }

  updateHeaderState() {
    const refs = this._refs;
    if (!refs || !refs.thead) return;
    this.applyHeaderStateToThead(refs.thead);
    this.syncFloatingHeaderState(); // thead floating (jika ada) ikut disinkronkan
  }
  // Terapkan status sort/filter aktif ke SATU elemen thead (dipakai untuk thead asli maupun clone floating -
  // satu sumber logika, bukan diduplikasi, lihat instruksi "Interaksi Sorting dan Filter").
  applyHeaderStateToThead(theadEl) {
    if (!theadEl) return;
    theadEl.querySelectorAll('[data-key]').forEach(th => {
      const key = th.dataset.key;
      const c = this.columns.find(col => col.key === key);
      if (!c) return;
      const filterDef = this.headerFilters.find(f => f.key === key);
      const filterBtn = th.querySelector('.dt-header-filter-toggle');
      if (filterBtn) {
        const isActive = !!(filterDef && this.activeHeaderFilters[key]);
        filterBtn.classList.toggle('is-active', isActive);
        filterBtn.title = isActive ? 'Filter aktif' : 'Filter';
      }
      if (this.sortingEnabled && c.sortable && c.sortId) {
        const sortIcon = th.querySelector('.dt-sort-icon');
        const isSortActive = this.sortKey === c.sortId;
        if (sortIcon) {
          sortIcon.classList.toggle('is-active', isSortActive);
          sortIcon.textContent = isSortActive ? (this.sortDir === 'desc' ? '↓' : '↑') : '⇅';
        }
      }
    });
    // V: checkbox header "Pilih Semua" (VACANT) harus ikut hasil filter terbaru meski thead tidak dibangun ulang.
    const selectAllCb = theadEl.querySelector('.vacant-select-all');
    if (selectAllCb) {
      const rows = (this._lastFilteredRows || []).filter(row => row && row.rec);
      selectAllCb.checked = rows.length > 0 && rows.every(row => State.vacantSelection.has(buildVacantSalesmanKey(row.rec)));
    }
  }

  // ===== Floating sticky header — HANYA untuk tabel utama Ranking (mainRankingScroll) =====
  // Dipasang di renderFullShell() setelah _refs terisi. Tidak dibangun ulang saat renderPartial() - hanya
  // posisi/scrollLeft/status sort-filter yang disinkronkan supaya tidak flicker.
  setupFloatingRankingHeader() {
    this.teardownFloatingRankingHeader(); // bersihkan instance lama dulu (full shell rebuild / re-setup)
    if (!this.mainRankingScroll) return;
    const refs = this._refs;
    if (!refs || !refs.scrollWrap || !refs.table || !refs.thead) return;
    if (!refs.table.classList.contains('has-grouped-header')) return; // hanya tabel dengan header 2-tingkat
    this.buildFloatingRankingHeader();
  }
  stripDuplicateIds(rootEl) {
    // Keamanan: clone thead bisa membawa id yang sama dengan elemen asli - hapus agar tidak ada duplicate ID di DOM.
    rootEl.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  }
  buildFloatingRankingHeader() {
    const refs = this._refs;
    const floatEl = document.createElement('div');
    floatEl.className = 'dt-floating-ranking-header';
    floatEl.setAttribute('aria-hidden', 'true'); // salinan visual dari header asli, bukan konten utama pembaca layar
    const floatScroll = document.createElement('div');
    floatScroll.className = 'dt-floating-ranking-scroll';
    const floatTable = document.createElement('table');
    floatTable.className = `${refs.table.className} dt-floating-ranking-table`;
    floatTable.style.cssText = refs.table.style.cssText; // width/minWidth/table-layout identik tabel asli (instruksi: sinkronisasi ukuran kolom)
    if (refs.colgroup) floatTable.appendChild(refs.colgroup.cloneNode(true));
    const floatThead = refs.thead.cloneNode(true);
    this.stripDuplicateIds(floatThead);
    floatTable.appendChild(floatThead);
    floatScroll.appendChild(floatTable);
    floatEl.appendChild(floatScroll);
    refs.container.appendChild(floatEl); // tetap descendant container agar event delegation (klik sort/filter) tetap tertangkap

    this._floatingHeaderEl = floatEl;
    this._floatingHeaderScrollEl = floatScroll;
    this._floatingHeaderTableEl = floatTable;
    this._floatingHeaderTheadEl = floatThead;
    this._floatingHeaderVisible = false;
    this.applyHeaderStateToThead(floatThead); // status sort/filter awal ikut tersinkron sejak dibangun

    this._floatingHeaderAbortController = new AbortController();
    const localSignal = this._floatingHeaderAbortController.signal;
    const onWindowChange = () => this.scheduleFloatingHeaderUpdate();
    // Perbaikan 1: listener window WAJIB memakai localSignal (bukan State.pageSignal langsung) - agar
    // teardownFloatingRankingHeader() benar-benar dapat menghentikannya saat full shell rebuild pada route
    // YANG SAMA (State.pageSignal belum ter-abort dalam kasus itu, sehingga listener lama akan menumpuk
    // apabila tetap terikat ke pageSignal).
    window.addEventListener('scroll', onWindowChange, { passive: true, signal: localSignal });
    window.addEventListener('resize', onWindowChange, { passive: true, signal: localSignal });
    refs.scrollWrap.addEventListener('scroll', () => this.syncFloatingHeaderScroll(), { passive: true, signal: localSignal });

    // Perbaikan 2: pageSignal HANYA dipakai untuk memberi tahu instance bahwa halaman ditinggalkan, lalu
    // memicu teardown LENGKAP (bukan dipasang langsung sebagai signal listener window). Listener jembatan ini
    // sendiri terikat localSignal, sehingga ikut terhapus otomatis jika teardown terjadi lebih dulu karena
    // sebab lain (mis. full shell rebuild) sebelum route benar-benar berpindah.
    if (State.pageSignal && !State.pageSignal.aborted) {
      State.pageSignal.addEventListener('abort', () => this.teardownFloatingRankingHeader(), { once: true, signal: localSignal });
    }

    if (typeof ResizeObserver !== 'undefined') {
      this._floatingHeaderResizeObserver = new ResizeObserver(() => this.scheduleFloatingHeaderUpdate());
      this._floatingHeaderResizeObserver.observe(refs.scrollWrap);
      const topbarEl = document.getElementById('topbar');
      if (topbarEl) this._floatingHeaderResizeObserver.observe(topbarEl);
    }

    this.syncFloatingHeaderScroll();
    this.scheduleFloatingHeaderUpdate();
  }
  scheduleFloatingHeaderUpdate() {
    if (!this._floatingHeaderEl || this._floatingHeaderRaf) return; // sudah dijadwalkan / sudah tidak ada header
    this._floatingHeaderRaf = requestAnimationFrame(() => {
      this._floatingHeaderRaf = null;
      this.updateFloatingHeaderPosition();
    });
  }
  updateFloatingHeaderPosition() {
    const refs = this._refs;
    const floatEl = this._floatingHeaderEl;
    if (!refs || !floatEl || !refs.scrollWrap || !refs.scrollWrap.isConnected) { this.teardownFloatingRankingHeader(); return; }
    const topbarEl = document.getElementById('topbar');
    const topbarBottom = topbarEl ? topbarEl.getBoundingClientRect().bottom : 0;
    const tableRect = refs.scrollWrap.getBoundingClientRect();
    const headerHeight = floatEl.offsetHeight || 84;
    // Tampil hanya jika bagian atas tabel sudah melewati bawah topbar DAN bagian bawah tabel masih di bawahnya.
    const shouldShow = tableRect.top < topbarBottom && tableRect.bottom > topbarBottom + headerHeight;
    if (shouldShow) {
      floatEl.style.top = `${topbarBottom}px`;
      floatEl.style.left = `${tableRect.left}px`;
      floatEl.style.width = `${tableRect.width}px`;
      if (!this._floatingHeaderVisible) { floatEl.classList.add('is-visible'); this._floatingHeaderVisible = true; }
      this.syncFloatingHeaderScroll();
    } else if (this._floatingHeaderVisible) {
      floatEl.classList.remove('is-visible');
      this._floatingHeaderVisible = false;
      // G: popover yang dibuka dari tombol floating harus ikut ditutup agar tidak menjadi popover tanpa anchor.
      if (this._filterPopover && floatEl.contains(this._filterPopoverAnchor)) this.closeFilterPopover();
    }
  }
  syncFloatingHeaderScroll() {
    if (this._floatingHeaderScrollEl && this._refs && this._refs.scrollWrap) {
      this._floatingHeaderScrollEl.scrollLeft = this._refs.scrollWrap.scrollLeft;
    }
  }
  syncFloatingHeaderState() {
    if (this._floatingHeaderTheadEl) this.applyHeaderStateToThead(this._floatingHeaderTheadEl);
  }
  teardownFloatingRankingHeader() {
    if (this._floatingHeaderRaf) { cancelAnimationFrame(this._floatingHeaderRaf); this._floatingHeaderRaf = null; }
    if (this._floatingHeaderResizeObserver) { this._floatingHeaderResizeObserver.disconnect(); this._floatingHeaderResizeObserver = null; }
    if (this._floatingHeaderAbortController) { this._floatingHeaderAbortController.abort(); this._floatingHeaderAbortController = null; }
    // Popover Filter: jika popover aktif dianchor oleh tombol pada floating header, tutup dulu SEBELUM floating
    // header dihapus dari DOM - mencegah popover tanpa anchor tertinggal (idempotent: aman jika sudah tidak ada).
    if (this._floatingHeaderEl && this._filterPopover && this._filterPopoverAnchor && this._floatingHeaderEl.contains(this._filterPopoverAnchor)) {
      this.closeFilterPopover();
    }
    if (this._floatingHeaderEl && this._floatingHeaderEl.parentNode) this._floatingHeaderEl.parentNode.removeChild(this._floatingHeaderEl);
    this._floatingHeaderEl = null; this._floatingHeaderScrollEl = null; this._floatingHeaderTableEl = null; this._floatingHeaderTheadEl = null;
    this._floatingHeaderVisible = false;
  }

  setupEventDelegation(container) {
    // J: hindari listener ganda meski instance DataTable BERBEDA menargetkan container yang sama
    // (mis. Data Sumber membuat instance baru setiap show/hide kolom) - abort controller SEBELUMNYA
    // yang tersimpan di elemen container itu sendiri, bukan hanya this._shellAbortController milik instance ini.
    if (container.__dtAbortController) { try { container.__dtAbortController.abort(); } catch (e) { /* noop */ } }
    this._shellAbortController = new AbortController();
    container.__dtAbortController = this._shellAbortController;
    const signal = this._shellAbortController.signal;

    container.addEventListener('click', (e) => this.handleDelegatedClick(e), { signal });
    container.addEventListener('input', (e) => this.handleDelegatedInput(e), { signal });
    container.addEventListener('change', (e) => this.handleDelegatedChange(e), { signal });
    container.addEventListener('keydown', (e) => this.handleDelegatedKeydown(e), { signal });
    container.addEventListener('focusout', (e) => this.handleDelegatedFocusOut(e), { signal });
  }

  handleExportClick() {
    const exportColumns = this.columns.filter(c => !c.excludeFromCsv);
    const headers = exportColumns.map(c => c.label);
    const rows = this.getFiltered().map(r => exportColumns.map(c => (c.csvValue ? c.csvValue(r) : c.render(r).replace(/<[^>]+>/g, ''))));
    const metadata = [...statusSalesmanCsvMetadataRows()];
    // Metadata "TAT Hari Ini" sengaja TIDAK disertakan pada CSV Ranking.
    if (typeof this.jpgFilterSummary === 'function') {
      this.jpgFilterSummary().forEach(chip => {
        const idx = String(chip).indexOf(':');
        metadata.push(idx > -1 ? [chip.slice(0, idx).trim(), chip.slice(idx + 1).trim()] : [chip, '']);
      });
    }
    exportToCsv(this.exportFilename, headers, rows, metadata);
    showToast('Export CSV berhasil.', 'success');
  }

  handleDelegatedClick(e) {
    const target = e.target;
    const trendButton = target.closest('.ranking-trend-btn');
    if (trendButton) {
      e.preventDefault(); e.stopPropagation();
      const trendRow = trendButton.closest('tbody tr');
      const row = trendRow ? this._rowMap.get(trendRow.dataset.rowKey) : null;
      if (row) openTrendPerformanceModal(trendButton.dataset.trendLevel, row);
      return;
    }
    const tr = target.closest('tbody tr.dt-row-clickable');
    if (tr && this._refs && this._refs.tbody && this._refs.tbody.contains(tr)) {
      if (target.closest('button,input,select,a,label')) return;
      const row = this._rowMap.get(tr.dataset.rowKey);
      if (row && this.rowDetailFn) this.rowDetailFn(row);
      return;
    }
    if (target.closest('.dt-prev')) { this.page--; this.render(); return; }
    if (target.closest('.dt-next')) { this.page++; this.render(); return; }
    if (target.closest('.dt-export')) { this.handleExportClick(); return; }
    if (target.closest('.dt-jpg')) { this.downloadJpg(); return; }
    if (target.closest('.dt-reset-filters')) {
      Object.keys(this.activeHeaderFilters).forEach(key => delete this.activeHeaderFilters[key]);
      this.page = 1; this.closeFilterPopover(); this.render();
      return;
    }
    if (target.closest('.dt-clear-sort-btn')) { this.clearSort(); return; }
    const quickBtn = target.closest('.dt-quick-filter-btn');
    if (quickBtn) {
      if (quickBtn.disabled) return;
      this.quickStatusFilter = quickBtn.dataset.statusFilter || 'all';
      this.page = 1; this.render();
      return;
    }
    const countifChip = target.closest('.countif-chip');
    if (countifChip) {
      if (countifChip.disabled) return;
      const type = countifChip.dataset.countif;
      this.countifActiveFilter = (this.countifActiveFilter === type) ? null : type;
      this._persistCountifState();
      this.page = 1; this.render();
      return;
    }
    const sortHeader = target.closest('.dt-header-sortable');
    if (sortHeader) { this.handleHeaderSortClick(sortHeader.dataset.sortId); return; }
    const filterToggle = target.closest('.dt-header-filter-toggle');
    if (filterToggle) {
      e.preventDefault(); e.stopPropagation();
      const key = filterToggle.dataset.filterKey;
      const filterDef = this.headerFilters.find(f => f.key === key);
      if (!filterDef) return;
      if (this._filterPopover && this._filterPopover.dataset.filterKey === key) { this.closeFilterPopover(); return; }
      this.openFilterPopover(filterDef, filterToggle);
      return;
    }
  }

  handleDelegatedInput(e) {
    if (e.target.classList.contains('dt-search-input')) { this._debouncedSearch(e.target.value); return; }
    if (e.target.classList.contains('countif-threshold-input')) { this._debouncedCountifInput(e.target.value); return; }
  }

  handleDelegatedChange(e) {
    const target = e.target;
    if (target.classList.contains('dt-pagesize')) {
      const v = target.value;
      this.pageSize = v === 'all' ? 'all' : parseInt(v, 10);
      LocalPrefs.setPageSize(this.pageSizeKey, this.pageSize);
      this.page = 1; this.render();
      return;
    }
    if (target.classList.contains('countif-indicator-select')) {
      this.countifIndicatorId = target.value;
      this._persistCountifState();
      this.page = 1; this.render();
      return;
    }
  }

  handleDelegatedKeydown(e) {
    const target = e.target;
    const sortHeader = target.closest && target.closest('.dt-header-sortable');
    if (sortHeader && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.handleHeaderSortClick(sortHeader.dataset.sortId); return; }
    const tr = target.closest && target.closest('tbody tr.dt-row-clickable');
    if (tr && this._refs && this._refs.tbody && this._refs.tbody.contains(tr)) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (target.closest('button,input,select,a,label')) return;
      e.preventDefault();
      const row = this._rowMap.get(tr.dataset.rowKey);
      if (row && this.rowDetailFn) this.rowDetailFn(row);
      return;
    }
    if (target.classList.contains('countif-threshold-input') && e.key === 'Enter') {
      this.countifThresholdRaw = target.value;
      this._persistCountifState();
      this.page = 1; this.render();
    }
  }

  // focusout (bukan blur) dipakai karena blur TIDAK bubble sehingga tidak bisa didelegasikan ke container.
  handleDelegatedFocusOut(e) {
    const target = e.target;
    if (target.classList && target.classList.contains('countif-threshold-input')) {
      if (this._debouncedCountifInput && this._debouncedCountifInput.cancel) this._debouncedCountifInput.cancel();
      this.countifThresholdRaw = target.value;
      this._persistCountifState();
      this.page = 1; this.render();
    }
  }

  // ===== W: render() — orkestrator dengan fallback otomatis ke full render =====
  render() {
    if (this._destroyed) return;
    try {
      const view = this.computeView();
      if (this.needsShellRebuild(view)) {
        this.renderFullShell(view);
      } else {
        try {
          this.renderPartial(view);
        } catch (partialError) {
          console.warn('Partial render gagal, memakai full render.', partialError);
          this.renderFullShell(view);
        }
      }
    } catch (error) {
      console.error('DataTable render gagal:', error);
    }
  }

  // ===== X: destroy / cleanup =====
  destroy() {
    if (this._shellAbortController) { this._shellAbortController.abort(); this._shellAbortController = null; }
    this.teardownFloatingRankingHeader();
    this.closeFilterPopover();
    if (this._debouncedSearch && this._debouncedSearch.cancel) this._debouncedSearch.cancel();
    if (this._debouncedCountifInput && this._debouncedCountifInput.cancel) this._debouncedCountifInput.cancel();
    this._refs = null;
    this._rowMap.clear();
    this._lastFilteredRows = null;
    this._shellSignature = null;
    this._destroyed = true;
  }


  // Download JPG: memakai this.getFiltered() (seluruh hasil filter/search/sort, TANPA pagination),
  // kolom bertanda excludeFromJpg dibuang, dibagi otomatis per this.jpgRowsPerPage baris/gambar.
  closeFilterPopover() {
    if (this._filterAbortController) { this._filterAbortController.abort(); this._filterAbortController = null; }
    if (this._filterPopover) { this._filterPopover.remove(); this._filterPopover = null; }
    this._filterPopoverAnchor = null;
    document.querySelectorAll('.dt-header-filter-toggle[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }

  positionPopover(popoverEl, buttonEl) {
    const rect = buttonEl.getBoundingClientRect();
    popoverEl.style.top = '0px'; popoverEl.style.left = '0px'; // ukur dulu sebelum diposisikan
    document.body.appendChild(popoverEl);
    const pw = popoverEl.offsetWidth, ph = popoverEl.offsetHeight;
    let top = rect.bottom + 6, left = rect.left;
    if (left + pw > window.innerWidth) left = Math.max(12, window.innerWidth - pw - 12);
    if (top + ph > window.innerHeight) top = Math.max(12, rect.top - ph - 6);
    popoverEl.style.top = `${top}px`; popoverEl.style.left = `${left}px`;
  }

  // Membangun & menampilkan popover filter untuk satu kolom. Hanya satu popover boleh terbuka.
  openFilterPopover(filterDef, buttonEl) {
    this.closeFilterPopover();
    this._filterPopoverAnchor = buttonEl;
    const key = filterDef.key;
    const current = this.activeHeaderFilters[key];
    const popover = document.createElement('div');
    popover.className = 'dt-filter-popover';
    popover.dataset.filterKey = key;
    popover.setAttribute('role', 'dialog');
    popover.style.maxWidth = 'calc(100vw - 24px)';

    if (filterDef.type === 'text') {
      const val = current && current.type === 'text' ? current.value : '';
      popover.innerHTML = `
        <div class="dt-filter-popover-title">Filter ${escapeHtml(filterDef.label)}</div>
        <input type="text" class="dt-filter-search" placeholder="${escapeHtml(filterDef.placeholder || '')}" value="${escapeHtml(val)}" aria-label="${escapeHtml(filterDef.label)}" />
        <div class="dt-filter-actions">
          <button type="button" class="btn btn-ghost btn-sm dt-filter-reset">Reset</button>
          <button type="button" class="btn btn-primary btn-sm dt-filter-apply">Terapkan</button>
        </div>`;
      this.positionPopover(popover, buttonEl);
      const input = popover.querySelector('.dt-filter-search');
      input.focus();
      popover.querySelector('.dt-filter-apply').addEventListener('click', () => {
        const v = input.value.trim();
        if (v) this.activeHeaderFilters[key] = { type: 'text', value: v }; else delete this.activeHeaderFilters[key];
        this.page = 1; this.closeFilterPopover(); this.render();
      });
      popover.querySelector('.dt-filter-reset').addEventListener('click', () => {
        delete this.activeHeaderFilters[key]; this.page = 1; this.closeFilterPopover(); this.render();
      });
    } else if (filterDef.type === 'multi-select') {
      // Filter berantai: opsi Depo dibatasi Regional aktif; opsi ASS dibatasi Regional+Depo aktif.
      let extraFilterFn = null;
      if (key === 'rec.depo' && this.activeHeaderFilters['rec.region']) {
        const regions = new Set(this.activeHeaderFilters['rec.region'].values || []);
        if (regions.size) extraFilterFn = r => regions.has(String(getPath(r, 'rec.region') || ''));
      } else if (key === 'rec.namaAss') {
        const regions = this.activeHeaderFilters['rec.region'] ? new Set(this.activeHeaderFilters['rec.region'].values || []) : null;
        const depos = this.activeHeaderFilters['rec.depo'] ? new Set(this.activeHeaderFilters['rec.depo'].values || []) : null;
        if ((regions && regions.size) || (depos && depos.size)) {
          extraFilterFn = r => (!regions || !regions.size || regions.has(String(getPath(r, 'rec.region') || ''))) && (!depos || !depos.size || depos.has(String(getPath(r, 'rec.depo') || '')));
        }
      }
      const allOptions = this.getHeaderFilterOptions(key, extraFilterFn);
      const selected = new Set(current && current.type === 'multi-select' ? current.values : []);
      popover.innerHTML = `
        <div class="dt-filter-popover-title">Filter ${escapeHtml(filterDef.label)}</div>
        <input type="text" class="dt-filter-search" placeholder="${escapeHtml(filterDef.placeholder || 'Cari...')}" aria-label="Cari opsi ${escapeHtml(filterDef.label)}" />
        <div class="dt-filter-options">
          <label class="dt-filter-option"><input type="checkbox" class="dt-filter-select-all" /> <strong>Pilih Semua</strong></label>
          ${allOptions.map(opt => `<label class="dt-filter-option" data-opt="${escapeHtml(opt)}"><input type="checkbox" value="${escapeHtml(opt)}" ${selected.has(opt) ? 'checked' : ''} /> ${escapeHtml(opt)}</label>`).join('') || '<div class="muted" style="padding:6px 4px;">Tidak ada opsi.</div>'}
        </div>
        <div class="dt-filter-actions">
          <button type="button" class="btn btn-ghost btn-sm dt-filter-reset">Reset</button>
          <button type="button" class="btn btn-primary btn-sm dt-filter-apply">Terapkan</button>
        </div>`;
      this.positionPopover(popover, buttonEl);
      const searchInput = popover.querySelector('.dt-filter-search');
      const optionsWrap = popover.querySelector('.dt-filter-options');
      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        optionsWrap.querySelectorAll('label.dt-filter-option[data-opt]').forEach(lbl => {
          lbl.style.display = lbl.dataset.opt.toLowerCase().includes(q) ? '' : 'none';
        });
      });
      const selectAllCb = popover.querySelector('.dt-filter-select-all');
      selectAllCb.checked = allOptions.length > 0 && allOptions.every(o => selected.has(o));
      selectAllCb.addEventListener('change', () => {
        optionsWrap.querySelectorAll('label.dt-filter-option[data-opt] input').forEach(cb => { cb.checked = selectAllCb.checked; });
      });
      popover.querySelector('.dt-filter-apply').addEventListener('click', () => {
        const values = Array.from(optionsWrap.querySelectorAll('label.dt-filter-option[data-opt] input:checked')).map(cb => cb.value);
        if (values.length) this.activeHeaderFilters[key] = { type: 'multi-select', values }; else delete this.activeHeaderFilters[key];
        // Buang nilai child (Depo/ASS) yang jadi tidak valid setelah parent (Regional/Depo) berubah
        if (key === 'rec.region' && this.activeHeaderFilters['rec.depo']) {
          const validDepo = new Set(this.getHeaderFilterOptions('rec.depo', values.length ? r => values.includes(String(getPath(r, 'rec.region') || '')) : null));
          const keptDepo = (this.activeHeaderFilters['rec.depo'].values || []).filter(v => validDepo.has(v));
          if (keptDepo.length) this.activeHeaderFilters['rec.depo'].values = keptDepo; else delete this.activeHeaderFilters['rec.depo'];
        }
        if ((key === 'rec.region' || key === 'rec.depo') && this.activeHeaderFilters['rec.namaAss']) {
          const regions = this.activeHeaderFilters['rec.region'] ? new Set(this.activeHeaderFilters['rec.region'].values || []) : null;
          const depos = this.activeHeaderFilters['rec.depo'] ? new Set(this.activeHeaderFilters['rec.depo'].values || []) : null;
          const validAss = new Set(this.getHeaderFilterOptions('rec.namaAss', r => (!regions || !regions.size || regions.has(String(getPath(r, 'rec.region') || ''))) && (!depos || !depos.size || depos.has(String(getPath(r, 'rec.depo') || '')))));
          const keptAss = (this.activeHeaderFilters['rec.namaAss'].values || []).filter(v => validAss.has(v));
          if (keptAss.length) this.activeHeaderFilters['rec.namaAss'].values = keptAss; else delete this.activeHeaderFilters['rec.namaAss'];
        }
        this.page = 1; this.closeFilterPopover(); this.render();
      });
      popover.querySelector('.dt-filter-reset').addEventListener('click', () => {
        delete this.activeHeaderFilters[key]; this.page = 1; this.closeFilterPopover(); this.render();
      });
    } else if (filterDef.type === 'number-range') {
      const min = current && current.type === 'number-range' ? current.min : null;
      const max = current && current.type === 'number-range' ? current.max : null;
      popover.innerHTML = `
        <div class="dt-filter-popover-title">Filter ${escapeHtml(filterDef.label)}</div>
        <div class="dt-filter-range-row">
          <input type="number" step="0.01" class="dt-filter-search dt-filter-min" placeholder="${escapeHtml(filterDef.placeholderMin || 'Minimum')}" value="${min ?? ''}" aria-label="${escapeHtml(filterDef.label)} minimum" />
          <input type="number" step="0.01" class="dt-filter-search dt-filter-max" placeholder="${escapeHtml(filterDef.placeholderMax || 'Maksimum')}" value="${max ?? ''}" aria-label="${escapeHtml(filterDef.label)} maksimum" />
        </div>
        <div class="dt-filter-actions">
          <button type="button" class="btn btn-ghost btn-sm dt-filter-reset">Reset</button>
          <button type="button" class="btn btn-primary btn-sm dt-filter-apply">Terapkan</button>
        </div>`;
      this.positionPopover(popover, buttonEl);
      popover.querySelector('.dt-filter-apply').addEventListener('click', () => {
        const minVal = popover.querySelector('.dt-filter-min').value.trim();
        const maxVal = popover.querySelector('.dt-filter-max').value.trim();
        if ((minVal !== '' && !Number.isFinite(Number(minVal))) || (maxVal !== '' && !Number.isFinite(Number(maxVal)))) {
          showToast('Nilai filter harus berupa angka.', 'error'); return;
        }
        const minNum = minVal !== '' ? Number(minVal) : null;
        const maxNum = maxVal !== '' ? Number(maxVal) : null;
        if (minNum !== null && maxNum !== null && minNum > maxNum) {
          showToast('Minimum tidak boleh lebih besar dari maksimum.', 'error'); return;
        }
        if (minNum !== null || maxNum !== null) this.activeHeaderFilters[key] = { type: 'number-range', min: minNum, max: maxNum };
        else delete this.activeHeaderFilters[key];
        this.page = 1; this.closeFilterPopover(); this.render();
      });
      popover.querySelector('.dt-filter-reset').addEventListener('click', () => {
        delete this.activeHeaderFilters[key]; this.page = 1; this.closeFilterPopover(); this.render();
      });
    } else if (filterDef.type === 'kpi-combined') {
      // Migrasi aman: filter number-range lama (sebelum popover gabungan ini ada) dibaca sebagai tab Minimum-Maksimum.
      const migrated = current && current.type === 'number-range' ? { type: 'kpi-combined', mode: 'range', strataIds: [], min: current.min, max: current.max } : current;
      const currentCombined = migrated && migrated.type === 'kpi-combined' ? migrated : null;
      let activeSubTab = currentCombined ? currentCombined.mode : 'strata'; // buka tab metode yang terakhir aktif
      let stagedStrataIds = new Set(currentCombined ? (currentCombined.strataIds || []) : []);
      let stagedMin = currentCombined && currentCombined.min !== undefined && currentCombined.min !== null ? String(currentCombined.min) : '';
      let stagedMax = currentCombined && currentCombined.max !== undefined && currentCombined.max !== null ? String(currentCombined.max) : '';

      const kpiId = filterDef.kpiId;
      const rawBuckets = kpiId ? detailKpiBuildBuckets(kpiId, { ...detailKpiChartSetting(kpiId), mode: 'strata' }) : [];
      // Bucket ">100% - Anomali" hanya ditampilkan jika benar-benar ada data pada kolom ini (bukan sekadar entri strata kosong)
      const allNumericValues = kpiId ? this.data.map(row => Number(filterDef.valueFn ? filterDef.valueFn(row) : getPath(row, key))).filter(Number.isFinite) : [];
      const buckets = rawBuckets.filter(bucket => !bucket.anomaly || allNumericValues.some(value => detailKpiBucketContains(bucket, value)));

      popover.innerHTML = `
        <div class="dt-filter-popover-title">Filter ${escapeHtml(filterDef.label)}</div>
        <div class="dt-filter-tabs"><button type="button" class="dt-filter-tab" data-kpi-tab="strata">Strata</button><button type="button" class="dt-filter-tab" data-kpi-tab="range">Minimum–Maksimum</button></div>
        <div id="dt-kpi-filter-body"></div>
        <div class="dt-filter-actions">
          <button type="button" class="btn btn-ghost btn-sm dt-filter-reset">Reset</button>
          <button type="button" class="btn btn-primary btn-sm dt-filter-apply">Terapkan</button>
        </div>`;
      this.positionPopover(popover, buttonEl);
      const body = popover.querySelector('#dt-kpi-filter-body');
      const tabButtons = popover.querySelectorAll('[data-kpi-tab]');

      const renderStrataTab = () => {
        body.innerHTML = `
          <input type="text" class="dt-filter-search" placeholder="Cari strata..." aria-label="Cari strata ${escapeHtml(filterDef.label)}" />
          <div class="dt-filter-options">
            <label class="dt-filter-option"><input type="checkbox" class="dt-filter-select-all" /> <strong>Pilih Semua</strong></label>
            ${buckets.map(bucket => `<label class="dt-filter-option" data-opt="${escapeHtml(bucket.label)}"><input type="checkbox" value="${escapeHtml(bucket.label)}" ${stagedStrataIds.has(bucket.label) ? 'checked' : ''} /> ${escapeHtml(bucket.label)}</label>`).join('') || '<div class="muted" style="padding:6px 4px;">Strata belum diatur di Detail KPI.</div>'}
          </div>`;
        const searchInput = body.querySelector('.dt-filter-search');
        const optionsWrap = body.querySelector('.dt-filter-options');
        searchInput.addEventListener('input', () => {
          const q = searchInput.value.trim().toLowerCase();
          optionsWrap.querySelectorAll('label.dt-filter-option[data-opt]').forEach(lbl => { lbl.style.display = lbl.dataset.opt.toLowerCase().includes(q) ? '' : 'none'; });
        });
        const selectAllCb = optionsWrap.querySelector('.dt-filter-select-all');
        selectAllCb.checked = buckets.length > 0 && buckets.every(bucket => stagedStrataIds.has(bucket.label));
        selectAllCb.addEventListener('change', () => {
          optionsWrap.querySelectorAll('label.dt-filter-option[data-opt] input').forEach(cb => { cb.checked = selectAllCb.checked; if (selectAllCb.checked) stagedStrataIds.add(cb.value); else stagedStrataIds.delete(cb.value); });
        });
        optionsWrap.querySelectorAll('label.dt-filter-option[data-opt] input').forEach(cb => cb.addEventListener('change', () => {
          if (cb.checked) stagedStrataIds.add(cb.value); else stagedStrataIds.delete(cb.value);
          selectAllCb.checked = buckets.length > 0 && buckets.every(bucket => stagedStrataIds.has(bucket.label));
        }));
      };
      const renderRangeTab = () => {
        body.innerHTML = `
          <div class="dt-filter-range-row">
            <input type="number" step="0.01" class="dt-filter-search dt-filter-min" placeholder="${escapeHtml(filterDef.placeholderMin || 'Minimum')}" value="${escapeHtml(stagedMin)}" aria-label="${escapeHtml(filterDef.label)} minimum" />
            <input type="number" step="0.01" class="dt-filter-search dt-filter-max" placeholder="${escapeHtml(filterDef.placeholderMax || 'Maksimum')}" value="${escapeHtml(stagedMax)}" aria-label="${escapeHtml(filterDef.label)} maksimum" />
          </div>`;
        body.querySelector('.dt-filter-min').addEventListener('input', event => { stagedMin = event.target.value; });
        body.querySelector('.dt-filter-max').addEventListener('input', event => { stagedMax = event.target.value; });
      };
      const renderActiveTab = () => {
        tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.kpiTab === activeSubTab));
        if (activeSubTab === 'strata') renderStrataTab(); else renderRangeTab();
      };
      tabButtons.forEach(btn => btn.addEventListener('click', () => { activeSubTab = btn.dataset.kpiTab; renderActiveTab(); }));
      renderActiveTab();

      popover.querySelector('.dt-filter-apply').addEventListener('click', () => {
        if (activeSubTab === 'strata') {
          // Terapkan Strata -> nonaktifkan Minimum-Maksimum untuk kolom ini (hanya satu metode aktif), nilai minmax tetap tersimpan
          if (!stagedStrataIds.size) { delete this.activeHeaderFilters[key]; }
          else this.activeHeaderFilters[key] = { type: 'kpi-combined', mode: 'strata', strataIds: Array.from(stagedStrataIds), min: stagedMin !== '' ? Number(stagedMin) : null, max: stagedMax !== '' ? Number(stagedMax) : null };
        } else {
          const minVal = stagedMin.trim(); const maxVal = stagedMax.trim();
          if ((minVal !== '' && !Number.isFinite(Number(minVal))) || (maxVal !== '' && !Number.isFinite(Number(maxVal)))) { showToast('Nilai filter harus berupa angka.', 'error'); return; }
          const minNum = minVal !== '' ? Number(minVal) : null;
          const maxNum = maxVal !== '' ? Number(maxVal) : null;
          if (minNum !== null && maxNum !== null && minNum > maxNum) { showToast('Minimum tidak boleh lebih besar dari maksimum.', 'error'); return; }
          // Terapkan Minimum-Maksimum -> nonaktifkan Strata untuk kolom ini, pilihan checkbox tetap tersimpan
          if (minNum === null && maxNum === null) { delete this.activeHeaderFilters[key]; }
          else this.activeHeaderFilters[key] = { type: 'kpi-combined', mode: 'range', strataIds: Array.from(stagedStrataIds), min: minNum, max: maxNum };
        }
        this.page = 1; this.closeFilterPopover(); this.render();
      });
      popover.querySelector('.dt-filter-reset').addEventListener('click', () => {
        delete this.activeHeaderFilters[key]; this.page = 1; this.closeFilterPopover(); this.render();
      });
    }

    this._filterPopover = popover;
    buttonEl.setAttribute('aria-expanded', 'true');

    this._filterAbortController = new AbortController();
    const signal = this._filterAbortController.signal;
    document.addEventListener('click', (e) => { if (!popover.contains(e.target) && e.target !== buttonEl && !buttonEl.contains(e.target)) this.closeFilterPopover(); }, { signal });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') this.closeFilterPopover(); }, { signal });
    window.addEventListener('scroll', () => this.closeFilterPopover(), { signal, capture: true });
    window.addEventListener('resize', () => this.closeFilterPopover(), { signal });
    window.addEventListener('hashchange', () => this.closeFilterPopover(), { signal });
  }

  async downloadJpg() {
    if (this._jpgBusy) return;
    const rows = this.getFiltered();
    if (rows.length === 0) { showToast('Tidak ada data yang dapat diunduh.', 'info'); return; }
    this._jpgBusy = true; this.render();
    showLoadingOverlay('Sedang menyiapkan JPG...');
    try {
      const jpgColumns = this.columns.filter(c => !c.excludeFromJpg);
      const baseFilterSummary = typeof this.jpgFilterSummary === 'function' ? this.jpgFilterSummary() : this.jpgFilterSummary;
      const quickLabels = { bottom3: 'Bottom 3', critical: 'Critical', need: 'Need Improvement', goodplus: 'Good+' };
      const filterSummary = [...(baseFilterSummary || [])];
      // Chip "TAT Hari Ini" sengaja TIDAK disertakan pada JPG Ranking.
      if (this.quickStatusEnabled && this.quickStatusFilter !== 'all') filterSummary.push(`Status: ${quickLabels[this.quickStatusFilter] || this.quickStatusFilter}`);
      if (this.countifEnabled && (this.countifActiveFilter === 'gte' || this.countifActiveFilter === 'lt')) {
        const countifThreshold = this.getCountifThresholdValue();
        if (countifThreshold !== null && Number.isFinite(countifThreshold)) {
          const countifIndicator = this.getCountifIndicator();
          filterSummary.push(`Filter: ${countifIndicator.label} ${this.countifActiveFilter === 'gte' ? '≥' : '<'}${formatCountifThresholdDisplay(countifIndicator, countifThreshold)}`);
        }
      }
      if (this.sortingEnabled && this.sortKey && this.sortDir) {
        const sortIndicator = getCountifIndicatorById(this.sortKey);
        filterSummary.push(`Urutan: ${sortIndicator.label} ${this.sortDir === 'desc' ? 'tertinggi' : 'terendah'}`);
      }
      const fileCount = await generateJpgReport({
        rows, columns: jpgColumns, title: this.jpgTitle, subtitle: this.jpgSubtitle,
        filterSummary, kpiSummary: this.jpgKpiSummary, filenameBase: this.jpgFilename, rowsPerPage: this.jpgRowsPerPage,
        isRankingTable: this.isRankingTable, rankingTotal: this.rankingTotal, groupedHeader: this.groupedHeader,
        rankingVisualMode: this.rankingVisualMode
      });
      showToast(fileCount > 1 ? `${fileCount} file JPG berhasil diunduh.` : 'JPG berhasil diunduh.', 'success');
    } catch (err) {
      console.error(err);
      showToast('JPG gagal dibuat. Silakan coba kembali.', 'error');
    } finally {
      this._jpgBusy = false; this.render(); hideLoadingOverlay();
    }
  }
}

/* ============================================================
   JPG EXPORT (dipakai bersama oleh seluruh DataTable & drawer detail Salesman)
   ============================================================ */
const JPG_CATEGORY_COLORS = {
  'cat-outstanding': '#946f00', 'cat-excellent': '#1f9d55', 'cat-verygood': '#2f7fd1',
  'cat-good': '#1f9d55', 'cat-needimprove': '#d98a20', 'cat-critical': '#d64545',
  'cat-perfect': '#1f9d55', 'cat-great': '#2f7fd1', 'cat-bad': '#d64545', 'badge-muted': '#6b7280'
};
function sanitizeFilenamePart(s) {
  return String(s || '').replace(/[\/\\:*?"<>|%≥≤]/g, '').replace(/\s+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
}
function jpgKpiSummaryHtml() {
  const w = State.settings.weights;
  const g = (id) => w[id] ?? 0;
  const totalProses = g('scJks') + g('geofencing');
  const totalProd = g('roaCb') + g('hitRate') + g('avgEcAch');
  const totalRev = g('revenue') + g('strata2');
  return `<div class="jpg-export-kpi-summary">
    <div><b>PROSES KERJA ${totalProses}%</b> — SC vs JKS ${g('scJks')}% | Geofencing ${g('geofencing')}%</div>
    <div><b>PRODUCTIVITY ${totalProd}%</b> — ROA ${g('roaCb')}% | EC vs Call Total ${g('hitRate')}% | Golden EC ${g('avgEcAch')}%</div>
    <div><b>REVENUE TOTAL ${totalRev}%</b> — Total Omset ${g('revenue')}% | EPB Strata 2 ${g('strata2')}%</div>
  </div>`;
}
function jpgCellHtml(column, row, isNameColumn, rankingVisualMode = 'standard') {
  if (column.key === 'rank' && row.rank !== undefined) {
    const medal = rankingVisualMode === 'phase'
      ? (row.rank === 1 ? '🥇' : '')
      : (row.rank === 1 ? '🥇' : row.rank === 2 ? '🥈' : row.rank === 3 ? '🥉' : '');
    const delta = plainDeltaText(row.comparison && row.comparison.rankDelta, 'rank', row.comparison);
    return `<td>${medal ? `<span class="jpg-export-medal">${medal}</span> ` : ''}${row.rank}${delta ? `<span class="jpg-delta">${escapeHtml(delta)}</span>` : ''}</td>`;
  }
  if (column.key === 'finalScore') {
    return `<td><strong>${escapeHtml(fmtNumber(row.finalScore, 2))}</strong></td>`;
  }
  if (column.key === 'category.label' && row.category) {
    const color = JPG_CATEGORY_COLORS[row.category.cls] || '#6b7280';
    return `<td><span class="jpg-export-badge" style="background-color:${color}">${escapeHtml(row.category.label)}</span></td>`;
  }
  if (column.isPrimaryCell) {
    const name = column.jpgValue ? column.jpgValue(row) : getPath(row, column.key);
    const metaText = column.metaFn ? column.metaFn(row) : '';
    return `<td class="jpg-export-name-cell"><div class="jpg-primary-name">${escapeHtml(name || '-')}</div>${metaText ? `<div class="jpg-primary-meta">${escapeHtml(metaText)}</div>` : ''}</td>`;
  }
  let val;
  if (column.jpgValue) val = column.jpgValue(row);
  else if (column.csvValue) val = column.csvValue(row);
  else val = String(column.render(row)).replace(/<[^>]+>/g, '');
  if (val === null || val === undefined || val === '') val = '-';
  const alignCls = column.align === 'left' ? 'ta-left' : ''; // default CSS sudah rata tengah
  return `<td class="${alignCls} ${isNameColumn ? 'jpg-export-name-cell' : ''}">${escapeHtml(String(val))}</td>`;
}

/**
 * generateJpgReport: membangun container laporan sementara di luar viewport,
 * merender judul + filter aktif + ringkasan bobot KPI (opsional) + tabel per halaman,
 * menjalankan html2canvas, mengunduh tiap halaman sebagai JPG, lalu membersihkan DOM.
 * Mengembalikan jumlah file yang berhasil diunduh.
 */
async function generateJpgReport({ rows, columns, title, subtitle, filterSummary, kpiSummary, filenameBase, rowsPerPage, isRankingTable = false, rankingTotal = 0, groupedHeader = false, rankingVisualMode = 'standard' }) {
  if (typeof html2canvas === 'undefined') throw new Error('html2canvas belum termuat.');
  const perPage = rowsPerPage || 25;
  const totalPages = Math.max(1, Math.ceil(rows.length / perPage));
  const safeBase = sanitizeFilenamePart(filenameBase || 'Laporan') || 'Laporan';
  let downloaded = 0;
  const nameColIdx = columns.findIndex(c => c.sticky && c.key !== 'rank');

  for (let p = 0; p < totalPages; p++) {
    const chunk = rows.slice(p * perPage, (p + 1) * perPage);
    const container = document.createElement('div');
    container.className = 'jpg-export-container';
    container.style.width = `${Math.max(1800, columns.reduce((sum, column) => sum + (Number(column.width) || 130), 0) + 96)}px`;
    container.innerHTML = `
      <div class="jpg-export-header">
        <div class="jpg-export-header-copy">
          <div class="jpg-export-title">${escapeHtml(title || 'LAPORAN')}</div>
          ${subtitle ? `<div class="jpg-export-subtitle">${escapeHtml(subtitle)}</div>` : ''}
          ${(filterSummary && filterSummary.length) ? `<div class="jpg-export-filter">${filterSummary.map(escapeHtml).join(' &nbsp;|&nbsp; ')}</div>` : ''}
        </div>
        <img class="jpg-export-logo" src="${BRAND_LOGO_FULL_DATA_URI}" alt="PT. Pinus Merah Abadi | Nabati" />
      </div>
      ${kpiSummary ? jpgKpiSummaryHtml() : ''}
      <table class="jpg-export-table${groupedHeader ? ' has-grouped-header' : ''}">
        <thead>${buildJpgRankingHeaderHtml(columns, groupedHeader)}</thead>
        <tbody>${chunk.map(row => {
          const rankCls = isRankingTable ? getRankingJpgRowClasses(row, rankingTotal, rankingVisualMode) : '';
          return `<tr class="${rankCls}">${columns.map((c, ci) => jpgCellHtml(c, row, ci === nameColIdx, rankingVisualMode)).join('')}</tr>`;
        }).join('')}</tbody>
      </table>
      ${columns.some(column => column.key === 'revenueNominal.actual' || column.key === 'revenueNominal.target') ? '<div class="jpg-money-note">Jt = juta • M = miliar • T = triliun</div>' : ''}
      ${totalPages > 1 ? `<div class="jpg-export-page-number">Halaman ${p + 1} dari ${totalPages}</div>` : ''}
    `;
    document.body.appendChild(container);
    try {
      showLoadingOverlay(totalPages > 1 ? `Menyiapkan JPG ${p + 1} dari ${totalPages}...` : 'Sedang menyiapkan JPG...');
      let scale = 2;
      let canvas;
      try {
        canvas = await html2canvas(container, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false });
      } catch (errFirstTry) {
        scale = 1.5;
        canvas = await html2canvas(container, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false });
      }
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      const fname = totalPages > 1
        ? `${safeBase}_${String(p + 1).padStart(2, '0')}.jpg`
        : `${safeBase}_01.jpg`;
      const a = document.createElement('a'); a.href = dataUrl; a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      downloaded++;
      if (p < totalPages - 1) await new Promise(r => setTimeout(r, 350)); // jeda antar-download
    } finally {
      container.remove();
    }
  }
  return downloaded;
}

const ChartRegistry = {}; // menyimpan instance Chart.js aktif agar bisa di-destroy sebelum digambar ulang
function renderChart(canvasId, config) {
  if (typeof Chart === 'undefined') return null;
  const ctx = document.getElementById(canvasId); if (!ctx) return null;
  if (ChartRegistry[canvasId]) { ChartRegistry[canvasId].destroy(); delete ChartRegistry[canvasId]; }
  const chart = new Chart(ctx, config);
  ChartRegistry[canvasId] = chart;
  return chart;
}

function renderKpiInfoPanel(settings) {
  const groups = {};
  APP_CONFIG.KPI_DEFS.forEach(d => { if (!groups[d.group]) groups[d.group] = []; groups[d.group].push(d); });
  let groupsHtml = '';
  Object.keys(groups).forEach(gKey => {
    const defs = groups[gKey];
    const totalW = defs.reduce((s, d) => s + (settings.weights[d.id] || 0), 0);
    groupsHtml += `<div class="kpi-info-group">
      <div class="kpi-info-group-title">${APP_CONFIG.GROUP_LABELS[gKey]} — TOTAL BOBOT ${totalW}%</div>

          <div class="kpi-info-item-head"><strong>${d.label}</strong><span class="kpi-info-weight">${settings.weights[d.id] || 0}%</span></div>
          <div class="kpi-info-formula">${escapeHtml(d.formula)}</div>
          <div class="kpi-info-desc">${escapeHtml(d.info)}</div>
        </div>`).join('')}
    </div>`;
  });
  return `<div class="kpi-panel">
      <button class="kpi-panel-toggle" id="kpi-panel-toggle-btn"><span>📋 Metode Penilaian dan Bobot KPI</span><span class="kpi-panel-caret">▾</span></button>

        <div class="kpi-info-groups">${groupsHtml}</div>
        <div class="kpi-info-cap">Skor tiap KPI dibatasi maksimum <strong>${settings.scoreCap}</strong> poin (nilai aktual tetap ditampilkan apa adanya). EPB 6 dan Golden Process tidak tersedia sebagai KPI aktif.</div>
      </div>
    </div>`;
}
function wireKpiInfoPanel() {
  const btn = document.getElementById('kpi-panel-toggle-btn'), body = document.getElementById('kpi-panel-body');

  btn.addEventListener('click', () => { const isOpen = body.style.display !== 'none'; body.style.display = isOpen ? 'none' : 'block'; btn.querySelector('.kpi-panel-caret').textContent = isOpen ? '▾' : '▴'; });
}
function renderSnapshotMetaBar(snapshot, validation) {

      <div><span class="meta-label">Snapshot</span><span class="meta-value">${escapeHtml(snapshot.fileName)}</span></div>
      <div><span class="meta-label">Sheet</span><span class="meta-value">${escapeHtml(snapshot.sheetName || '-')}</span></div>
      <div><span class="meta-label">Cut-off</span><span class="meta-value">${fmtDateId(snapshot.cutoffDate)}</span></div>

      // JALUR PERIOD: revisi publikasi dan normalisasi metadata payload dilakukan BACKEND
      // secara atomic (advisory lock per periode), sehingga tidak perlu retry duplikat.
      const publishOnce = async currentPayload => {
        if (State.periodFeatureReady && typeof window.SupabaseService.publishPeriodSnapshot === 'function') {
          const result = await window.SupabaseService.publishPeriodSnapshot(currentPayload, {
            ...currentPayload.metadata,
            periodKey: publishPeriodKey,

        }
        const id = await window.SupabaseService.publishNationalSnapshot(currentPayload, currentPayload.metadata);

      };
      try {
        const result = await publishOnce(payload);
        snapshotId = result.id; publishedRevision = result.revision;
      } catch (error) {
        // SATU retry aman KHUSUS bentrok UNIQUE akibat race condition (relevan pada jalur legacy):
        // ambil revisi terbaru lagi, bangun ulang payload, coba sekali. Tidak pernah menimpa/menghapus
        // publikasi lama dan tidak pernah retry berulang.
        if (!isDuplicateRevisionError(error)) throw error;
        const retryPayload = await buildFinalPayload();
        const result = await publishOnce(retryPayload);
        snapshotId = result.id; publishedRevision = result.revision;
        payload = retryPayload;
      }
      // Setelah publish, muat ulang daftar periode dan tampilkan periode yang baru dipublikasikan.
      await refreshOfficialPeriods();
      State.activePeriodKey = publishPeriodKey;
      overlay.querySelector('[data-act="close"]').click();
      showToast(`Publikasi ${periodOptionLabel(publishPeriodKey, publishPeriodStatus)} berhasil — Rev Publikasi ${fmtNumber(publishedRevision)} (${fmtNumber(payload.metadata.publishScope.includedRegionCount)} Regional). ID: ${snapshotId}`, 'success');

    } catch (error) {
      errorEl.textContent = safeUserError(error, 'Publikasi gagal.');
      confirmBtn.disabled = false;
      confirmBtn.textContent = originalLabel;
      renderPreview();
    } finally {
      State.publicationBusy = false;
    }
  });
}

/* ------------------------------------------------------------
   BATALKAN PUBLISH — DETEKSI CAPABILITY BACKEND
   ------------------------------------------------------------
   HASIL AUDIT (setup.sql, period-history-migration.sql, supabase-service.js):
   backend saat ini BELUM memiliki RPC/service pembatalan publikasi. RPC yang
   tersedia hanya publish_national_snapshot, activate_published_snapshot,
   publish_period_snapshot_v1, dan activate_period_snapshot_v1 — semuanya
   MENGAKTIFKAN, tidak ada yang mencabut status official.

   Karena itu frontend HANYA mendeteksi dan memanggil service bila tersedia.
   TIDAK ADA fallback direct UPDATE ke published_snapshots: selain melanggar
   arsitektur, role anon/authenticated memang hanya diberi GRANT SELECT pada
   kolom tertentu (setup.sql §"revoke all privileges" + migration §13), sehingga
   UPDATE dari browser pasti ditolak database. Membuat "berhasil" secara lokal
   akan menjadi fake success dan itu dilarang.

   Nama service disiapkan untuk Phase 2. Beberapa alias diterima agar penamaan
   final di supabase-service.js tidak memaksa index.html diubah lagi.
   ------------------------------------------------------------ */
const PUBLICATION_CANCEL_SERVICE_METHODS = [
  'cancelPeriodPublication',
  'cancelPublishedPeriod',
  'cancelPeriodSnapshot'
];
// Mengembalikan { name, invoke } bila backend sudah menyediakan pembatalan, atau null.
function publicationCancelCapability() {
  const service = window.SupabaseService;
  if (!service) return null;
  const name = PUBLICATION_CANCEL_SERVICE_METHODS.find(method => typeof service[method] === 'function');
  if (!name) return null;
  return { name, invoke: (publicationId, periodKey) => service[name](publicationId, periodKey) };
}
const PUBLICATION_CANCEL_UNAVAILABLE_MESSAGE =
  'Fitur Batalkan Publish belum tersedia pada backend. Perbarui Supabase Service dan Period Migration terlebih dahulu.';

// Baris boleh dibatalkan hanya bila benar-benar publikasi RESMI periode tersebut.
function canCancelPublicationRow(row, periodMode) {
  return !!row
    && periodMode === true
    && row.isPeriodCurrent === true
    && isRankingAdminView()
    && !!String(row.id || '').trim()
    && isValidPeriodKey(row.periodKey);
}

/**
 * Invalidasi setelah pembatalan BERHASIL. Narrowly-scoped: hanya periode yang
 * dibatalkan. Cache periode lain tidak disentuh.
 * trendSeriesCache di-clear seluruhnya karena kunci seriesnya memuat signature
 * daftar official period — begitu satu periode hilang, seluruh entry lama memang
 * sudah tidak dapat dipakai lagi.
 */
function invalidateCancelledPublicationCaches(periodKey) {
  const key = normalizePeriodKeyValue(periodKey);
  if (!key) return;
  if (State.trendPayloadCache instanceof Map) {
    Array.from(State.trendPayloadCache.keys())
      .filter(cacheKey => String(cacheKey).startsWith(`${key}|`))
      .forEach(cacheKey => State.trendPayloadCache.delete(cacheKey));
  }
  if (State.trendSeriesCache instanceof Map) State.trendSeriesCache.clear();
  // Publikasi yang dibatalkan tidak boleh lagi dipakai sebagai data aktif.
  if (State.remotePublication && normalizePeriodKeyValue(State.remotePublication.periodKey) === key) {
    State.remotePublication = null;
  }
}

          // Kegagalan cleanup lokal BUKAN kegagalan pembatalan database — pembatalan
          // sudah commit di server dan tidak boleh di-rollback hanya karena IndexedDB
          // bermasalah, jadi errornya ditangani terpisah sebagai warning.
          let cacheCleanupFailed = false;
          try {
            await Storage.deleteViewerCache(rowPeriod);
          } catch (cacheError) {
            cacheCleanupFailed = true;
            console.error(`Cache Viewer ${rowPeriod} gagal dihapus setelah pembatalan:`, cacheError);
          }
          invalidateCancelledPublicationCaches(rowPeriod);
          await refreshOfficialPeriods();
          // Bila periode yang dibatalkan sedang ditampilkan, muat ulang dari daftar
          // official terbaru — Viewer tidak boleh jatuh ke revisi lama periode itu.
          if (normalizePeriodKeyValue(State.activePeriodKey) === normalizePeriodKeyValue(rowPeriod)) {
            State.activePeriodKey = newestPeriodKey(State.periods);
            if (State.runtimeMode === 'viewer') {
              await loadViewerNationalData({ allowCache: false, periodKey: State.activePeriodKey });
            }
          }
          hideLoadingOverlay();
          showToast(`Publikasi ${periodLabel} dibatalkan. Periode ini tidak lagi memiliki data resmi.`, 'success');
          // Pembatalan tetap dinyatakan BERHASIL; cleanup cache lokal dilaporkan terpisah.
          if (cacheCleanupFailed) {
            showToast(`Cache Viewer ${periodLabel} gagal dibersihkan di perangkat ini. Muat ulang halaman bila periode tersebut masih terlihat saat offline.`, 'info');
          }
          renderSidebar();
          router();
        } catch (error) {
          hideLoadingOverlay();
          cancelButtons.forEach(btn => { btn.disabled = false; });
          showToast(safeUserError(error, 'Pembatalan publikasi gagal.'), 'error');
        } finally {
          State.publicationBusy = false;
        }
      }, { confirmLabel: 'Ya, Batalkan Publish', cancelLabel: 'Kembali' });
    }));
  } catch (error) {
    container.innerHTML = `<div class="alert alert-error">${escapeHtml(safeUserError(error, 'Riwayat publikasi gagal dimuat.'))}</div>`;
  }
}

function parseHash() {
  const hash = location.hash.replace('#', '') || '/dashboard';
  const [path, queryStr] = hash.split('?');
  return { path, params: new URLSearchParams(queryStr || '') };
}
function navigate(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  location.hash = `#${path}${qs ? '?' + qs : ''}`;
}
function cardLink(path, params) { const qs = new URLSearchParams(params || {}).toString(); return `#${path}${qs ? '?' + qs : ''}`; }

function buildBreadcrumb(path, params) {
  const crumbs = [{ label: 'Dashboard', link: '/dashboard' }];
  if (path === '/dashboard') return crumbs;
  crumbs.push({ label: PAGE_TITLES[path] || path, link: null });
  if (path === '/ranking-depo' && params.get('region')) crumbs.splice(1, 0, { label: 'Ranking Regional', link: '/ranking-regional' });
  if (path === '/ranking-cabang' && params.get('region')) crumbs.splice(1, 0, { label: 'Ranking Regional', link: '/ranking-regional' });
  if (path === '/ranking-ass' && params.get('value')) crumbs.splice(1, 0, { label: 'Ranking Depo', link: '/ranking-depo' });
  if (path === '/ranking-salesman' && params.get('value')) crumbs.splice(1, 0, { label: 'Ranking ASS', link: '/ranking-ass' });
  return crumbs;
}

const LEGACY_BLOCKED_PATHS = new Set(['/dashboard', '/ranking-phase', '/ranking-regional', '/ranking-cabang', '/ranking-depo', '/ranking-ass', '/ranking-salesman', '/detail-kpi', '/simulasi-ranking', '/belum-eligible']);
function router() {
  if (State.pageAbortController) State.pageAbortController.abort(); // E: putuskan seluruh listener global halaman sebelumnya
  State.pageAbortController = new AbortController();
  State.pageSignal = State.pageAbortController.signal;
  let { path, params } = parseHash();
  const rankingLevelByPath = { '/ranking-phase': 'phase', '/ranking-regional': 'regional', '/ranking-cabang': 'cabang', '/ranking-depo': 'depo', '/ranking-ass': 'ass', '/ranking-salesman': 'salesman' };
  if (rankingLevelByPath[path]) State.lastRankingLevel = rankingLevelByPath[path];
  else if (path === '/detail-kpi' && ['phase', 'regional', 'cabang', 'depo', 'ass', 'salesman'].includes(params.get('level'))) State.lastRankingLevel = params.get('level');
  if (isAdminRoute(path) && !State.isAdmin) {
    showToast('Akses admin diperlukan.', 'error');
    history.replaceState(null, document.title, `${location.pathname}${location.search}#/dashboard`);
    path = '/dashboard';
    params = new URLSearchParams();
  }
  const renderFn = ROUTES[path] || renderDashboardPage;
  const highlightKey = (path === '/upload' && params.get('tab') === 'riwayat') ? '/upload-riwayat' : path;
  highlightSidebar(highlightKey);
  renderTopbar(path, params);
  const root = document.getElementById('app-root');
  if (!State.activeSnapshot && !isAdminRoute(path)) {
    root.innerHTML = renderNoDataState(); wireNoDataState(); return;
  }
  if (State.activeSnapshot && State.isLegacyHitRateSnapshot && LEGACY_BLOCKED_PATHS.has(path)) {
    root.innerHTML = renderLegacySnapshotState(); wireLegacySnapshotState(); return;
  }
  root.innerHTML = `${publicDataBannerHtml()}${tatLegacyBannerHtml()}${renderFn(params)}`;
  const wireFn = WIRE_FNS[path]; if (wireFn) wireFn(params);
}
function renderLegacySnapshotState() {
  const snapshot = State.activeSnapshot || {};
  return `<div class="empty-state"><div class="empty-state-icon">⚠️</div><h2>Struktur EC vs Call Total Lama</h2>

function wireLegacySnapshotState() {

function renderNoDataState() {

    <p>Upload file Excel data harian untuk mulai menggunakan workspace Admin.</p>

}

const BRAND_LOGO_HTML = `
  <span class="sidebar-brand-card">
    <img class="sidebar-brand-logo-full" src="${BRAND_LOGO_FULL_DATA_URI}" alt="PT. Pinus Merah Abadi | Nabati" draggable="false" />
    <img class="sidebar-brand-logo-icon" src="${BRAND_LOGO_ICON_DATA_URI}" alt="PT. Pinus Merah Abadi" draggable="false" />

function renderSidebar() {
  const el = document.getElementById('sidebar');
  let groupsHtml = '';
  let currentGroup = '__none__';
  SIDEBAR_ITEMS.filter(item => !item.adminOnly || State.isAdmin).forEach(item => {
    if (item.group !== currentGroup) {
      currentGroup = item.group;
      if (item.group) groupsHtml += `<div class="sidebar-group-title">${escapeHtml(item.group)}</div>`;
    }
    const href = item.hrefOverride || `#${item.path}`;
    const dataPath = item.highlightKey || item.path;
    groupsHtml += `<a href="${href}" class="sidebar-link" data-path="${dataPath}" title="${escapeHtml(item.label)}">
        <span class="sidebar-icon">${item.icon}</span><span class="sidebar-label">${item.label}</span></a>`;
  });
  el.innerHTML = `
    <div class="sidebar-header">
      <a href="#/dashboard" class="sidebar-brand" title="PT. Pinus Merah Abadi | Nabati — kembali ke Dashboard Utama" aria-label="Dashboard Utama">
        ${BRAND_LOGO_HTML}
      </a>
      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Perkecil/perbesar sidebar" aria-label="Perkecil/perbesar sidebar">‹</button>
    </div>
    <nav class="sidebar-nav">${groupsHtml}</nav>`;
  const appShell = document.getElementById('app-shell');
  const collapseBtn = document.getElementById('sidebar-collapse-btn');
  const syncCollapseIcon = () => { collapseBtn.textContent = appShell.classList.contains('sidebar-collapsed') ? '›' : '‹'; };
  collapseBtn.addEventListener('click', () => {
    const collapsed = appShell.classList.toggle('sidebar-collapsed');
    LocalPrefs.setSidebarCollapsed(collapsed);
    syncCollapseIcon();
  });
  if (LocalPrefs.getSidebarCollapsed()) appShell.classList.add('sidebar-collapsed');
  syncCollapseIcon();
}
function highlightSidebar(path) {
  document.querySelectorAll('.sidebar-link').forEach(a => a.classList.toggle('active', a.dataset.path === path));
}

let __activeDataPopover = null;
function closeActiveDataPopover() {
  if (__activeDataPopover) { __activeDataPopover.remove(); __activeDataPopover = null; }
  const trigger = document.getElementById('topbar-data-summary');
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
}
function activeDataSummaryText() {
  if (!State.activeSnapshot || !State.validation) return '';
  const valid = Number(State.validation.totalEligible || 0);
  const total = Number(State.validation.totalRead || 0);
  const parts = [`Data: ${fmtDateId(State.activeSnapshot.cutoffDate)}`];
  if (State.activePhaseFilters.size) parts.push(globalPhaseFilterLabel());
  if (State.activeRegionFilters.size) parts.push(globalRegionFilterLabel());
  parts.push(`${fmtNumber(valid)}/${fmtNumber(total)} valid`);
  if (isValidTatMtdValue(State.activeSnapshot.tatMtd)) parts.push(`TAT ${fmtPercent(State.activeSnapshot.tatMtd, 0)}`);
  return parts.join(' • ');
}
function openActiveDataPopover(button) {
  closeActiveDataPopover();
  const snapshot = State.activeSnapshot;
  if (!snapshot || !State.validation) return;
  const popover = document.createElement('div');
  popover.className = 'topbar-data-popover';
  popover.innerHTML = `
    <div class="topbar-data-popover-title">Data yang Sedang Digunakan</div>
    <div class="topbar-data-popover-grid">
      <div class="topbar-data-popover-label">File</div><div class="topbar-data-popover-value">${escapeHtml(snapshot.fileName || '-')}</div>
      <div class="topbar-data-popover-label">Periode</div><div class="topbar-data-popover-value">${escapeHtml(periodOptionLabel(snapshotPeriodKey(snapshot), snapshotPeriodStatus(snapshot)))}</div>
      <div class="topbar-data-popover-label">Tanggal data</div><div class="topbar-data-popover-value">${fmtDateId(snapshot.cutoffDate)}</div>
      <div class="topbar-data-popover-label">Revisi Data</div><div class="topbar-data-popover-value">${fmtNumber(snapshot.revisionNumber || 1)}</div>
      <div class="topbar-data-popover-label">Waktu upload</div><div class="topbar-data-popover-value">${fmtDateTimeId(snapshot.uploadedAt)}</div>
      <div class="topbar-data-popover-label">Phase aktif</div><div class="topbar-data-popover-value">${escapeHtml(State.activePhaseFilters.size ? globalPhaseFilterValues().join(', ') : 'Semua Phase')}</div>
      <div class="topbar-data-popover-label">Regional aktif</div><div class="topbar-data-popover-value">${escapeHtml(State.activeRegionFilters.size ? globalRegionFilterValues().join(', ') : 'Semua Regional')}</div>
      <div class="topbar-data-popover-label">Data valid</div><div class="topbar-data-popover-value">${fmtNumber(State.validation.totalEligible || 0)}</div>
      <div class="topbar-data-popover-label">Bermasalah</div><div class="topbar-data-popover-value">${fmtNumber(State.validation.totalNotEligible || 0)}</div>
      <div class="topbar-data-popover-label">EC vs Call Total</div><div class="topbar-data-popover-value">TOTAL CALL ESUITE</div>
      <div class="topbar-data-popover-label">TAT MTD</div><div class="topbar-data-popover-value">${isValidTatMtdValue(snapshot.tatMtd) ? fmtPercent(snapshot.tatMtd) : '-'}</div>
      <div class="topbar-data-popover-label">Pembanding</div><div class="topbar-data-popover-value">${escapeHtml(comparisonSnapshotLabel())}</div>
    </div>
    <div class="topbar-data-popover-foot">Klik informasi ini kapan saja untuk memastikan file dan periode analisis yang sedang aktif.</div>`;
  document.body.appendChild(popover);
  const rect = button.getBoundingClientRect();
  const width = popover.offsetWidth;
  let left = rect.right - width;
  if (left < 12) left = 12;
  let top = rect.bottom + 7;
  if (top + popover.offsetHeight > window.innerHeight) top = Math.max(12, rect.top - popover.offsetHeight - 7);
  popover.style.left = `${left}px`;
  popover.style.top = `${top}px`;
  __activeDataPopover = popover;
  button.setAttribute('aria-expanded', 'true');
  setTimeout(() => {

/* ------------------------------------------------------------
   PERIODE LOKAL ADMIN (workspace IndexedDB)
   ------------------------------------------------------------
   Terpisah tegas dari periode Viewer:
     ADMIN  -> State.snapshotList (lokal, boleh berisi revisi yang BELUM dipublish)
     VIEWER -> State.periods (official/current dari Supabase)

   Untuk setiap bulan diambil SATU snapshot lokal: REVISI DATA TERBARU.
   Karena Revisi Data kini sequential per bulan, "terbaru" = revisionNumber terbesar,
   dengan uploadedAt sebagai tie-break. Label bulan mengikuti status snapshot tersebut,
   sehingga hanya ada satu entri per bulan (bukan "Agustus MTD" + "Agustus Closing").
   ------------------------------------------------------------ */
function latestLocalSnapshotForPeriod(periodKey) {
  const candidates = localSnapshotsForPeriod(periodKey);
  if (!candidates.length) return null;
  return candidates.slice().sort((a, b) => {
    const revDiff = getSnapshotRevisionNumber(b) - getSnapshotRevisionNumber(a);
    if (revDiff) return revDiff;
    return snapshotUploadedAtValue(b) - snapshotUploadedAtValue(a);
  })[0];
}
function adminLocalPeriodOptions() {
  const snapshots = Array.isArray(State.snapshotList) ? State.snapshotList : [];
  const keys = new Set();
  snapshots.forEach(snapshot => {
    const key = snapshotPeriodKeyForRevision(snapshot);
    if (key) keys.add(key);
  });
  return [...keys]
    .sort((a, b) => (a < b ? 1 : (a > b ? -1 : 0)))   // period_key TERBESAR lebih dulu
    .map(periodKey => {
      const snapshot = latestLocalSnapshotForPeriod(periodKey);
      return snapshot ? {
        periodKey,
        periodStatus: normalizePeriodStatusValue(snapshot.periodStatus) || PERIOD_STATUS_MTD,
        snapshot
      } : null;
    })
    .filter(Boolean);
}
// Default Admin = period_key TERBESAR dari snapshot lokal, BUKAN uploadedAt terbaru.
// Backfill Juni yang di-upload hari ini tidak menggeser default dari September.
function defaultAdminPeriodKey() {
  const options = adminLocalPeriodOptions();
  return options.length ? options[0].periodKey : null;
}
/**
 * Admin berpindah periode: memuat REVISI DATA LOKAL TERBARU bulan tersebut sebagai
 * State.activeSnapshot, lalu membangun ulang validation/hierarchy/comparison/cache
 * lewat loadSnapshotIntoState() existing. Tidak ada engine ranking baru, dan
 * TIDAK PERNAH mengambil snapshot published Viewer.
 */
async function setActiveAdminPeriod(periodKey) {
  const key = normalizePeriodKeyValue(periodKey);
  if (!key || State.periodBusy) return;
  const snapshot = latestLocalSnapshotForPeriod(key);
  if (!snapshot) {
    // Tidak mengarang data: periode tanpa snapshot lokal memang tidak ditawarkan.
    showToast(`Belum ada data lokal untuk ${periodMonthLabel(key)}.`, 'error');
    renderTopbar(parseHash().path, parseHash().params);
    return;
  }
  if (State.activeSnapshot && State.activeSnapshot.id === snapshot.id) return;
  State.periodBusy = true;
  showLoadingOverlay(`Memuat data lokal ${periodMonthLabel(key)}...`);
  try {
    // Snapshot lokal dibaca ulang dari IndexedDB agar rawRecords lengkap
    // (State.snapshotList bisa berisi entri ringkas dari listSnapshots()).
    let full = snapshot;
    if (!Array.isArray(full.rawRecords) || !full.rawRecords.length) {
      const stored = await Storage.getSnapshot(snapshot.id);
      if (stored) full = stored;
    }
    await loadSnapshotIntoState(full);
    State.activePeriodKey = key;
    showToast(`Periode aktif: ${periodOptionLabel(key, snapshotPeriodStatus(full))} (Rev Data ${fmtNumber(getSnapshotRevisionNumber(full))}).`, 'success');
  } catch (error) {
    showToast(safeUserError(error, `Data lokal ${periodMonthLabel(key)} tidak dapat dimuat.`), 'error');
  } finally {
    State.periodBusy = false;
    hideLoadingOverlay();
    renderSidebar();
    router();
  }
}
